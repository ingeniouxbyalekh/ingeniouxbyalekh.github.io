<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · INGENIOUX</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/svg+xml" href="../Storage/Images/ingenioux_round.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">

<!-- shared site theme (root variables, .noise, fonts) -->
<link rel="stylesheet" href="../style.css">
<!-- admin-only layout -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="noise"></div>

<!-- ================= LOGIN ================= -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Admin <span>Access</span></h1>

    <form id="loginForm">
      <div class="login-field">
        <input type="password" id="adminPassword" name="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
    </form>

    <div class="login-status" id="loginStatus" role="status" aria-live="polite"></div>
  
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div class="admin-wrap" id="dashboard">
  <div class="admin-topbar">
    <div class="admin-brand">INGENIOU<span>X</span> <small>Admin · Messages</small></div>
    <div class="admin-actions">
      <button class="btn" id="togglePasswordPanel">Change password</button>
      <button class="btn btn-danger" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-chip"><b id="statTotal">0</b><span>Total messages</span></div>
    <div class="stat-chip"><b id="statUnread">0</b><span>Unread</span></div>
    <div class="stat-chip"><b id="statVisitors">0</b><span>Total visitors</span></div>
    <div class="stat-chip"><b id="statVisitorsToday">0</b><span>Visitors today</span></div>
  </div>

  <!-- ---- change password panel (hidden by default) ---- -->
  <div class="panel" id="passwordPanel" style="display:none;">
    <h2>Change admin password</h2>
    <div class="panel-row">
      <div class="field">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" autocomplete="current-password">
      </div>
      <div class="field"></div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password">
      </div>
    </div>
    <button class="btn btn-primary btn-small" id="savePasswordBtn">Save new password</button>
    <div class="panel-status" id="passwordStatus"></div>
  </div>

  <!-- ---- messages ---- -->
  <div class="panel">
    <div class="msg-toolbar">
      <h2>Submitted messages</h2>
      <div class="admin-actions">
        <div class="msg-filter">
          <button data-filter="all" class="active">All</button>
          <button data-filter="unread">Unread</button>
          <button data-filter="read">Read</button>
        </div>
        <button class="btn btn-small panel-toggle" id="msgPanelToggle" title="Minimize" aria-label="Minimize submitted messages">×</button>
      </div>
    </div>
    <div class="loading-row" id="msgLoading">Loading messages…</div>
    <div class="msg-list" id="msgList"></div>
  </div>

  <!-- ---- visitors ---- -->
  <div class="panel">
    <div class="msg-toolbar">
      <h2>Visitors</h2>
      <div class="admin-actions">
        <button class="btn btn-small btn-danger" id="clearVisitorsBtn">Clear all</button>
        <button class="btn btn-small panel-toggle" id="visitorPanelToggle" title="Minimize" aria-label="Minimize visitor list">×</button>
      </div>
    </div>
    <div class="visitor-filter-bar">
      <div class="visitor-filter-row">
        <input type="text" id="visitorIpFilter" list="visitorIpList" placeholder="IP address">
        <datalist id="visitorIpList"></datalist>
        <input type="text" id="visitorRegionFilter" list="visitorRegionList" placeholder="State / Region">
        <datalist id="visitorRegionList"></datalist>
        <input type="text" id="visitorCityFilter" list="visitorCityList" placeholder="City">
        <datalist id="visitorCityList"></datalist>
        <input type="text" id="visitorPostalFilter" list="visitorPostalList" placeholder="Postal code">
        <datalist id="visitorPostalList"></datalist>
      </div>
      <div class="visitor-filter-row">
        <input type="date" id="visitorDateFrom" title="From date">
        <input type="date" id="visitorDateTo" title="To date">
        <select id="visitorDeviceFilter">
          <option value="">All devices</option>
          <option value="Desktop">Desktop</option>
          <option value="Mobile">Mobile</option>
          <option value="Tablet">Tablet</option>
        </select>
        <button class="btn btn-primary btn-small" id="visitorFilterSearch">Search</button>
        <button class="btn btn-small" id="visitorFilterReset">Reset</button>
        <span class="filter-count" id="visitorFilterCount"></span>
      </div>
    </div>
    <div class="loading-row" id="visitorsLoading">Loading visitors…</div>
    <div class="visitor-cards-wrap" id="visitorTableWrap" style="display:none;">
      <div class="visitor-cards" id="visitorTableBody"></div>
    </div>
  </div>

  <!-- ---- failed login attempts ---- -->
  <div class="panel">
    <div class="msg-toolbar">
      <h2>Failed login attempts</h2>
      <div class="admin-actions">
        <button class="btn btn-small btn-danger" id="clearLoginLogsBtn">Clear all</button>
        <button class="btn btn-small panel-toggle" id="loginLogsPanelToggle" title="Minimize" aria-label="Minimize failed login attempts">×</button>
      </div>
    </div>
    <div class="loading-row" id="loginLogsLoading">Loading…</div>
    <div class="visitor-table-wrap" id="loginLogsTableWrap" style="display:none;">
      <table class="visitor-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>IP address</th>
            <th>Location</th>
            <th>Device</th>
            <th>Browser / OS</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="loginLogsTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
