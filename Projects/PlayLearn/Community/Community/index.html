<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUTR Community · PlayLearn</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">← PlayLearn</a>
  <h1>OUTR Community</h1>
  <div class="me" id="me" hidden><span class="av" id="me-av"></span><span id="me-name"></span></div>
</header>

<main>
  <p id="boot" class="muted">Loading…</p>
  <section id="hub" hidden>
    <div class="bar">
      <input id="q" type="search" placeholder="Search name or reg. no.">
      <span id="count" class="muted"></span>
      <a class="btn" href="chat.html">Open chat</a>
    </div>
    <ul id="list" class="grid"></ul>
    <p id="empty" class="muted" hidden>No members match.</p>
  </section>
</main>

<!-- Join gate: cannot be dismissed until a profile picture exists -->
<div id="gate" class="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="g-title">
    <h2 id="g-title">Add a profile picture to join</h2>
    <p class="muted">A profile picture is required to enter the community. Upload one to continue.</p>
    <label class="pick" for="file"><img id="prev" alt="" hidden><span id="pick-t">Choose a photo</span></label>
    <input id="file" type="file" accept="image/*" hidden>
    <p id="err" class="err" role="alert"></p>
    <button id="go" class="btn" disabled>Upload &amp; join</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/community.js"></script>
</body>
</html>
