<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustPoints admin: users</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../dashboard/style.css"><link rel="stylesheet" href="admin.css"></head>
<body><header><div class="brand"><span class="mark"></span>TrustPoints admin</div><button id="logout" class="ghost">Log out</button></header>
<p id="msg" hidden></p>
<main><div class="head"><h2>Users</h2><span id="count" class="muted"></span></div>
<input id="q" placeholder="Search name, email or number" type="search" aria-label="Search users"><div id="list"></div></main>
<script type="module">
import { db, fs, requireAdmin, kick } from "./fb.js";
const $ = (i) => document.getElementById(i), esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let users = [];
function render() {
  const q = $("q").value.trim().toLowerCase();
  const rows = users.filter((u) => !q || `${u.name} ${u.email} ${u.phone}`.toLowerCase().includes(q));
  $("count").textContent = `${rows.length} of ${users.length}`;
  $("list").innerHTML = rows.map((u) => `<a class="row" href="view.html?u=${encodeURIComponent(u.id)}" style="text-decoration:none;color:inherit"><div class="av">${esc((u.name || u.email)[0].toUpperCase())}</div><div class="g"><div class="n">${esc(u.name || "(no name)")}</div><div class="muted" style="overflow:hidden;text-overflow:ellipsis">${esc(u.email)}${u.phone ? " · " + esc(u.phone) : ""}</div></div></a>`).join("") || '<div class="empty">No users found.</div>';
}
requireAdmin().then((user) => {
  if (!user) return;
  fs.onSnapshot(fs.collection(db, "users"), (s) => { users = s.docs.map((d) => { const x = d.data().details || {}; return { id: d.id, name: x.name, email: x.email || d.id, phone: x.phone }; }).sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email)); render(); },
    (e) => { $("msg").textContent = "Could not read users: " + e.message; $("msg").hidden = false; });
});
$("q").addEventListener("input", render);
$("logout").addEventListener("click", () => kick());
</script></body></html>
