<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0724">
<title>TrustPoints admin: user</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../dashboard/style.css"><link rel="stylesheet" href="admin.css"></head>
<body><header><div class="bar"><div class="brand"><span class="mark" id="logo"></span>TrustPoints <span class="tag">Admin</span></div>
<div class="user"><div class="av" id="meav"></div><div class="who"><b id="mename"></b><span id="memail"></span></div></div>

<p id="msg" hidden></p>
<main><div id="summary" hidden></div><div id="emos" class="chips"></div>
<div class="split" id="split">
  <section class="side" aria-label="Contacts">
    <div class="head"><h2>Contacts</h2><span id="count" class="muted"></span></div>
    <div class="search"><span id="searchIc"></span><input id="q" placeholder="Search name or number" type="search" aria-label="Search contacts"></div>
    <div id="list"></div>
  </section>
  <section class="detail" id="detail"></section>
</div></main>
<script type="module" src="view.js"></script></body></html>
