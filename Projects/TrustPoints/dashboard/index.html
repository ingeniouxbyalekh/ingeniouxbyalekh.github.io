<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustPoints Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header>
  <div class="brand"><span class="mark"></span>TrustPoints</div>
  <nav id="tabs">
    <button data-v="contacts" class="on">Contacts</button><button data-v="stats">Statistics</button>
    <button data-v="emotions">Emotions</button><button data-v="settings">Settings</button>
  </nav>
  <button id="logout" class="ghost">Log out</button>
</header>
<main>
  <p id="msg" hidden></p>
  <section id="contacts" class="view">
    <div class="bar"><input id="q" placeholder="Search contacts" type="search"><button id="addc">+ Add contact</button></div>
    <div id="list" class="grid"></div>
  </section>
  <section id="stats" class="view" hidden></section>
  <section id="emotions" class="view" hidden></section>
  <section id="settings" class="view" hidden></section>
</main>
<div id="sheet" hidden><div class="panel"><button id="close" class="ghost x">Close</button><div id="detail"></div></div></div>
<script type="module" src="js/app.js"></script>
</body></html>
