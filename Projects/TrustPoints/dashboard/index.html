<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustPoints</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header>
  <div class="brand"><span class="mark"></span>TrustPoints</div>
  <div class="user"><div class="av" id="meav"></div><div class="who"><b id="mename"></b><span id="memail"></span></div></div>
  <button id="logout" class="ghost">Log out</button>
</header>
<p id="msg" hidden></p>
<main>
  <div class="head"><h2>Contacts</h2><span id="count" class="muted"></span></div>
  <input id="q" placeholder="Search name or number" type="search" aria-label="Search contacts">
  <div id="list"></div>
</main>
<div id="scrim" hidden></div>
<aside class="pane" id="pane" hidden><button id="back" class="ghost">Close</button><div id="detail"></div></aside>
<div id="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body></html>
