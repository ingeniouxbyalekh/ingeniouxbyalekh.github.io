<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print desk — NextPrint</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* =====================================================================
     NextPrint print desk — dashboard design
     ===================================================================== */
  :root { --ink:#17181c; --soft:#62625c; --mute:#8a887d; --line:#e3e0d4; --green:#2f7a4d; --amber:#a56200; --red:#c6332e; --blue:#1f6fb0; --r:18px; --shadow:0 1px 2px rgba(23,24,28,.05), 0 10px 26px -14px rgba(23,24,28,.22); }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid #1f5fa8; outline-offset:2px; }
  /* ===== v3: gate, app bar, stats, toolbar, modal ===== */
  body { background:#f4f2ea; font-family:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; color:#17181c; }
  button, input, select { font:inherit; }
  .pd-wrap { max-width:980px; margin:0 auto; padding:0 16px; }

  .pd-gate { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; background:radial-gradient(900px 500px at 15% 10%, #fde9e7, transparent 60%), radial-gradient(800px 500px at 90% 90%, #e3eefb, transparent 60%), #f4f2ea; }
  .pd-gate-card { width:100%; max-width:380px; display:flex; flex-direction:column; gap:12px; background:#fff; border:1px solid #e3e0d4; border-radius:24px; padding:30px 26px 26px; box-shadow:0 20px 50px rgba(23,24,28,.12); text-align:center; }
  .pd-gate-card > * { order:1; }
  .pd-gate-logo { order:-2; font-family:"Fraunces", Georgia, serif; font-size:1.7rem; font-weight:600; }
  .pd-gate-logo span, .pd-logo span { color:#c6332e; }
  .pd-gate-lock { order:-1; width:54px; height:54px; margin:0 auto; border-radius:50%; background:#17181c; color:#fff; display:grid; place-items:center; }
  .pd-gate-lock svg { width:24px; height:24px; }
  .pd-gate-intro { order:0; margin:0 0 4px; font-size:.92rem; color:#62625c; }
  .pd-gate-err { order:5; margin:0; min-height:1.2em; font-size:.84rem; color:#c6332e; }
  .pd-field { position:relative; display:block; }
  .pd-field input, .pd-input { width:100%; box-sizing:border-box; border:1.5px solid #ddd9ca; background:#fcfbf7; border-radius:13px; padding:12px 14px; font-size:16px; outline:none; transition:border-color .15s; }
  .pd-field input:focus, .pd-input:focus { border-color:#17181c; background:#fff; }
  .pd-field input { padding-right:62px; }
  .pd-eye { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; color:#62625c; font-size:.78rem; font-weight:600; padding:8px; cursor:pointer; }
  .pd-btn.block { width:100%; padding:12px 14px; font-size:.95rem; border-radius:13px; }
  #print-frame { position:absolute; width:0; height:0; border:0; }
  /* ===== login redesign ===== */
  .pd-login { width:100%; max-width:800px; display:grid; grid-template-columns:1fr 1fr; background:#fff; border:1px solid #e3e0d4; border-radius:28px; overflow:hidden; box-shadow:0 24px 60px rgba(23,24,28,.14); }
  .pd-login .pd-gate-card { max-width:none; border:0; box-shadow:none; border-radius:0; justify-content:center; padding:44px 36px; text-align:left; background:#fff; }
  .pd-login .pd-gate-lock { margin:0 0 6px; }
  .pd-login .pd-gate-intro { margin:0; font-size:.88rem; color:#8a4b00; background:#fdf0d9; border-radius:12px; padding:10px 12px; text-align:left; }
  .pd-login .pd-gate-intro:empty { display:none; }
  .pd-login .pd-gate-err { text-align:left; }
  .pd-login-art { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:10px; padding:28px 24px; color:#fff; background:radial-gradient(260px 200px at 30% 20%, rgba(198,51,46,.55), transparent 70%), radial-gradient(240px 200px at 80% 90%, rgba(31,95,168,.5), transparent 70%), #17181c; min-height:340px; }
  .pd-art-logo { align-self:flex-start; font-family:"Fraunces", Georgia, serif; font-size:1.55rem; font-weight:600; }
  .pd-art-logo span { color:#ff6b64; }
  .pd-art-printer { width:100%; max-width:230px; height:auto; filter:drop-shadow(0 14px 22px rgba(0,0,0,.4)); }
  .pd-art-paper { animation:pdfeed 3.2s ease-in-out infinite; }
  @keyframes pdfeed { 0% { transform:translateY(-64px); } 55%, 80% { transform:translateY(0); } 100% { transform:translateY(0); opacity:0; } }
  .pd-led { animation:pdblink 1s steps(2) infinite; }
  .pd-led2 { animation-delay:.5s; }
  @keyframes pdblink { 50% { opacity:.25; } }
  .pd-art-room { align-self:flex-start; font-size:.74rem; font-weight:600; letter-spacing:.06em; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.12); }
  @media (max-width:700px) {
    .pd-login { grid-template-columns:1fr; max-width:400px; }
    .pd-login-art { min-height:0; padding:18px 20px; flex-direction:row; flex-wrap:wrap; justify-content:space-between; }
    .pd-art-printer { max-width:110px; order:3; }
    .pd-art-room { align-self:center; }
    .pd-login .pd-gate-card { padding:26px 22px; }
  }


  /* ----- buttons ----- */
  .pd-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:42px; padding:9px 14px; border:1.5px solid #d9d6c8; background:#fff; color:var(--ink); border-radius:12px; font-size:.88rem; font-weight:600; line-height:1.1; cursor:pointer; white-space:nowrap; text-decoration:none; transition:transform .08s, background .15s, border-color .15s, opacity .15s; }
  .pd-btn:hover { border-color:#b4b09f; }
  .pd-btn:active { transform:scale(.97); }
  .pd-btn.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
  .pd-btn.ok { color:#1f5a37; border-color:#b5e0c3; background:#f3fbf6; }
  .pd-btn.danger { color:#a02722; border-color:#efc9c6; }
  .pd-btn.next { background:var(--ink); border-color:var(--ink); color:#fff; box-shadow:0 6px 14px -8px rgba(23,24,28,.7); }
  .pd-btn.ok.next { background:var(--green); border-color:var(--green); color:#fff; }
  .pd-btn.locked { opacity:.45; }
  .pd-btn.done { opacity:1; cursor:default; background:#e6f3ea; color:#1f5a37; border-color:#c9e4d1; }
  .pd-btn.sm { min-height:34px; padding:6px 12px; font-size:.8rem; border-radius:10px; }
  .pd-btn:disabled { cursor:not-allowed; }
  .pd-btn.wa { background:#25d366; border-color:#25d366; color:#fff; }

  /* ----- app bar ----- */
  .pd-wrap { max-width:1080px; margin:0 auto; padding:0 16px; }
  .pd-bar { position:sticky; top:0; z-index:40; background:rgba(244,242,234,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .pd-bar-in { display:flex; align-items:center; gap:12px; height:56px; }
  .pd-logo { font-family:"Fraunces", Georgia, serif; font-size:1.35rem; font-weight:600; color:var(--ink); text-decoration:none; }
  .pd-logo span { color:var(--red); }
  .pd-live { display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:600; color:var(--green); background:#e6f3ea; padding:4px 10px; border-radius:999px; }
  .pd-live i { width:7px; height:7px; border-radius:50%; background:var(--green); animation:pdpulse 1.6s infinite; }
  @keyframes pdpulse { 50% { opacity:.3; } }
  .pd-nav { margin-left:auto; display:flex; align-items:center; gap:2px; }
  .pd-link { font-size:.86rem; font-weight:500; color:var(--ink); text-decoration:none; padding:8px 11px; border-radius:10px; }
  .pd-link:hover, .pd-icon:hover { background:#ebe8dd; }
  .pd-icon { width:40px; height:40px; border:0; background:transparent; border-radius:11px; display:grid; place-items:center; color:var(--ink); cursor:pointer; }
  .pd-icon svg { width:20px; height:20px; }
  .pd-icon.off { color:#a9a79c; }

  /* ----- layout: sidebar (desktop) / stacked (mobile) ----- */
  .pd-layout { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; padding:14px 0 80px; }
  .pd-side { display:flex; flex-direction:column; gap:12px; }
  @media (min-width:980px) {
    .pd-layout { grid-template-columns:292px minmax(0,1fr); gap:24px; align-items:start; padding-top:20px; }
    .pd-side { position:sticky; top:76px; }
    .pd-filter-toggle { display:none !important; }
    .pd-filter-body { display:flex !important; }
  }

  /* ----- earnings ----- */
  .pd-earn { position:relative; overflow:hidden; border-radius:22px; padding:18px 18px 14px; color:#fff; background:radial-gradient(240px 160px at 100% 0%, rgba(198,51,46,.62), transparent 70%), radial-gradient(220px 160px at 0% 120%, rgba(31,95,168,.5), transparent 70%), #17181c; box-shadow:var(--shadow); }
  .pd-earn > small { display:block; font-size:.68rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; opacity:.72; }
  .pd-earn > b { display:block; font-family:"Fraunces", Georgia, serif; font-size:2.7rem; font-weight:600; line-height:1.05; margin:4px 0 2px; }
  .pd-earn > span { font-size:.74rem; opacity:.7; }
  .pd-earn-row { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.16); }
  .pd-earn-row small { display:block; font-size:.62rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; opacity:.68; }
  .pd-earn-row b { display:block; margin-top:2px; font-family:"Fraunces", Georgia, serif; font-size:1.2rem; font-weight:600; }

  /* ----- search & filters ----- */
  .pd-panel { display:flex; flex-direction:column; gap:10px; background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:12px; box-shadow:var(--shadow); }
  .pd-search { position:relative; display:block; }
  .pd-search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--mute); pointer-events:none; }
  .pd-search input { width:100%; box-sizing:border-box; border:1.5px solid #ddd9ca; background:#fcfbf7; border-radius:12px; padding:11px 12px 11px 37px; font-size:16px; outline:none; }
  .pd-search input:focus { border-color:var(--ink); background:#fff; }
  .pd-filter-toggle { align-self:flex-start; border:0; background:none; padding:2px 2px; font:inherit; font-size:.82rem; font-weight:600; color:var(--soft); cursor:pointer; }
  .pd-filter-toggle::after { content:" ▾"; }
  .pd-filter-toggle[aria-expanded="true"]::after { content:" ▴"; }
  .pd-filter-body { display:none; flex-direction:column; gap:12px; }
  .pd-filter-body.open { display:flex; }
  .pd-frow { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .pd-frow .lbl { font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
  .pd-seg { display:inline-flex; gap:2px; padding:3px; border-radius:12px; background:#ebe8dd; }
  .pd-seg button { border:0; background:transparent; padding:7px 12px; border-radius:9px; font-size:.8rem; font-weight:500; color:var(--soft); cursor:pointer; }
  .pd-seg button.active { background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(23,24,28,.16); }
  .pd-select { max-width:190px; border:1.5px solid #ddd9ca; background:#fff; border-radius:11px; padding:8px 10px; font-size:.82rem; font-weight:500; color:var(--ink); }
  .pd-switch { display:flex; align-items:center; gap:8px; width:100%; border:1.5px solid #cfd8d2; background:#fff; border-radius:12px; padding:8px 12px 8px 8px; font-size:.84rem; font-weight:600; color:var(--ink); cursor:pointer; }
  .pd-switch .track { position:relative; width:34px; height:20px; border-radius:999px; background:#c9cfcb; transition:background .15s; flex:none; }
  .pd-switch .track::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s; }
  .pd-switch svg { width:15px; height:15px; color:#25d366; flex:none; }
  .pd-switch .n { margin-left:auto; font-size:.7rem; padding:1px 8px; border-radius:999px; background:rgba(0,0,0,.07); font-weight:600; }
  .pd-switch[aria-checked="true"] { background:#f1faf4; border-color:#9fd6b2; color:#14532d; }
  .pd-switch[aria-checked="true"] .track { background:#25d366; }
  .pd-switch[aria-checked="true"] .track::after { transform:translateX(14px); }
  #clearAllBtn { align-self:flex-start; min-height:34px; font-size:.8rem; }

  /* ----- tabs ----- */
  .pd-tabbar { position:sticky; top:56px; z-index:20; padding:6px 0 10px; background:linear-gradient(#f4f2ea 78%, rgba(244,242,234,0)); }
  .pd-tabs { display:flex; gap:2px; padding:4px; border-radius:15px; background:#ebe8dd; }
  .pd-tab { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px; border:0; background:transparent; font:inherit; font-size:.9rem; font-weight:500; color:var(--soft); padding:10px 8px; border-radius:11px; cursor:pointer; }
  .pd-tab .n { font-size:.72rem; font-weight:700; padding:1px 8px; border-radius:999px; background:rgba(0,0,0,.08); }
  .pd-tab.active { background:#fff; color:var(--ink); font-weight:700; box-shadow:0 1px 4px rgba(23,24,28,.18); }
  .pd-tab.active .n { background:var(--ink); color:#fff; }

  /* ----- list ----- */
  .pd-list { display:flex; flex-direction:column; gap:12px; }
  .pd-group { display:flex; align-items:center; gap:8px; margin:8px 2px 0; font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); }
  .pd-group:first-child { margin-top:0; }
  .pd-group::after { content:""; flex:1; height:1px; background:var(--line); }
  .pd-group .n { font-size:.7rem; padding:1px 8px; border-radius:999px; background:#ebe8dd; letter-spacing:0; }
  .pd-group.paid { color:#1f5a37; } .pd-group.paid .n { background:#dff1e5; }
  .pd-group.unpaid { color:#8a5200; } .pd-group.unpaid .n { background:#fdf0d9; }

  .pd-empty { text-align:center; color:var(--soft); padding:46px 16px; background:#fff; border:1.5px dashed #d9d6c8; border-radius:var(--r); }
  .pd-empty .ic { font-size:2rem; margin-bottom:6px; }
  .pd-empty b { display:block; font-weight:600; color:var(--ink); }
  .pd-empty span { display:block; margin-top:3px; font-size:.84rem; }
  .pd-hidden-note { text-align:center; font-size:.82rem; color:#3c4a41; padding:10px; border-radius:12px; background:#f1faf4; border:1px dashed #9fd6b2; }
  .pd-hidden-note button { border:0; background:none; font:inherit; font-weight:700; color:#128c4a; text-decoration:underline; cursor:pointer; padding:0 2px; }

  /* ----- token card ----- */
  .pd-card { position:relative; display:flex; flex-direction:column; gap:12px; background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:14px 14px 12px 18px; box-shadow:var(--shadow); overflow:hidden; }
  .pd-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--stripe, #d9d6c8); }
  .pd-card.is-paid { --stripe:#3f9a63; } .pd-card.is-unpaid { --stripe:#e0a210; } .pd-card.nb { --stripe:#1f6fb0; } .pd-card.is-printed { --stripe:#a7a496; background:#fbfaf6; }
  .pd-card.is-new { animation:pdnew 2.6s ease; }
  @keyframes pdnew { 0% { box-shadow:0 0 0 0 rgba(198,51,46,.55); background:#fff4f3; } 60% { box-shadow:0 0 0 12px rgba(198,51,46,0); } 100% { background:#fff; } }
  .pd-top { display:flex; align-items:flex-start; gap:12px; }
  .pd-token { flex:none; min-width:76px; text-align:center; padding:9px 10px 8px; border-radius:14px; background:var(--ink); color:#fff; }
  .pd-token small { display:block; font-size:.56rem; letter-spacing:.16em; text-transform:uppercase; opacity:.7; }
  .pd-token b { display:block; font-family:"Fraunces", Georgia, serif; font-size:1.8rem; line-height:1.05; font-weight:600; letter-spacing:.02em; }
  .pd-card.wa .pd-token { background:#128c4a; } .pd-card.nb .pd-token { background:var(--blue); } .pd-card.is-printed .pd-token { background:#77756c; }
  .pd-info { min-width:0; flex:1; }
  .pd-chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:5px; }
  .pd-chips:empty { display:none; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:.68rem; font-weight:700; letter-spacing:.02em; padding:3px 9px; border-radius:999px; background:#eee; color:#444; }
  .chip svg { width:12px; height:12px; }
  .chip.wa { background:#25d366; color:#fff; } .chip.nb { background:#e3f0fb; color:#16507f; } .chip.glossy { background:#efe6fb; color:#5b34a0; }
  .chip.topay { background:#fdf0d9; color:#8a5200; } .chip.printed { background:#e6f3ea; color:#1f5a37; }
  .pd-files { font-size:.95rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pd-files.wa { display:flex; align-items:center; gap:6px; color:#14532d; white-space:normal; }
  .pd-files.wa svg { width:16px; height:16px; color:#25d366; flex:none; }
  .pd-files .more { color:var(--soft); font-weight:400; font-size:.84rem; }
  .pd-meta { margin-top:3px; font-size:.78rem; color:var(--soft); }
  .pd-amount { flex:none; text-align:right; }
  .pd-amount b { display:block; font-family:"Fraunces", Georgia, serif; font-size:1.7rem; line-height:1; font-weight:600; }
  .pd-pay { display:inline-block; margin-top:5px; font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:999px; }
  .pd-pay.paid { background:#dff1e5; color:#1f5a37; } .pd-pay.unpaid { background:#fdf0d9; color:#8a5200; } .pd-pay.partial { background:#fdf0d9; color:#8a5200; } .pd-pay.none { background:#eee; color:#666; }
  .pd-amount small { display:block; margin-top:3px; font-size:.7rem; color:var(--mute); }

  .pd-steps { display:flex; align-items:center; list-style:none; margin:0; padding:0; font-size:.7rem; font-weight:700; color:var(--mute); }
  .pd-steps li { display:flex; align-items:center; gap:6px; flex:1; white-space:nowrap; }
  .pd-steps li:last-child { flex:none; }
  .pd-steps li::before { content:""; flex:none; width:15px; height:15px; border-radius:50%; border:2px solid #cfcbbb; background:#fff; display:grid; place-items:center; font-size:.58rem; color:#fff; line-height:1; }
  .pd-steps li:not(:last-child)::after { content:""; flex:1; height:2px; margin:0 8px; border-radius:2px; background:#e3e0d4; }
  .pd-steps li.done { color:#1f5a37; }
  .pd-steps li.done::before { content:"✓"; background:var(--green); border-color:var(--green); }
  .pd-steps li.done:not(:last-child)::after { background:var(--green); }
  .pd-steps li.cur { color:var(--ink); }
  .pd-steps li.cur::before { border-color:var(--ink); box-shadow:0 0 0 3px rgba(23,24,28,.1); }

  .pd-editor { padding:10px 12px; border-radius:14px; background:#faf9f4; border:1.5px solid #ebe8dd; }
  .pd-editor label { display:block; margin-bottom:6px; font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); }
  .pd-editor-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .pd-editor .cur { font-weight:700; color:var(--soft); }
  .pd-price-in { width:110px; box-sizing:border-box; border:1.5px solid #cfcbbb; background:#fff; border-radius:11px; padding:9px 11px; font-size:16px; font-weight:700; outline:none; }
  .pd-price-in:focus { border-color:var(--ink); }

  .pd-actions { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
  .pd-actions.n3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
  .pd-sub { display:flex; flex-wrap:wrap; align-items:center; gap:2px 16px; margin-top:-2px; }
  .pd-printbtn { position:relative; flex:none; width:56px; height:56px; display:grid; place-items:center; border:0; border-radius:18px; background:linear-gradient(145deg,#14b8a6 0%,#0d9488 45%,#0f766e 100%); color:#fff; cursor:pointer; box-shadow:0 10px 20px -8px rgba(13,148,136,.75), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .12s, box-shadow .2s, filter .2s; }
  .pd-printbtn::before { content:""; position:absolute; inset:-3px; border-radius:21px; border:2px solid rgba(20,184,166,.55); animation:pdRing 2.4s ease-out infinite; pointer-events:none; }
  .pd-printbtn svg { width:30px; height:30px; overflow:visible; }
  .pd-printbtn .pr-sheet { fill:#fff; stroke:none; animation:pdSheet 2.4s ease-in-out infinite; }
  .pd-printbtn .pr-line { stroke:#0f766e; stroke-width:1.4; animation:pdSheet 2.4s ease-in-out infinite; }
  .pd-printbtn .pr-led { fill:#fde047; animation:pdBlink 1.2s steps(2,end) infinite; }
  .pd-printbtn:hover { filter:brightness(1.08); transform:translateY(-2px); box-shadow:0 14px 24px -8px rgba(13,148,136,.85), inset 0 1px 0 rgba(255,255,255,.4); }
  .pd-printbtn:active { transform:scale(.93); }
  @keyframes pdSheet { 0%,12% { transform:translateY(-5px); opacity:0; } 35% { opacity:1; } 70%,100% { transform:translateY(2.5px); opacity:1; } }
  @keyframes pdRing { 0% { transform:scale(.94); opacity:.9; } 70%,100% { transform:scale(1.22); opacity:0; } }
  @keyframes pdBlink { 50% { opacity:.25; } }

<script>
firebase.initializeApp(CONFIG.firebase);
const db = firebase.database();

// ---- password hashing (SHA-256, stored in Firebase — never plaintext) ----
async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

const gate = document.getElementById('gate');
const gateCard = document.getElementById('gateCard');
const gateIntro = document.getElementById('gateIntro');
const gateError = document.getElementById('gateError');
const dashboard = document.getElementById('dashboard');

// ---- render either "create password" (first run) or "enter password" ----
function wireEyes(root) {
  root.querySelectorAll('.pd-eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = btn.parentElement.querySelector('input');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
    });
  });
}

function renderCreatePasswordForm() {
  gateIntro.textContent = 'First time here — create a password for the print desk.';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:10px;';
  wrap.innerHTML = `
    <label class="pd-field"><input type="password" id="newPw" placeholder="Create a password" autocomplete="new-password"><button type="button" class="pd-eye">Show</button></label>
    <label class="pd-field"><input type="password" id="confirmPw" placeholder="Confirm password" autocomplete="new-password"><button type="button" class="pd-eye">Show</button></label>
    <button class="pd-btn primary block" id="createBtn">Create password &amp; unlock</button>
  `;
  gateCard.appendChild(wrap);
  wireEyes(wrap);

  document.getElementById('createBtn').addEventListener('click', async () => {
    const pw = document.getElementById('newPw').value;
    const confirm = document.getElementById('confirmPw').value;
    gateError.textContent = '';
    if (!pw || pw.length < 4) {
      gateError.textContent = 'Password must be at least 4 characters.';
      return;
    }
    if (pw !== confirm) {
      gateError.textContent = 'Passwords do not match.';
      return;
    }
    const hash = await sha256Hex(pw);
    db.ref('adminAuth/passwordHash').set(hash)
      .then(() => unlock())
      .catch(() => { gateError.textContent = 'Could not save password. Try again.'; });
  });
}

function renderLoginForm() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:10px;';
  wrap.innerHTML = `
    <label class="pd-field"><input type="password" id="passcodeInput" placeholder="Password" autocomplete="current-password" autofocus><button type="button" class="pd-eye">Show</button></label>
    <button class="pd-btn primary block" id="unlockBtn">Unlock desk</button>
  `;
  gateCard.appendChild(wrap);
  wireEyes(wrap);

  const passcodeInput = document.getElementById('passcodeInput');

  async function tryUnlock() {
    gateError.textContent = '';
    try {
      const entered = passcodeInput.value;
      const hash = await sha256Hex(entered);
      const snap = await db.ref('adminAuth/passwordHash').once('value');
      if (hash === snap.val()) {
        unlock();
      } else {
        gateError.textContent = 'Incorrect password.';
      }
    } catch (err) {
      gateError.textContent = 'Could not reach the database (' + (err.message || err) + '). Check your Firebase rules.';
    }
  }
  document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
  passcodeInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
}

// ---- single-session enforcement: only one device may be logged in at a
// time. Logging in writes a fresh session id to Firebase; any other
// device watching that path sees the mismatch and is logged out. ----
function makeSessionId() {
  return (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2)));
}

// remove any form elements appended to the gate card so we can render
// a fresh login form on top of the original logo/intro/error nodes
function resetGateCard() {
  while (gateCard.children.length > 2) {
    gateCard.removeChild(gateCard.lastChild);
  }
  gateError.textContent = '';
}

let sessionWatcherStarted = false;
function watchSession() {
  if (sessionWatcherStarted) return;
  sessionWatcherStarted = true;
  db.ref('adminAuth/activeSession').on('value', snap => {
    const active = snap.val();
    const mine = localStorage.getItem('np_session_id');
    if (dashboard.style.display !== 'none' && mine && active !== mine) {
      // another device has logged in — kick this one out
      localStorage.removeItem('np_session_id');
      sessionStorage.removeItem('np_admin_ok');
      dashboard.style.display = 'none';
      gate.style.display = 'flex';
      resetGateCard();
      gateIntro.textContent = "You've been logged out because this account was signed in on another device.";
      renderLoginForm();
    }
  });
}

function unlock() {
  const sid = makeSessionId();
  localStorage.setItem('np_session_id', sid);
  sessionStorage.setItem('np_admin_ok', '1');
  db.ref('adminAuth/activeSession').set(sid);
  gate.style.display = 'none';
  dashboard.style.display = 'block';
  startDashboard();
  watchSession();
}

// ---- decide which gate form to show ----
(async function initGate() {
  if (sessionStorage.getItem('np_admin_ok') === '1') {
    try {
      const activeSnap = await db.ref('adminAuth/activeSession').once('value');
      const mine = localStorage.getItem('np_session_id');
      if (mine && activeSnap.val() === mine) {
        gate.style.display = 'none';
        dashboard.style.display = 'block';
        startDashboard();
        watchSession();
        return;
      }
      // session was taken over by another device while we were away
      sessionStorage.removeItem('np_admin_ok');
      localStorage.removeItem('np_session_id');
    } catch (err) {
      // fall through to normal login if we can't verify the session
    }
  }
  try {
    const snap = await db.ref('adminAuth/passwordHash').once('value');
    if (snap.exists()) {
      renderLoginForm();
    } else {
      renderCreatePasswordForm();
    }
  } catch (err) {
    gateError.textContent = 'Could not reach the database (' + (err.message || err) + '). Check that your Firebase Realtime Database rules allow read/write on the "adminAuth" path.';
  }
})();

// ---- desk toolbar: search, payment filter, sort, sound ----
document.getElementById('searchBox').addEventListener('input', e => { searchQ = e.target.value.trim().toLowerCase(); render(); });
document.querySelectorAll('#payFilter button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#payFilter button').forEach(x => x.classList.toggle('active', x === b));
  payFilter = b.dataset.pay; render();
}));
document.getElementById('filtersBtn').addEventListener('click', e => {
  const open = document.getElementById('filtersBody').classList.toggle('open');
  e.currentTarget.setAttribute('aria-expanded', String(open));
});
document.getElementById('sortSel').addEventListener('change', e => { sortMode = e.target.value; render(); });
document.getElementById('soundToggle').addEventListener('click', () => {
  soundOn = !soundOn;
  try { localStorage.setItem('np_sound', soundOn ? '1' : '0'); } catch (e) {}
  render(); toast(soundOn ? 'Sound on for new requests' : 'Sound off');
  if (soundOn) beep();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && dashboard.style.display !== 'none') {
    e.preventDefault(); document.getElementById('searchBox').focus();
  }
  if (e.key === 'Escape') { changePwPanel.style.display = 'none'; }
});
setInterval(() => { if (dashboard.style.display !== 'none' && !busyEditing()) render(); }, 60000); // refresh "x min ago"
function busyEditing() { return document.activeElement && document.activeElement.id === 'searchBox'; }

// ---- change password (from inside the dashboard) ----
const showChangePw = document.getElementById('showChangePw');
const changePwPanel = document.getElementById('changePwPanel');
const cpError = document.getElementById('cpError');
const cpSuccess = document.getElementById('cpSuccess');

showChangePw.addEventListener('click', () => {
  changePwPanel.style.display = changePwPanel.style.display === 'none' ? 'block' : 'none';

  const next = document.getElementById('cpNew').value;
  const confirm = document.getElementById('cpConfirm').value;

    return;

  if (next !== confirm) {
    cpError.textContent = 'New passwords do not match.';
    return;

  let snap;

    const currentHash = await sha256Hex(current);

    cpError.textContent = 'Could not reach the database (' + (err.message || err) + '). Check your Firebase rules.';

      document.getElementById('cpCurrent').value = '';

});

// ---- payment helpers ----
function paidOf(r) {
  if (r.paymentStatus === 'paid') return r.paidAmount != null ? Number(r.paidAmount) || 0 : Number(r.amount) || 0;
  return Number(r.paidAmount) || 0;
}
function isPaid(r) { return r.paymentStatus === 'paid'; }
function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

// ---- earnings ledger -------------------------------------------------
// Money received is added to earnings/total (and earnings/days/<day>) and the
// request remembers how much of it is already counted in earnedAmount. That
// way "Clear tokens", "Printed" and "Cancel" can delete requests without ever
// touching what has been earned, and nothing is counted twice.
let earn = { total: 0, days: {} };
const bankedLocal = {};      // request id -> amount already counted (instant, before Firebase echoes it)
let banking = Promise.resolve(true);
function unbanked(r) { return Math.max(0, paidOf(r) - Math.max(Number(r.earnedAmount) || 0, bankedLocal[r.id] || 0)); }

function bankEarnings(list) {
  banking = banking.then(async () => {
    const rows = (list || allRequests).map(r => ({ r, d: unbanked(r) })).filter(x => x.d > 0);
    if (!rows.length) return true;
    const sum = rows.reduce((t, x) => t + x.d, 0);
    const days = {};
    rows.forEach(x => { const k = dayKey(new Date(x.r.paidAt || Date.now())); days[k] = (days[k] || 0) + x.d; });
    const prev = {};
    rows.forEach(x => { prev[x.r.id] = bankedLocal[x.r.id]; bankedLocal[x.r.id] = paidOf(x.r); });
    try {
      await db.ref('earnings/total').transaction(c => (Number(c) || 0) + sum);
      for (const k of Object.keys(days)) await db.ref('earnings/days/' + k).transaction(c => (Number(c) || 0) + days[k]);
      const upd = {};
      rows.forEach(x => {
        upd['printRequests/' + x.r.id + '/earnedAmount'] = paidOf(x.r);
        upd['printRequests/' + x.r.id + '/earnedDay'] = dayKey(new Date(x.r.paidAt || Date.now()));
      });
      await db.ref().update(upd);
      return true;
    } catch (err) {
      rows.forEach(x => { if (prev[x.r.id] === undefined) delete bankedLocal[x.r.id]; else bankedLocal[x.r.id] = prev[x.r.id]; });
      console.error('earnings', err);
      return false;
    }
  });
  return banking;
}
// Cancel: whatever was counted for this token is taken back out of the
// earnings, so a cancelled token never adds to them.
function unbankEarnings(req) {
  banking = banking.then(async () => {
    const before = bankedLocal[req.id];
    const counted = Math.max(Number(req.earnedAmount) || 0, before || 0);
    bankedLocal[req.id] = Math.max(paidOf(req), counted);   // keeps the auto-counter from adding it back
    if (counted <= 0) return true;
    const dk = req.earnedDay || dayKey(new Date(req.paidAt || Date.now()));
    try {
      await db.ref('earnings/total').transaction(c => Math.max(0, (Number(c) || 0) - counted));
      await db.ref('earnings/days/' + dk).transaction(c => c == null ? null : Math.max(0, (Number(c) || 0) - counted));
      return true;
    } catch (err) {
      if (before === undefined) delete bankedLocal[req.id]; else bankedLocal[req.id] = before;
      console.error('earnings', err);
      return false;
    }
  });
  return banking;
}
// every deletion goes through this: earnings are saved first, and if that
// fails nothing is deleted
async function bankOrWarn() {
  const ok = await bankEarnings(allRequests);
  if (!ok) alert('Could not save the earnings to Firebase, so nothing was deleted. Check that your database rules allow read/write on the "earnings" path.');
  return ok;
}

// ---- in-page confirm dialog (replaces the browser's confirm box) ----
function ask(o) {
  return new Promise(resolve => {
    const m = document.getElementById('askModal');
    const yes = document.getElementById('askYes'), no = document.getElementById('askNo');
    document.getElementById('askTitle').textContent = o.title || 'Are you sure?';
    document.getElementById('askBody').textContent = o.body || '';
    yes.textContent = o.ok || 'Confirm';
    yes.className = 'pd-btn ' + (o.danger ? 'danger-fill' : 'primary');
    m.style.display = 'block';
    const done = v => {
      m.style.display = 'none';
      yes.onclick = no.onclick = m.onclick = null;
      document.removeEventListener('keydown', onKey);
      resolve(v);
    };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', onKey);
    yes.onclick = () => done(true);
    no.onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
    yes.focus();
  });
}

function matchesStatus(r) { return currentFilter === 'all' || (r.status || 'pending') === currentFilter; }
function matchesSearch(r) {
  if (!searchQ) return true;
  const hay = [r.token, r.notes, ...(r.files || []).map(f => f.name), ...(r.items || []).map(i => i.name)].join(' ').toLowerCase();
  return hay.includes(searchQ);

function matchesPay(r) {

function timeAgo(ts) {
  if (!ts) return '—';
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' hr ago';
  return Math.floor(h / 24) + ' d ago';
}

function toast(msg) {
  const t = document.getElementById('pdToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * 0.17;
      o.frequency.value = f; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.14, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
      o.start(t0); o.stop(t0 + 0.17);
    });
  } catch (e) {}
}

// chime + toast when a brand-new pending request arrives (not on first load)
function notifyNew(list) {
  const ids = new Set(list.map(r => r.id));
  if (knownIds) {
    const fresh = list.filter(r => !knownIds.has(r.id) && (r.status || 'pending') === 'pending');
    if (fresh.length) {
      if (soundOn) beep();
      fresh.forEach(r => freshIds.add(r.id));
      toast('New request · token ' + fresh.map(r => r.token || '—').join(', '));
    }
  }
  knownIds = ids;
}

window.markPaid = async function (id) {
  const req = allRequests.find(r => r.id === id);
  if (!req) return;
  if (!(Number(req.amount) > 0)) { toast('Set the price first, then mark it as paid'); return; }
  const bal = Math.max(0, (Number(req.amount) || 0) - paidOf(req));
  if (!(await ask({ title: 'Payment received?', body: 'Token ' + (req.token || '') + ': ₹' + bal + ' received at the counter.\nIt will be added to your earnings.', ok: 'Yes, mark as paid' }))) return;

    await db.ref('printRequests/' + id).update({
      paymentStatus: 'paid', paidAmount: Number(req.amount) || 0, paymentMethod: 'counter',
      paidAt: firebase.database.ServerValue.TIMESTAMP,

    // add it to the earnings straight away
    bankEarnings([Object.assign({}, req, { paymentStatus: 'paid', paidAmount: Number(req.amount) || 0, paidAt: Date.now() })]);
    toast('Token ' + (req.token || '') + ' marked paid · earnings updated');
  } catch (err) { alert('Could not update: ' + (err.message || err)); }
};

// ---- the desk sets the price for a token. It is written to the request, so
// token.html (watching it live) shows it straight away and the customer only
// pays this amount. ----
window.savePrice = async function (id) {
  const req = allRequests.find(r => r.id === id);
  const inp = document.getElementById('pr-' + id);
  if (!req || !inp) return;
  const n = Math.round(Number(inp.value));
  if (inp.value === '' || !isFinite(n) || n < 0) { toast('Enter a valid price'); inp.focus(); return; }
  const paid = paidOf(req);
  if (paid > n && !(await ask({ title: 'Price is lower than what was paid', body: 'Token ' + (req.token || '') + ' has already paid ₹' + paid + ', which is more than ₹' + n + '.', ok: 'Set it anyway', danger: true }))) return;
  try {
    await db.ref('printRequests/' + id).update({
      amount: n, priceSet: true, priceOverride: true, priceSetAt: firebase.database.ServerValue.TIMESTAMP,
      paidAmount: paid, paymentStatus: (n > 0 && paid >= n) ? 'paid' : 'unpaid',
    });
    editingPrice.delete(id);
    toast('Token ' + (req.token || '') + ' price set to ₹' + n);
    inp.blur();
    renderLater = false; render();
  } catch (err) { alert('Could not update: ' + (err.message || err)); }
};
function waRates(pages, kind) {
  const P = (CONFIG.pricing || {}), O = (CONFIG.offer || {});
  const base = kind === 'color' ? P.color : kind === 'photo' ? P.photoPaper : P.blackAndWhite;
  let rate = Number(base) || 0;
  if (kind !== 'photo' && O.minPages && pages >= Number(O.minPages)) {
    const off = kind === 'color' ? O.color : O.blackAndWhite;
    if (off != null) rate = Number(off) || rate;
  }
  return rate;
}
// WhatsApp tokens: price = pages x rate (B&W / colour / photo) + extra amount (may be negative)
function waCalc(bw, col, ph, extra) {
  bw = Math.max(0, Math.floor(Number(bw) || 0)); col = Math.max(0, Math.floor(Number(col) || 0)); ph = Math.max(0, Math.floor(Number(ph) || 0));
  extra = Math.round(Number(extra) || 0);
  const parts = [];
  const add = (label, n, kind) => { if (n > 0) { const rate = waRates(n, kind); parts.push({ label, n, rate, amt: n * rate }); } };
  add('B&W', bw, 'bw'); add('Colour', col, 'color'); add('Photo', ph, 'photo');
  const total = Math.max(0, parts.reduce((t, x) => t + x.amt, 0) + extra);
  return { parts, extra, total };
}
function waBreakdown(c) {
  const bits = c.parts.map(x => x.label + ' ' + x.n + ' × ₹' + x.rate + ' = ₹' + x.amt);
  if (c.extra) bits.push('Extra ' + (c.extra < 0 ? '−₹' + Math.abs(c.extra) : '+₹' + c.extra));
  return bits.length ? bits.join(' · ') : 'Enter the pages to calculate the price';
}
function waVal(k, id) { const el = document.getElementById('wa-' + k + '-' + id); return el ? el.value : ''; }
window.waPreview = function (id) {

function startDashboard() {
  if (dbStarted) return;
  dbStarted = true;

  db.ref('printRequests').on('value', snapshot => {
    const data = snapshot.val() || {};
    allRequests = Object.entries(data)
      .map(([id, val]) => ({ id, ...val }))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    notifyNew(allRequests);
    render();
    bankEarnings(allRequests);
  });
  db.ref('earnings').on('value', snap => { earn = Object.assign({ total: 0, days: {} }, snap.val() || {}); render(); });

  document.getElementById('waToggle').addEventListener('click', () => window.toggleWA());

  document.querySelectorAll('.pd-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.pd-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      render();
    });
  });

  // ---- remove a file from Cloudinary.
  // Preferred path: call our deleteCloudinaryFile Cloud Function, which
  // holds the Cloudinary API secret server-side and deletes by the file's
  // permanent public ID. That works no matter how long ago it was
  // uploaded — see /functions and DEPLOY.md to set it up.
  // Fallback: the old unsigned delete-token method, kept only for
  // requests saved before the function existed. Cloudinary invalidates
  // that token ~10 minutes after upload, so it will usually fail for
  // anything older — that's expected, not a bug. ----
  async function deleteCloudinaryFile(file) {
    if (file.publicId && CONFIG.cloudinary.deleteFunctionUrl) {
      try {
        const res = await fetch(CONFIG.cloudinary.deleteFunctionUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            publicId: file.publicId,
            resourceType: file.resourceType || 'image',
          }),
        });
        const data = await res.json();
        if (data.ok) return true;
      } catch (err) {
        // fall through to the legacy method below
      }
    }

    if (!file.deleteToken) return false;
    try {
      const resourceType = file.resourceType || 'image';
      const url = `https://api.cloudinary.com/v1_1/${CONFIG.cloudinary.cloudName}/${resourceType}/destroy`;
      const body = new FormData();
      body.append('token', file.deleteToken);
      const res = await fetch(url, { method: 'POST', body });
      const data = await res.json();
      return data.result === 'ok';
    } catch (err) {
      return false;
    }
  }

  // Completed: only for paid tokens. The token leaves the pending list and is
  // kept in the Printed tab; its uploaded files are deleted from Cloudinary.
  window.completeRequest = async function (id) {
    const req = allRequests.find(r => r.id === id);
    if (!req) return;
    const isStoreOrder = req.source === 'store' || req.source === 'notebook';

    // Completing a token also counts it as paid, so there is no separate
    // "Mark as paid" step.
    const wasPaid = isPaid(req);
    if (!wasPaid && !isStoreOrder && !(Number(req.amount) > 0)) {
      toast('Set the price for token ' + (req.token || '') + ' first, then complete it.');
      return;
    }
    const dueNow = Math.max(0, (Number(req.amount) || 0) - paidOf(req));
    if (!(await ask(isStoreOrder
      ? { title: 'Complete this order?', body: 'Store order, token ' + (req.token || '') + ' — handed over.\nIt moves to the Printed tab.', ok: 'Complete' }
      : { title: 'Complete this token?', body: 'Token ' + (req.token || '') + ' — printed' + (wasPaid ? '.' : ' and ₹' + dueNow + ' received at the counter.\nIt will be marked as paid and added to your earnings.') + '\nIt moves to the Printed tab and its uploaded files are deleted.', ok: wasPaid ? 'Complete' : 'Complete & mark paid' }))) {
      return;
    }

    if (!wasPaid) {
      const amtNow = Number(req.amount) || 0;
      try {
        await db.ref('printRequests/' + id).update({
          paymentStatus: 'paid', paidAmount: amtNow, paymentMethod: 'counter',
          paidAt: firebase.database.ServerValue.TIMESTAMP,
        });
        bankEarnings([Object.assign({}, req, { paymentStatus: 'paid', paidAmount: amtNow, paidAt: Date.now() })]);
      } catch (err) { alert('Could not update: ' + (err.message || err)); return; }
    }

    if (!(await bankOrWarn())) return;
    const files = req.files || [];
    const failed = [];
    await Promise.all(files.map(async f => { if (!f.removed && !(await deleteCloudinaryFile(f))) failed.push(f.name); }));

    try {
      await db.ref('printRequests/' + id).update({
        status: 'printed',
        printedAt: firebase.database.ServerValue.TIMESTAMP,
        files: files.map(f => ({ name: f.name, printType: f.printType || null, format: f.format || null, pageMode: f.pageMode || null, pages: f.pages || null, pageCount: f.pageCount || null, copies: f.copies || 1, removed: true })),
      });
      expandedIds.delete(id);
      toast('Token ' + (req.token || '') + ' completed');
    } catch (err) { alert('Could not complete: ' + (err.message || err)); return; }

    if (failed.length) {
      alert('Completed. Note: these files could not be auto-removed from Cloudinary (delete link may have expired) — clear them manually if needed:\n' + failed.join('\n'));
    }
  };

  // ---- "Clear tokens": removes EVERY token (all tabs, filters and hidden
  // WhatsApp ones). Earnings are saved first and are never touched. The
  // tokens are deleted straight away; their Cloudinary files are cleaned up
  // afterwards, so a slow or failing file delete can't leave tokens behind. ----
  window.clearAll = async function () {
    const all = allRequests.slice();
    if (!all.length) return;

    if (!(await ask({ title: 'Clear all ' + all.length + ' token' + (all.length === 1 ? '' : 's') + '?', body: 'This deletes every token (pending, printed and WhatsApp) and their files.\nYour earnings are kept. This cannot be undone.', ok: 'Clear tokens', danger: true }))) {
      return;
    }
    if (!(await bankOrWarn())) return;

    const btn = document.getElementById('clearAllBtn');
    btn.disabled = true;
    btn.textContent = 'Clearing…';
    const failed = [];
    try {
      const updates = {};
      all.forEach(r => { updates['printRequests/' + r.id] = null; });
      await db.ref().update(updates);

      const files = all.flatMap(r => r.files || []);
      await Promise.all(files.map(async f => { if (!(await deleteCloudinaryFile(f))) failed.push(f.name); }));
      toast('All tokens cleared');
    } catch (err) {
      alert('Could not clear the tokens: ' + (err.message || err));
    } finally {
      btn.disabled = false;
      btn.textContent = 'Clear tokens';
      render();
    }

    if (failed.length) {
      alert('Tokens cleared. Note: these files could not be auto-removed from Cloudinary (delete link may have expired) — clear them manually if needed:\n' + failed.join('\n'));
    }
  };

  // put cancelled store items back into stock (skips products that were deleted)
  async function restoreStock(items) {
    for (const i of (items || [])) {
      const pid = i.id || i.productId;
      if (!pid) continue;
      try {
        const ex = await db.ref('store/products/' + pid + '/name').once('value');
        if (!ex.exists()) continue;
        await db.ref('store/products/' + pid + '/stock').transaction(c => (Number(c) || 0) + (Number(i.qty) || 0));
      } catch (e) { console.error(e); }
    }
  }

  window.cancelRequest = async function (id) {
    const req = allRequests.find(r => r.id === id);
    if (!req) return;

    const wasPaid = paidOf(req);
    if (!(await ask({ title: 'Cancel token ' + (req.token || '') + '?', body: 'It is removed from the dashboard with its files and adds nothing to your earnings.' + (wasPaid > 0 ? '\n\n₹' + wasPaid + ' was paid on this token. It will be taken out of your earnings, so refund the customer yourself.' : ''), ok: 'Cancel token', danger: true }))) {
      return;
    }

    if (!(await unbankEarnings(req))) {
      alert('Could not update the earnings, so the token was not cancelled. Check that your database rules allow read/write on the "earnings" path.');
      return;
    }
    const files = req.files || [];
    const failed = [];
    for (const f of files) {
      const ok = await deleteCloudinaryFile(f);
      if (!ok) failed.push(f.name);
    }

    if (req.source === 'store' || req.source === 'notebook') await restoreStock(req.items);
    await db.ref('printRequests/' + id).remove();

    if (failed.length) {
      alert('Request cancelled. Note: these files could not be auto-removed from Cloudinary (delete link may have expired) — clear them manually if needed:\n' + failed.join('\n'));
    }
  };
}

function updateToolbar() {
  const pool = allRequests.filter(r => showWA || r.source !== 'whatsapp');
  document.getElementById('cnt-pending').textContent = pool.filter(r => (r.status || 'pending') === 'pending').length;
  document.getElementById('cnt-printed').textContent = pool.filter(r => r.status === 'printed').length;
  document.getElementById('cnt-all').textContent = pool.length;
  const sw = document.getElementById('waToggle');
  sw.setAttribute('aria-checked', String(showWA));
  document.getElementById('waCount').textContent = allRequests.filter(r => r.source === 'whatsapp' && matchesStatus(r)).length;
  document.getElementById('waLabel').textContent = showWA ? 'WhatsApp shown' : 'WhatsApp hidden';

  const pend = pool.filter(r => (r.status || 'pending') === 'pending');
  const sumDue = pend.reduce((t, r) => t + Math.max(0, (Number(r.amount) || 0) - paidOf(r)), 0);
  const pendingBank = allRequests.reduce((t, r) => t + unbanked(r), 0);   // paid but not yet folded into the ledger
  const today = (earn.days && earn.days[dayKey(new Date())]) || 0;
  document.getElementById('st-earn').textContent = '₹' + ((Number(earn.total) || 0) + pendingBank).toLocaleString('en-IN');
  document.getElementById('st-today').textContent = '₹' + ((Number(today) || 0) + pendingBank).toLocaleString('en-IN');
  document.getElementById('st-due').textContent = '₹' + sumDue.toLocaleString('en-IN');
  document.getElementById('st-pending').textContent = pend.length;
  document.title = (pend.length ? '(' + pend.length + ') ' : '') + 'Print desk — NextPrint';
  document.getElementById('soundToggle').classList.toggle('off', !soundOn);
}

let renderLater = false;
function priceFocused() { const a = document.activeElement; return !!(a && a.classList && a.classList.contains('pd-price-in')); }
document.addEventListener('focusout', e => {
  if (e.target && e.target.classList && e.target.classList.contains('pd-price-in')) {
    setTimeout(() => { if (renderLater && !priceFocused()) { renderLater = false; render(); } }, 300);
  }
});
function render() {
  if (priceFocused()) { renderLater = true; updateToolbar(); return; }
  const listEl = document.getElementById('requestList');
  updateToolbar();
  const filtered = visibleRequests();
  const hiddenWA = showWA ? 0 : allRequests.filter(r => r.source === 'whatsapp' && matchesStatus(r)).length;

  const clearBtn = document.getElementById('clearAllBtn');
  if (clearBtn && !clearBtn.disabled) clearBtn.style.display = allRequests.length ? '' : 'none';

  const hiddenNote = hiddenWA
    ? `<div class="pd-hidden-note">${hiddenWA} WhatsApp request${hiddenWA === 1 ? '' : 's'} hidden · <button type="button" onclick="toggleWA()">Show</button></div>`
    : '';

  if (filtered.length === 0) {
    const q = searchQ ? escapeHtml(searchQ) : '';
    const [ic, t, sub] = q ? ['🔍', 'Nothing matches “' + q + '”', 'Try a token number or part of a file name.']
      : currentFilter === 'printed' ? ['🧾', 'No completed tokens yet', 'Tokens you mark as Completed show up here.']
      : currentFilter === 'pending' ? ['✨', 'All caught up', 'New uploads appear here instantly, with a chime.']
      : ['📭', 'No tokens right now', 'They will show up here as customers upload.'];
    listEl.innerHTML = `<div class="pd-empty"><div class="ic">${ic}</div><b>${t}</b><span>${sub}</span></div>${hiddenNote}`;
    return;
  }

  const byNew = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
  const sorted = filtered.slice().sort((a, b) => {
    if (sortMode === 'new') return byNew(a, b);
    if (sortMode === 'old') return -byNew(a, b);
    if (sortMode === 'amt') return (Number(b.amount) || 0) - (Number(a.amount) || 0) || byNew(a, b);
    // default: paid tokens first, newest first inside each group
    return (isPaid(b) ? 1 : 0) - (isPaid(a) ? 1 : 0) || byNew(a, b);
  });

  if (currentFilter === 'printed') {
    listEl.innerHTML = filtered.slice().sort((a, b) => (b.printedAt || b.createdAt || 0) - (a.printedAt || a.createdAt || 0)).map(renderCard).join('') + hiddenNote;
  } else if (sortMode === 'paid') {
    const paidList = sorted.filter(isPaid), openList = sorted.filter(r => !isPaid(r));
    listEl.innerHTML =
      (paidList.length ? `<h3 class="pd-group paid">Paid <span class="n">${paidList.length}</span></h3>` + paidList.map(renderCard).join('') : '') +
      (openList.length ? `<h3 class="pd-group unpaid">Awaiting payment <span class="n">${openList.length}</span></h3>` + openList.map(renderCard).join('') : '') +
      hiddenNote;
  } else {
    listEl.innerHTML = sorted.map(r => renderCard(r)).join('') + hiddenNote;
  }
}

function printTypeLabel(t) {
  if (t === 'color') return 'Colour';
  if (t === 'photo') return 'Photo paper';
  return 'B&amp;W';
}

function renderCard(r) {
  const status = r.status || 'pending';
  const printed = status === 'printed';
  const files = r.files || [];
  const isWA = r.source === 'whatsapp';
  const paper = r.paper && Number(r.paper.qty) > 0 ? r.paper : null;
  const paperOnly = !!paper && !files.length && !r.source;
  const isNB = r.source === 'store' || r.source === 'notebook' || paperOnly;
  const items = paperOnly ? [{ name: 'A4 paper', qty: paper.qty, price: paper.price, total: paper.total }] : (r.items || []);
  const itemCount = items.reduce((t, i) => t + (Number(i.qty) || 0), 0);
  const expanded = expandedIds.has(r.id);
  const hasPhotoPaper = files.some(f => f.printType === 'photo');
  const pdfCount = files.filter(f => !f.removed && (f.format || '').toLowerCase() === 'pdf').length;
  const paid = r.paymentStatus === 'paid';
  const amt = Number(r.amount) || 0;
  const paidSoFar = paidOf(r);
  const balance = Math.max(0, amt - paidSoFar);
  const partial = !paid && paidSoFar > 0;
  const priceSet = !!r.priceSet;
  const expected = r.estimatedAmount != null ? Number(r.estimatedAmount) || 0 : (priceSet ? null : amt);
  const editing = editingPrice.has(r.id) && !printed && !isNB;
  const isNew = freshIds.delete(r.id);

  // what the desk should do next: highlighted button + stepper
  const next = printed ? '' : (amt <= 0 && !isNB) ? 'price' : 'done';
  const stepDone = [isNB || priceSet || printed, paid, printed];
  const curStep = stepDone.indexOf(false);
  const steps = ['Price', 'Paid', 'Done'].map((t, i) => `<li class="${stepDone[i] ? 'done' : i === curStep ? 'cur' : ''}">${t}</li>`).join('');

  const chips = [
    isWA ? `<span class="chip wa">${WA_ICON}WhatsApp</span>` : '',
    isNB ? `<span class="chip nb">${paperOnly ? '📄 A4 paper' : '🛍 Store'}</span>` : '',
    (isNB && (r.stockShort || []).length) ? '<span class="chip topay">⚠ Check stock</span>' : '',
    hasPhotoPaper ? '<span class="chip glossy">Glossy</span>' : '',
    printed ? `<span class="chip printed">✓ Printed${r.printedAt ? ' · ' + timeAgo(r.printedAt) : ''}</span>` : '',
  ].join('');

  const shown = files.slice(0, 2).map(f => escapeHtml(f.name)).join(', ');
  const more = files.length > 2 ? ` <span class="more">+${files.length - 2} more</span>` : '';
  const itemsText = items.map(i => (Number(i.qty) || 0) + ' × ' + escapeHtml(i.name)).join(', ');
  const paperTag = (paper && !paperOnly) ? ` <span class="more">+ ${Number(paper.qty)} × A4 paper</span>` : '';
  const filesLine = isNB
    ? `<div class="pd-files" title="${escapeAttr(items.map(i => i.qty + ' × ' + i.name).join(', '))}">${itemsText}</div>`
    : isWA
    ? `<div class="pd-files wa">${WA_ICON}Files sent on WhatsApp</div>`
    : `<div class="pd-files" title="${escapeAttr(files.map(f => f.name).join(', '))}">${shown}${more}${paperTag}</div>`;

  const when = `<span title="${escapeAttr(formatDateTime(r.createdAt).replace('<br>', ' · '))}">${timeAgo(r.createdAt)}</span>`;
  const metaLine = `<div class="pd-meta">${isNB ? itemCount + ' item' + (itemCount === 1 ? '' : 's') : isWA ? 'WhatsApp' : files.length + ' file' + (files.length === 1 ? '' : 's')} · ${when}</div>`;

  // amount + payment state, top right
  const payPill = (isWA && amt <= 0) ? '<span class="pd-pay none">No price</span>'
    : paid ? '<span class="pd-pay paid">✓ Paid</span>'
    : partial ? `<span class="pd-pay partial">₹${paidSoFar} paid · ₹${balance} left</span>`
    : '<span class="pd-pay unpaid">To pay</span>';
  const amtNote = isNB ? 'Store price'
    : (isWA && r.priceOverride) ? 'Manual price'
    : (isWA && priceSet) ? 'From pages'
    : priceSet ? (expected > 0 && expected !== amt ? 'Expected ₹' + expected : 'Price confirmed')
    : amt > 0 ? 'Estimate' : 'Needs a price';
  const showPrintBtn = !printed && !isNB;
  const amountHtml = `<div class="pd-amount${showPrintBtn ? ' inline' : ''}"><b>${amt > 0 ? '₹' + amt : '—'}</b>${payPill}<small>${amtNote}</small></div>`;

  const waC = waCalc(r.waBw, r.waColor, r.waPhoto, r.waExtra);
  const waField = (k, label, val, attrs) => `<label>${label}<input class="pd-price-in pd-wa-in" id="wa-${k}-${r.id}" type="number" inputmode="numeric" step="1" ${attrs} placeholder="0" value="${val ? val : ''}" oninput="waPreview('${r.id}')" onchange="saveWaFields('${r.id}')" onkeydown="if(event.key==='Enter'){this.blur()}"></label>`;
  const waHtml = (isWA && !printed) ? `
      <div class="pd-wa-box">
        <div class="pd-wa-grid">
          ${waField('bw', 'Black &amp; white <em>pages</em>', Number(r.waBw) || 0, 'min="0"')}
          ${waField('col', 'Colour <em>pages</em>', Number(r.waColor) || 0, 'min="0"')}
          ${waField('ph', 'Photo paper <em>pages</em>', Number(r.waPhoto) || 0, 'min="0"')}
          ${waField('ex', 'Extra amount <em>₹, can be −</em>', Number(r.waExtra) || 0, '')}
        </div>
        <div class="pd-wa-sum">
          <span id="wa-bd-${r.id}">${r.priceOverride ? 'Price was set manually' : escapeHtml(waBreakdown(waC))}</span>
          <span class="tot" id="wa-tot-${r.id}">₹${amt}</span>
        </div>
        ${r.priceOverride ? '<div class="pd-wa-note">Manual price in use — change any field above to recalculate from pages.</div>' : ''}
      </div>` : '';

  const editorHtml = editing ? `
      <div class="pd-editor">
        <label for="pr-${r.id}">Customer pays</label>
        <div class="pd-editor-row">
          <span class="cur">₹</span>
          <input class="pd-price-in" id="pr-${r.id}" type="number" inputmode="numeric" min="0" step="1" placeholder="Price" value="${amt > 0 ? amt : ''}" onkeydown="if(event.key==='Enter'){savePrice('${r.id}')}else if(event.key==='Escape'){cancelPriceEdit('${r.id}')}">
          <button type="button" class="pd-btn sm primary" onclick="savePrice('${r.id}')">Save price</button>
          ${expected > 0 && expected !== amt ? `<button type="button" class="pd-btn sm" onclick="useExpected('${r.id}', ${expected})">Use ₹${expected}</button>` : ''}
          <button type="button" class="pd-btn sm" onclick="cancelPriceEdit('${r.id}')" aria-label="Close price editor">✕</button>
        </div>
      </div>` : '';

  // the four actions
  const actionsHtml = printed ? '' : `
      <div class="pd-actions${isNB ? ' n3' : ''}">
        ${isNB ? '' : `<button type="button" class="pd-btn${next === 'price' ? ' next' : ''}" onclick="startPriceEdit('${r.id}')">${priceSet ? 'Change price' : 'Set price'}</button>`}
        ${paid ? '<button type="button" class="pd-btn ok done" disabled>✓ Paid</button>' : `<button type="button" class="pd-btn ok${next === 'paid' ? ' next' : ''}" onclick="markPaid('${r.id}')">Mark as paid</button>`}
        <button type="button" class="pd-btn${next === 'done' ? ' next' : ''}" onclick="completeRequest('${r.id}')" title="${paid ? 'Mark as printed / handed over' : 'Mark as printed and paid'}">Completed</button>
        <button type="button" class="pd-btn danger" onclick="cancelRequest('${r.id}')">Cancel</button>
      </div>`;
  const subHtml = `
      <div class="pd-sub">
        ${!printed && !isNB && r.tokenHash ? `<button type="button" class="pd-tl" onclick="copyTokenLink('${r.id}')" title="Copy the customer's private token link">🔗 Copy link</button>` : ''}
        <button type="button" class="pd-tl" onclick="toggleDetails('${r.id}')" aria-expanded="${expanded}">${expanded ? 'Hide details ▴' : 'Details ▾'}</button>
        ${showPrintBtn ? amountHtml : ''}
      </div>`;

  const filesHtml = files.map((f) => {
    const printable = !f.removed && isPrintable(f);
    const actionBtn = f.removed ? '<span class="pd-gone">file removed after printing</span>' : printable
      ? `<button type="button" class="pd-btn sm" onclick="printFile('${escapeAttr(f.url)}')">Open &amp; print</button>`
      : `<a class="pd-btn sm" href="${escapeAttr(f.url)}" target="_blank" rel="noopener">Download</a>`;
    const pagesLabel = f.pageMode === 'custom' ? `pages ${escapeHtml(f.pages || '')}` : 'all pages';
    return `
      <div class="pd-file">
        <span>${escapeHtml(f.name)} — ${printTypeLabel(f.printType)}, ${pagesLabel}, ${f.copies || 1}× copies</span>
        ${actionBtn}
      </div>`;
  }).join('');

  const bodyHtml = expanded ? `
      <div class="pd-body">
        <div class="pd-spec">
          ${isNB ? `<span><b>${itemCount}</b> item${itemCount === 1 ? '' : 's'}</span><span><b>₹${amt}</b> ${paid ? 'paid' : 'to pay'}</span>${r.paymentId ? `<span>Payment ID: ${escapeHtml(r.paymentId)}</span>` : ''}${(r.stockShort || []).map(x => `<span>⚠ ${escapeHtml(x.name)}: ordered ${x.wanted}, only ${x.had} were in stock</span>`).join('')}`
          : isWA ? '<span><b>WhatsApp</b> request — the customer sends files in chat</span>'
                 : `<span><b>${files.length}</b> file${files.length === 1 ? '' : 's'}</span>${paper ? `<span><b>${Number(paper.qty)}</b> × A4 paper (₹${Number(paper.total) || 0})</span>` : ''}<span><b>₹${amt}</b> ${priceSet ? 'final price' : 'estimated'}</span>`}
        </div>
        ${r.notes && !isWA ? `<p class="pd-note">Note: ${escapeHtml(r.notes)}</p>` : ''}
        ${isNB ? items.map(i => `<div class="pd-file"><span>${Number(i.qty) || 0} × ${escapeHtml(i.name)} — ₹${i.total != null ? i.total : (Number(i.qty) || 0) * (Number(i.price) || 0)}</span></div>`).join('') : filesHtml}
        ${pdfCount > 0 ? `<div class="pd-body-actions"><button type="button" class="pd-btn sm" onclick="mergeAndPrint('${r.id}')">Merge &amp; print all (${pdfCount} PDF${pdfCount === 1 ? '' : 's'})</button></div>` : ''}
      </div>` : '';

  return `
    <article class="pd-card ${printed ? 'is-printed' : paid ? 'is-paid' : 'is-unpaid'}${isWA ? ' wa' : isNB ? ' nb' : ''}${isNew ? ' is-new' : ''}" id="card-${r.id}">
      <div class="pd-top">
        <div class="pd-token"><small>Token</small><b>${escapeHtml(String(r.token || '—'))}</b></div>
        <div class="pd-info">
          <div class="pd-chips">${chips}</div>
          ${filesLine}
          ${metaLine}
        </div>
        ${showPrintBtn ? PRINT_BTN(r) : amountHtml}
      </div>
      ${printed ? '' : `<ol class="pd-steps" aria-label="Progress">${steps}</ol>`}
      ${waHtml}
      ${editorHtml}
      ${actionsHtml}
      ${subHtml}
      ${bodyHtml}
    </article>`;
}

// ---- animated printer button (top right of a card) ----
const PRINT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V3.5h10V8"/><g class="pr-out"><rect class="pr-sheet" x="7.5" y="13" width="9" height="8" rx="1"/><path class="pr-line" d="M9.5 16h5M9.5 18.2h3.5"/></g><path d="M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2"/><circle class="pr-led" cx="18" cy="11.5" r=".9" fill="currentColor" stroke="none"/></svg>`;
function PRINT_BTN(r) {
  return `<button type="button" class="pd-printbtn" onclick="mergeAndPrint('${r.id}')" title="Print" aria-label="Print token ${escapeAttr(String(r.token || ''))}">${PRINT_ICON}</button>`;
}

// ---- toggle the details panel for one request, open below its tile ----
window.toggleDetails = function (id) {
  if (expandedIds.has(id)) {
    expandedIds.delete(id);
  } else {
    expandedIds.add(id);
  }
  render();
};

// ---- format a request's created-at timestamp for display ----
function formatDateTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const datePart = d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
  const timePart = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  return `${datePart}<br>${timePart}`;
}

function isPrintable(file) {
  const fmt = (file.format || '').toLowerCase();
  const type = (file.resourceType || '').toLowerCase();
  return type === 'image' || fmt === 'pdf';
}

window.printFile = function (url) {
  const frame = document.getElementById('print-frame');
  frame.onload = () => {
    try {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    } catch (err) {
      window.open(url, '_blank');
    }
  };
  frame.src = url;
};

// ---- merge every PDF belonging to one request into a single PDF and
// send it straight to the print dialog ----
window.mergeAndPrint = async function (requestId) {
  const req = allRequests.find(r => r.id === requestId);
  if (!req) return;

  // WhatsApp requests have no uploaded files — the customer sends them in chat
  if (req.source === 'whatsapp') {
    window.open('https://web.whatsapp.com/', '_blank', 'noopener');
    return;
  }

  const files = req.files || [];
  const pdfFiles = files.filter(f => (f.format || '').toLowerCase() === 'pdf');
  const otherFiles = files.filter(f => (f.format || '').toLowerCase() !== 'pdf');

  if (pdfFiles.length === 0) {
    alert('No PDF files to merge for this request.');
    return;
  }

  try {
    const merged = await PDFLib.PDFDocument.create();
    for (const f of pdfFiles) {
      const res = await fetch(f.url);
      const bytes = await res.arrayBuffer();
      const src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
      const copies = f.copies || 1;
      const indices = src.getPageIndices();
      for (let c = 0; c < copies; c++) {
        const pages = await merged.copyPages(src, indices);
        pages.forEach(p => merged.addPage(p));
      }
    }
    const mergedBytes = await merged.save();
    const blob = new Blob([mergedBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);

    if (otherFiles.length) {
      alert('Note: ' + otherFiles.map(f => f.name).join(', ') + ' could not be merged (not a PDF) — print those separately using their own "Download" button.');
    }
    printFile(url);
  } catch (err) {
    alert('Could not merge files: ' + (err.message || err));
  }
};

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(str) { return escapeHtml(str); }
