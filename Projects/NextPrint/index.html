<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextPrint</title>
<meta name="description" content="Fast, Convenient & High-Quality Printing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* ---- simple mobile-first home screen, scoped to this page ---- */
  body.home-simple {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .home-wrap {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 28px 20px 40px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .home-brand {
    text-align: center;
    margin-bottom: 22px;
  }
  .home-brand .logo {
    font-size: 1.5rem;
  }
  .home-tiles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .tile {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 14px;
    text-align: center;
  }
  .tile-full {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    gap: 12px;
  }
  .tile-icon {
    font-size: 1.6rem;
    line-height: 1;
    margin-bottom: 8px;
    display: block;
  }
  .tile-full .tile-icon {
    margin-bottom: 0;
  }
  .tile-label {
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .tile-value {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--ink);
  }
  .tile-price .tile-value {
    font-size: 1.4rem;
  }
  .tile-price .tile-value span {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--ink-soft);
    font-family: "IBM Plex Sans", sans-serif;
  }
  .tile-dnd {
    grid-column: 1 / -1;
    padding: 14px;
    font-size: 0.9rem;
    color: var(--ink);
  }

  .home-cta {
    margin-top: 14px;
  }
  .home-cta .btn {
    width: 100%;
    justify-content: center;
    padding: 16px;
    font-size: 1.05rem;
    border-radius: 10px;
  }
  .home-fine {
    text-align: center;
    margin-top: 18px;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  /* ---- shop status banner (driven by admin.html) ---- */
  .shop-status {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: #fff;
    margin-bottom: 14px;
    transition: background .3s, border-color .3s;
  }
  .shop-status .dot-live {
    width: 14px; height: 14px; border-radius: 50%;
    background: #b9b5a8; flex: none;
  }
  .shop-status .ss-title {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600; font-size: 1.25rem; line-height: 1.2;
  }
  .shop-status .ss-sub { font-size: 0.85rem; color: var(--ink-soft); margin-top: 2px; }
  .shop-status.is-open { background: #eaf5ee; border-color: var(--ok); }
  .shop-status.is-open .dot-live {
    background: var(--ok);
    box-shadow: 0 0 0 0 rgba(47,122,77,.5);
    animation: livePulse 1.8s infinite;
  }
  .shop-status.is-closed { background: #fbeceb; border-color: var(--red); }
  .shop-status.is-closed .dot-live { background: var(--red); }
  @keyframes livePulse {
    70% { box-shadow: 0 0 0 12px rgba(47,122,77,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,122,77,0); }
  }
</style>
</head>
<body class="home-simple" data-page="index">

<div class="home-wrap">

  <div class="home-brand">
    <a href="index.html" class="logo">Next<span class="dot">Print</span></a>
  </div>

  <div class="shop-status" id="shopStatus" aria-live="polite">
    <span class="dot-live"></span>
    <div>
      <div class="ss-title" id="ssTitle">Checking shop status…</div>
      <div class="ss-sub" id="ssSub"></div>
    </div>
  </div>

  <div class="home-tiles">
    <div class="tile tile-price">
      <span class="tile-icon">⚫</span>
      <div class="tile-label">Black &amp; White</div>
      <div class="tile-value">₹4 <span>/ page</span></div>
    </div>
    <div class="tile tile-price">
      <span class="tile-icon">🎨</span>
      <div class="tile-label">Colour</div>
      <div class="tile-value">₹7 <span>/ page</span></div>
    </div>

    <div class="tile tile-full">
      <span class="tile-icon">📍</span>
      <div>
        <div class="tile-label">Print available at</div>
        <div class="tile-value">Room No. 136</div>
      </div>
    </div>

    <div class="tile tile-dnd">🔕 Outside this time: Do not disturb</div>
  </div>

  <div class="home-cta">
    <a href="upload.html" class="btn btn-primary">Upload Files</a>
  </div>

  <p class="home-fine">© <span id="year"></span> NextPrint</p>
</div>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="analytics.js"></script>
<script>
/* ---- live shop status from Firebase (set in admin.html) ----
   shop/open  -> true = open, false = closed
   shop/slots -> { "10": true, ... } ticked hours (IST). Shop shows open during a ticked hour;
   otherwise the next run of consecutive ticked hours is shown as the next slot. */
(function () {
  if (typeof firebase === 'undefined' || typeof CONFIG === 'undefined') return;
  if (!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
  var db = firebase.database();

  var box = document.getElementById('shopStatus');
  var title = document.getElementById('ssTitle');
  var sub = document.getElementById('ssSub');
  var state = null;

  function hourLabel(h) { h = ((h % 24) + 24) % 24; return ((h % 12) || 12) + ' ' + (h < 12 ? 'AM' : 'PM'); }
  function istHour() {
    return parseInt(new Intl.DateTimeFormat('en-GB', { hour: '2-digit', hour12: false, timeZone: 'Asia/Kolkata' }).format(new Date()), 10) % 24;
  }
  // Length of the consecutive ticked run that starts at hour `start`
  // (e.g. 7,8,9 ticked -> run of 3 from 7). Capped at 24 so an all-ticked day can't loop.
  function runLength(start) {
    var n = 0;
    while (n < 24 && state.slots[(start + n) % 24] === true) n++;
    return n;
  }

  function render() {
    if (!state) return;
    box.classList.remove('is-open', 'is-closed');
    var nowH = istHour();

    // Open if admin switched the shop on manually, OR the current hour is a ticked slot
    if (state.open || state.slots[nowH] === true) {
      box.classList.add('is-open');
      title.textContent = 'Shop is open';
      var left = state.open ? 0 : runLength(nowH);
      sub.textContent = (left > 0 && left < 24)
        ? 'Open until ' + hourLabel(nowH + left) + '. You can upload your files now.'
        : 'You can upload your files now.';
      return;
    }

    box.classList.add('is-closed');
    title.textContent = 'Shop is closed';

    // Next upcoming slot = first ticked hour after now, extended over the
    // consecutive ticked hours that follow it (7,8,9 -> "7 AM \u2013 10 AM").
    var found = null;
    for (var i = 1; i < 24; i++) {
      var h = (nowH + i) % 24;
      if (state.slots[h] === true) { found = { h: h, len: runLength(h), later: h > nowH }; break; }
    }
    if (!found) { sub.textContent = 'No slot available right now.'; return; }
    var when = found.later ? 'Today' : 'Tomorrow';
    sub.textContent = 'Next available slot: ' + when + ', ' + hourLabel(found.h) + ' \u2013 ' + hourLabel(found.h + found.len);
  }

  db.ref('shop').on('value', function (snap) {
    var v = snap.val() || {};
    state = { open: v.open === true, slots: v.slots || {} };
    render();
  }, function () {
    title.textContent = 'Shop status unavailable';
    sub.textContent = '';
  });
  setInterval(render, 60000);
})();
</script>
</body>
</html>
