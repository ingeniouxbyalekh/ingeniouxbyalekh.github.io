<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ea">
<title>Send your files — NextPrint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     NextPrint — upload page · mobile-first
     ============================================================ */
  :root {
    --bg: #f4f2ea;
    --paper-dim: #ebe8dd;
    --card: #fff;
    --ink: #17181c;
    --ink-soft: #62625c;
    --line: #e3e0d4;
    --red: #c6332e;
    --red-dark: #a02722;
    --blue: #1f5fa8;
    --ok: #2f7a4d;
    --r: 18px;
    --r-sm: 12px;
    --shadow: 0 1px 2px rgba(23,24,28,.05), 0 6px 18px rgba(23,24,28,.06);
    font-size: 15px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; line-height: 1.4; -webkit-font-smoothing: antialiased; min-height: 100vh; overscroll-behavior-y: none; }
  button { font: inherit; color: inherit; touch-action: manipulation; }
  input, textarea { font-size: 16px; } /* stops iOS zoom-on-focus */
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  h1, h2, h3, h4 { font-family: "Fraunces", Georgia, serif; font-weight: 600; margin: 0; letter-spacing: -.01em; line-height: 1.12; }
  [hidden] { display: none !important; }

  /* ---------- header ---------- */
  .site-header { position: sticky; top: 0; z-index: 30; background: rgba(244,242,234,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .site-header .in { max-width: 520px; margin: 0 auto; padding: 0 14px; height: 48px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: "Fraunces", serif; font-weight: 600; font-size: 1.25rem; color: var(--ink); text-decoration: none; }
  .logo .dot { color: var(--red); }
  .room-pill { font-size: .76rem; font-weight: 500; padding: 5px 11px; border-radius: 999px; background: var(--paper-dim); color: var(--ink); text-decoration: none; }

  .app { max-width: 520px; margin: 0 auto; padding: 14px 14px 110px; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .title-row h1 { font-size: 1.55rem; }
  .pill-btn { border: 1.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: .84rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .pill-btn:active { transform: scale(.96); }

  .sec-lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 0 2px 7px; }
  .sec-lbl em { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: .74rem; }

  .msg { padding: 11px 14px; border-radius: var(--r-sm); font-size: .88rem; margin-bottom: 12px; display: flex; gap: 8px; align-items: flex-start; }
  .msg.error { background: #fbeceb; color: var(--red-dark); border: 1px solid #f0c9c7; }
  .msg.success { background: #eef6f0; color: var(--ok); border: 1px solid #c9e4d1; }

  /* ---------- print-mode tiles ---------- */
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .mode { background: var(--card); border: 2px solid transparent; border-radius: 16px; padding: 10px 4px 8px; text-align: center; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 2px; transition: border-color .15s, transform .1s, background .15s; }
  .mode:active { transform: scale(.97); }
  .mode .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--paper-dim); display: grid; place-items: center; margin-bottom: 3px; }
  .mode .ic svg { width: 22px; height: 22px; }
  .mode .tx { display: flex; flex-direction: column; align-items: center; }
  .mode b { font-size: .84rem; font-weight: 600; }
  .mode small { font-size: .68rem; color: var(--ink-soft); }
  .mode[aria-pressed="true"] { border-color: var(--ink); background: #fffdf6; }
  .modes.top .mode { flex-direction: column; justify-content: center; gap: 3px; padding: 7px 4px 7px; cursor: default; pointer-events: none; user-select: none; border-radius: 14px; }
  .modes.top .mode:active { transform: none; }
  .modes.top .mode .ic { margin: 0; width: 26px; height: 26px; border-radius: 8px; flex: none; }
  .modes.top .mode .ic svg { width: 17px; height: 17px; }
  .modes.top .mode .tx { align-items: center; line-height: 1.2; gap: 2px; }
  .modes.top .mode b { font-size: .76rem; }
  .modes.top .mode small { font-size: .84rem; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .mode small s, .mseg small s { text-decoration: line-through; font-weight: 400; color: var(--ink-soft); opacity: .8; }
  .np { font-style: normal; font-weight: 700; color: var(--ok); }
  .modes.sm .mode { box-shadow: none; border-color: var(--line); }
  .modes.sm .mode[aria-pressed="true"] { border-color: var(--ink); }

  /* ---------- offer strip ---------- */
  .offer { margin-bottom: 12px; border-radius: var(--r-sm); padding: 9px 12px; background: linear-gradient(100deg, #fff6e6, #ffeccb); border: 1.5px dashed #f0a53a; color: #5a3200; font-size: .8rem; }
  .offer.unlocked { background: linear-gradient(100deg, #eaf6ee, #dcf0e3); border-color: #6fb78a; color: #1f5a37; }
  .offer .tag { display: inline-block; font-size: .58rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; color: #fff; background: linear-gradient(135deg, #ff9d1c, #ff6a00); margin-right: 6px; vertical-align: 1px; }
  .offer.unlocked .tag { background: var(--ok); }
  .meter { height: 6px; border-radius: 6px; background: rgba(0,0,0,.09); overflow: hidden; margin-top: 7px; }
  .meter > span { display: block; height: 100%; background: linear-gradient(90deg, #ffa31f, #ff6a00); border-radius: 6px; transition: width .3s; }

  /* ---------- empty state ---------- */
  .empty { background: var(--card); border: 2px dashed #c9c5b6; border-radius: 22px; padding: 26px 18px 20px; text-align: center; }
  .empty .up-ic { width: 70px; height: 70px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; margin: 0 auto 12px; box-shadow: 0 10px 24px rgba(198,51,46,.32); animation: float 2.6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-5px); } }
  .empty h2 { font-size: 1.25rem; }
  .empty p { margin: 4px 0 16px; font-size: .84rem; color: var(--ink-soft); }
  .empty .btns { display: flex; flex-direction: column; gap: 8px; }
  .wa-tile { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; background: #f1faf4; border: 1.5px solid #bfe3cb; border-radius: 16px; padding: 10px 14px; transition: transform .1s, background .15s; }
  .wa-tile:active { transform: scale(.98); background: #e4f5ea; }
  .wa-tile:disabled { opacity: .7; cursor: progress; }
  .wa-tile .wa-ic { flex: none; width: 38px; height: 38px; border-radius: 12px; background: #25d366; color: #fff; display: grid; place-items: center; }
  .wa-tile .wa-ic svg { width: 22px; height: 22px; }
  .wa-tile .wa-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
  .wa-tile .wa-tx b { font-size: .92rem; font-weight: 600; color: #14532d; }
  .wa-tile .wa-tx small { font-size: .74rem; color: #3f6b50; }
  .wa-tile .wa-go { flex: none; color: #3f6b50; font-size: 1.1rem; }
  .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .how div { background: rgba(255,255,255,.7); border: 1px solid var(--line); border-radius: 14px; padding: 9px 4px; text-align: center; font-size: .72rem; color: var(--ink-soft); line-height: 1.25; }
  .how b { display: block; font-family: "Fraunces", serif; font-size: 1.1rem; color: var(--red); }

  /* ---------- file cards ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .fc { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px; animation: pop .22s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .fc-main { display: flex; gap: 11px; align-items: stretch; cursor: pointer; }
  .th { position: relative; flex: none; width: 58px; height: 74px; border-radius: 10px; background: var(--paper-dim); overflow: hidden; display: grid; place-items: center; border: 1px solid var(--line); }
  .th img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; background: #fff; }
  .th.bw img { filter: grayscale(1); }
  .th .docic { width: 34px; height: 44px; border-radius: 6px; background: var(--blue); color: #fff; display: grid; place-items: center; font-family: "IBM Plex Mono", monospace; font-size: .6rem; font-weight: 500; }
  .th .kind { position: absolute; left: 3px; bottom: 3px; font-family: "IBM Plex Mono", monospace; font-size: .5rem; font-weight: 500; padding: 1px 4px; border-radius: 4px; color: #fff; background: var(--ink); }
  .th .kind.pdf { background: var(--red); } .th .kind.doc { background: var(--blue); } .th .kind.image { background: #7a4fc2; }
  .fc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .fc-name { font-size: .92rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fc-sub { font-size: .76rem; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
  .fc-sub .lnk { color: var(--blue); font-weight: 600; }
  .fc-right { flex: none; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; }
  .fc-rm { width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent; color: var(--ink-soft); cursor: pointer; font-size: .95rem; margin: -4px -4px 0 0; }
  .fc-rm:active { background: #fbeceb; color: var(--red); }
  .fc-price { text-align: right; line-height: 1.1; }
  .fc-price b { font-family: "Fraunces", serif; font-size: 1.15rem; }
  .fc-price em { display: block; font-style: normal; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ok); }
  .fc-err { margin: 8px 0 0; font-size: .78rem; color: var(--red-dark); background: #fbeceb; border-radius: 8px; padding: 6px 10px; }
  .fc-ctrl { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .mseg { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--paper-dim); padding: 3px; border-radius: 12px; }
  .mseg button { border: none; background: transparent; padding: 8px 2px; border-radius: 9px; cursor: pointer; font-size: .8rem; font-weight: 500; color: var(--ink-soft); white-space: nowrap; line-height: 1.1; }
  .mseg button small { font-size: .62rem; opacity: .75; margin-left: 2px; }
  .mseg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(23,24,28,.2); font-weight: 600; }
  .mstp { flex: none; display: flex; align-items: center; background: var(--paper-dim); border-radius: 12px; padding: 3px; }
  .mstp button { width: 34px; height: 34px; border: none; border-radius: 9px; background: #fff; font-size: 1.1rem; line-height: 1; cursor: pointer; box-shadow: 0 1px 2px rgba(23,24,28,.15); }
  .mstp button:active { transform: scale(.92); }
  .mstp .n { min-width: 28px; text-align: center; font-weight: 600; font-size: .95rem; }
  @media (max-width: 440px) { .mseg button small { display: block; margin: 3px 0 0; } }

  .add-row { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .add-btn { border: 2px dashed #c4c0b0; background: rgba(255,255,255,.6); border-radius: 16px; padding: 14px 8px; font-weight: 600; font-size: .9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .add-btn:active { background: #fff; border-color: var(--red); }

  /* ---------- custom pages row (on each PDF card) ---------- */
  .fc-pages { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .fc-pages .pseg { flex: 1; grid-template-columns: repeat(2, 1fr); }
  .fc-pages.cust .pseg { flex: none; grid-template-columns: auto auto; }
  .fc-pages.cust .pseg button { padding: 8px 12px; }
  .fc-pages .custom-input { flex: 1; min-width: 0; width: auto; padding: 9px 12px; border-radius: 12px; }

  /* ---------- "adding to token" banner ---------- */
  .append-banner { display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid var(--ink); border-radius: var(--r-sm); padding: 10px 12px; margin-bottom: 12px; }
  .append-banner .tk { flex: none; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 1rem; letter-spacing: .12em; background: var(--red); color: #fff; border-radius: 8px; padding: 5px 9px 5px 11px; }
  .append-banner .tx { flex: 1; min-width: 0; line-height: 1.25; font-size: .86rem; }
  .append-banner .tx small { display: block; font-size: .72rem; color: var(--ink-soft); }
  .append-banner .link-btn { flex: none; padding: 4px 2px; }

  /* ---------- notes / pickup ---------- */
  .notes { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
  .notes summary { padding: 12px 14px; font-size: .88rem; font-weight: 500; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  .notes summary::-webkit-details-marker { display: none; }
  .notes summary::after { content: "＋"; color: var(--ink-soft); }
  .notes[open] summary::after { content: "－"; }
  .notes textarea { width: 100%; border: none; border-top: 1px solid var(--line); padding: 12px 14px; font: inherit; font-size: 16px; resize: vertical; min-height: 74px; background: #fcfbf7; }
  .notes textarea:focus { outline: none; background: #fff; }
  .pickup-note { margin: 14px 2px 0; font-size: .8rem; color: var(--ink-soft); text-align: center; }

  /* ---------- bottom bar ---------- */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 492px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .bar .tot { flex: none; line-height: 1.1; }
  .bar .tot span { display: block; font-size: .68rem; color: var(--ink-soft); }
  .bar .tot b { font-family: "Fraunces", serif; font-size: 1.5rem; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid transparent; border-radius: 14px; padding: 14px 18px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background .15s, transform .1s, opacity .15s; width: 100%; min-height: 50px; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--red-dark); }
  .btn-red { background: var(--red); color: #fff; }
  .btn-pay { background: var(--ok); color: #fff; }
  .btn-outline { background: #fff; border-color: var(--ink); color: var(--ink); }
  .btn-outline:hover { border-color: var(--red); color: var(--red); }
  input[type="file"] { display: none; }

  /* ---------- editor sheet ---------- */
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(23,24,28,.55); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet { background: var(--bg); width: 100%; max-width: 520px; height: 92vh; height: 92dvh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden; animation: up .24s ease; }
  @keyframes up { from { transform: translateY(40px); } to { transform: none; } }
  .sh-grab { width: 40px; height: 4px; border-radius: 4px; background: #d2cfc2; margin: 8px auto 0; flex: none; }
  .sh-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 10px; background: var(--bg); }
  .sh-title { flex: 1; min-width: 0; }
  .sh-title b { display: block; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sh-title span { font-size: .74rem; color: var(--ink-soft); }
  .rnd { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 1.1rem; display: grid; place-items: center; flex: none; }
  .rnd:disabled { opacity: .3; }
  .rnd.x { background: var(--paper-dim); border-color: transparent; }
  .sh-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sh-prev { position: relative; flex: none; height: 250px; background: #d6d3c7; }
  .sh-pages { height: 100%; display: flex; gap: 10px; overflow-x: auto; padding: 14px; align-items: center; scroll-snap-type: x proximity; }
  .pg { position: relative; flex: none; height: 100%; background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.2); border-radius: 3px; scroll-snap-align: center; }
  .pg img { height: 100%; width: auto; display: block; }
  .pg.sk { width: 170px; background: repeating-linear-gradient(135deg, #f1efe6, #f1efe6 10px, #e8e5da 10px, #e8e5da 20px); }
  .pg .pn { position: absolute; top: 6px; right: 6px; font-size: .64rem; font-weight: 600; background: rgba(23,24,28,.75); color: #fff; border-radius: 999px; padding: 1px 8px; }
  .sh-pages.bw img { filter: grayscale(1); }
  .pv-msg { margin: auto; text-align: center; color: var(--ink-soft); font-size: .84rem; background: #fff; padding: 20px; border-radius: 16px; max-width: 300px; }
  .expand { position: absolute; right: 10px; bottom: 10px; border: none; background: rgba(23,24,28,.85); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: .78rem; font-weight: 600; cursor: pointer; z-index: 2; }
  .pv-info { position: absolute; left: 10px; bottom: 10px; font-size: .72rem; background: rgba(255,255,255,.94); border-radius: 999px; padding: 4px 10px; z-index: 2; }
  .sheet.expanded .sh-prev { flex: 1; height: auto; }
  .sheet.expanded .sh-pages { flex-direction: column; overflow-x: hidden; overflow-y: auto; align-items: center; padding-bottom: 56px; }
  .sheet.expanded .pg { height: auto; width: 100%; min-height: 120px; }
  .sheet.expanded .pg img { width: 100%; height: auto; }
  .sheet.expanded .pg.sk { min-height: 320px; }
  .sheet.expanded .sh-ctrl { display: none; }
  .sh-ctrl { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stp { display: flex; align-items: center; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 4px; }
  .stp button { width: 44px; height: 44px; border: none; border-radius: 10px; background: var(--paper-dim); font-size: 1.3rem; cursor: pointer; }
  .stp button:active { transform: scale(.93); }
  .stp input { flex: 1; min-width: 0; text-align: center; border: none; background: transparent; font: inherit; font-weight: 600; font-size: 1.15rem; color: var(--ink); -moz-appearance: textfield; padding: 0; }
  .stp input::-webkit-outer-spin-button, .stp input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stp input:focus { outline: none; }
  .pgmodes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pgmodes button { border: 2px solid var(--line); background: #fff; border-radius: 14px; height: 54px; font-weight: 600; font-size: .88rem; cursor: pointer; }
  .pgmodes button[aria-pressed="true"] { border-color: var(--ink); background: #fffdf6; }
  .pgmodes button:disabled { opacity: .4; }
  .custom-input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 14px; font: inherit; font-size: 16px; background: #fff; }
  .custom-input:focus { outline: none; border-color: var(--ink); }
  .custom-input.bad { border-color: var(--red); background: #fdf3f2; }
  .note { font-size: .78rem; color: var(--ink-soft); margin: 0; }
  .link-btn { background: none; border: none; color: var(--blue); font-size: .86rem; text-decoration: underline; cursor: pointer; padding: 6px 0; text-align: left; }
  .sh-foot { display: flex; align-items: center; gap: 14px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); }
  .sh-foot .pr { line-height: 1.1; flex: none; }
  .sh-foot .pr small { display: block; font-size: .68rem; color: var(--ink-soft); }
  .sh-foot .pr b { font-family: "Fraunces", serif; font-size: 1.4rem; }
  .sh-foot .pr .off { font-size: .6rem; font-weight: 700; color: var(--ok); text-transform: uppercase; margin-left: 4px; }

  /* ============================================================
     Upload-progress overlay
     ============================================================ */
  .upov { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: flex; align-items: flex-start; justify-content: center; padding: calc(clamp(56px, 11vh, 120px) + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom)); animation: fade .2s ease; overflow-y: auto; }
  .up-card { width: 100%; max-width: 400px; text-align: center; }
  .printer { width: 190px; height: auto; display: block; margin: 0 auto; }
  .printer .paper { animation: feed 2.2s ease-in-out infinite; transform-box: view-box; }

  .up-ok { width: 110px; height: 110px; margin: 4px auto 14px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; animation: burst .5s cubic-bezier(.2,1.4,.4,1); box-shadow: 0 0 0 0 rgba(47,122,77,.5), 0 14px 30px rgba(47,122,77,.35); }

  .spin { width: 16px; height: 16px; border: 2.5px solid #ddd9cb; border-top-color: var(--red); border-radius: 50%; animation: spin .7s linear infinite; }

  /* ---------- token screen ---------- */

<script>
const $ = id => document.getElementById(id);
$('year').textContent = new Date().getFullYear();

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
}

firebase.initializeApp(CONFIG.firebase);
const db = firebase.database();

const mainView = $('mainView'), listEl = $('list'), fileInput = $('fileInput');
const msgArea = $('msg-area'), resultArea = $('resultArea'), uploadBtn = $('uploadBtn');
const offerBox = $('offerBox'), modeTiles = $('modeTiles'), modeHint = $('modeHint');
const checkoutBar = $('checkout');

// Each entry: { file, id, status, url, progress, kind, pageCount, thumb,
//               printType, pageMode, customPages, copies,
//               resourceType, format, _resolvedPages }
let selectedFiles = [];
let activeReq = null;   // set while adding more files to an existing token
let lastReq = null;     // the most recently saved request (token screen)
let busy = false;
let resultShown = false;
let defaultType = 'bw';

/* ---------- icons ---------- */
const ICONS = {
  bw: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#fff" stroke="#17181c" stroke-width="2"/><path d="M12 3a9 9 0 010 18z" fill="#17181c"/></svg>',
  color: '<svg viewBox="0 0 24 24"><circle cx="9" cy="9.5" r="5.6" fill="#e5484d" opacity=".85"/><circle cx="15" cy="9.5" r="5.6" fill="#3e63dd" opacity=".85"/><circle cx="12" cy="15" r="5.6" fill="#f5c518" opacity=".85"/></svg>',
  photo: '<svg viewBox="0 0 24 24" fill="none" stroke="#17181c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6" fill="#17181c"/><path d="M4 18l5-5 4 3 3-3 4 4"/></svg>',
};
const MODE_META = {
  bw: { name: 'Black & white', short: 'B&W' },
  color: { name: 'Colour', short: 'Colour' },
  photo: { name: 'Glossy paper', short: 'Glossy' },
};
function modePrice(t) {
  return t === 'photo' ? CONFIG.pricing.photoPaper : t === 'color' ? CONFIG.pricing.color : CONFIG.pricing.blackAndWhite;
}
function modeBtnHtml(t, pressed, attr, useShort) {
  return `<button type="button" class="mode" ${attr}="${t}" aria-pressed="${pressed}"><span class="ic">${ICONS[t]}</span><span class="tx"><b>${useShort ? MODE_META[t].short : MODE_META[t].name}</b><small data-rate="${t}">${rateTagHtml(t, false)}</small></span></button>`;
}

function rateTileHtml(t) {
  return `<div class="mode" data-rate-tile="${t}"><span class="ic">${ICONS[t]}</span><span class="tx"><b>${MODE_META[t].short}</b><small data-rate="${t}">${rateTagHtml(t, false)}</small></span></div>`;
}

/* ---------- adding / removing ---------- */
$('addTopBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => addFiles(fileInput.files));
mainView.addEventListener('dragover', e => e.preventDefault());
mainView.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

function fileKind(file) {
  const name = file.name.toLowerCase();
  if (file.type === 'application/pdf' || /\.pdf$/.test(name)) return 'pdf';
  if (/^image\//.test(file.type) || /\.(jpe?g|png)$/.test(name)) return 'image';
  if (/\.docx?$/.test(name)) return 'doc';
  return 'other';
}

function addFiles(fileArr) {
  Array.from(fileArr).forEach(file => {
    const id = 'f' + Math.random().toString(36).slice(2, 9);
    const kind = fileKind(file);
    const item = {
      file, id, status: 'ready', url: null, progress: 0,
      kind, thumb: null,
      pageCount: kind === 'image' ? 1 : null,
      printType: defaultType,
      pageMode: 'all',
      customPages: '',
      copies: 1,
    };
    if (kind === 'image') {
      item._objUrl = URL.createObjectURL(file);
      item.thumb = item._objUrl;
    }
    selectedFiles.push(item);
    if (kind === 'pdf') {
      getPdfPageCount(file)
        .then(count => { item.pageCount = count; renderFileList(); refreshSheetIfOpen(item); })
        .catch(() => { item.pageCount = null; renderFileList(); });
      getPageImg(item, 1).then(u => { item.thumb = u; renderFileList(); }).catch(() => {});
    }
  });
  fileInput.value = '';
  msgArea.innerHTML = '';
  renderFileList();
}

function removeFile(id) {
  const f = selectedFiles.find(x => x.id === id);
  if (f && f._objUrl) { try { URL.revokeObjectURL(f._objUrl); } catch (e) {} }
  selectedFiles = selectedFiles.filter(x => x.id !== id);
  if (!sheetModal.hidden) {
    if (!selectedFiles.length) closeSheet();
    else { sheetIdx = Math.min(sheetIdx, selectedFiles.length - 1); renderSheet(); }
  }
  renderFileList();
}

async function getPdfPageCount(file) {
  const bytes = await file.arrayBuffer();
  const doc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
  return doc.getPageCount();
}

/* ---------- PDF.js helpers (thumbnails + preview pages) ---------- */
function getPdfDoc(f) {
  if (!window.pdfjsLib) return Promise.reject(new Error('PDF preview is unavailable right now.'));
  if (!f._pdfP || f._pdfFor !== f.file) {
    f._pdfFor = f.file;
    f._pvCache = {};
    f._pdfP = (async () => {
      const bytes = await f.file.arrayBuffer();
      return pdfjsLib.getDocument({ data: bytes }).promise;
    })();
  }
  return f._pdfP;
}

async function getPageImg(f, n) {
  const pdf = await getPdfDoc(f);
  const cache = f._pvCache;
  if (cache[n]) return cache[n];
  const page = await pdf.getPage(n);
  const base = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: Math.min(2.2, 560 / base.width) });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(vp.width);
  canvas.height = Math.ceil(vp.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  const url = canvas.toDataURL('image/jpeg', 0.82);
  cache[n] = url;
  return url;
}

// ---- parse a page-range string like "1,3,5-7" into a sorted,
// deduplicated array of page numbers, validated against maxPages
// if known. Returns null if the string is empty or invalid. ----
function parsePageRanges(str, maxPages) {
  if (!str || !str.trim()) return null;
  const parts = str.split(',').map(s => s.trim()).filter(Boolean);
  const pages = new Set();
  for (const part of parts) {
    if (/^\d+$/.test(part)) {
      const n = parseInt(part, 10);
      if (n < 1 || (maxPages && n > maxPages)) return null;
      pages.add(n);
    } else if (/^\d+\s*-\s*\d+$/.test(part)) {
      const [a, b] = part.split('-').map(s => parseInt(s.trim(), 10));
      if (a < 1 || b < a || (maxPages && b > maxPages)) return null;
      for (let i = a; i <= b; i++) pages.add(i);
    } else {
      return null;
    }
  }
  return pages.size ? Array.from(pages).sort((x, y) => x - y) : null;
}

function effectivePages(f) {
  if (f.pageMode === 'custom') {
    const parsed = parsePageRanges(f.customPages, f.pageCount);
    if (parsed && parsed.length) return parsed.length;
  }
  return f.pageCount || 1;
}

// Total pages printed for one file = pages x copies (copies count towards the offer)
function totalPages(f) { return effectivePages(f) * (f.copies || 1); }

// Bulk offer: the pages of ALL files in one order (token) are added up
// (pages x copies; every print type counts, glossy included, one sheet = one
// page). Once the sum reaches minPages, every file in the order gets its
// offer rate.
function baseFiles() { return activeReq ? activeReq.files : []; }

function orderPages() {
  // files already saved under the token (when adding more) count too
  const base = baseFiles().reduce((sum, b) => sum + (b.pageCount || 0) * (b.copies || 1), 0);
  return base + selectedFiles.reduce((sum, f) => sum + totalPages(f), 0);
}

function offerUnlocked() {
  const o = CONFIG.offer;
  return !!o && orderPages() >= o.minPages;
}

// offer price per page for a print type. Glossy uses CONFIG.offer.photoPaper
// (or .glossy) if you set one; otherwise it keeps its normal price.
function offerRate(t) {
  const o = CONFIG.offer;
  if (!o) return modePrice(t);
  if (t === 'color') return o.color;
  if (t === 'photo') return o.photoPaper != null ? o.photoPaper : (o.glossy != null ? o.glossy : modePrice('photo'));
  return o.blackAndWhite;
}

// true only when the offer really lowers this file's rate (drives the "offer" tag)
function offerApplies(f) { return offerUnlocked() && offerRate(f.printType) < modePrice(f.printType); }

// "₹8/page", or "~~₹8~~ ₹7/page" once the offer is unlocked
function rateTagHtml(t, compact) {
  const base = modePrice(t);
  const off = offerUnlocked() ? offerRate(t) : base;
  const unit = compact ? '' : '/page';
  if (off < base) return `<s>₹${base}</s> <i class="np">₹${off}</i>${unit}`;
  return `₹${base}${unit}`;
}
function refreshRateTags() {
  document.querySelectorAll('small[data-rate]').forEach(el => { el.innerHTML = rateTagHtml(el.dataset.rate, el.dataset.compact === '1'); });
}

// price of the files already in the token, re-rated with the current offer state
function baseTotal() {
  const un = offerUnlocked();
  return baseFiles().reduce((sum, b) => sum + (b.pageCount || 0) * ratePerPage(b.printType, un) * (b.copies || 1), 0);
}

function uploadLabel() { return activeReq ? 'Add to token ' + activeReq.token : 'Upload files'; }

function renderAppendBanner() {
  const ab = $('appendBanner');
  if (!activeReq) { ab.hidden = true; ab.innerHTML = ''; return; }
  const n = activeReq.files.length;
  ab.hidden = false;
  ab.innerHTML = `<span class="tk">${escapeHtml(activeReq.token)}</span><span class="tx"><b>Adding to your token</b><small>${n} file${n > 1 ? 's' : ''} already in it · total updates automatically</small></span><button type="button" class="link-btn" id="appendCancel">Cancel</button>`;
}
$('appendBanner').addEventListener('click', e => { if (e.target.closest('#appendCancel')) cancelAppend(); });

function ratePerPage(printType, offer) {
  return offer ? offerRate(printType) : modePrice(printType);
}

function fileRate(f) { return ratePerPage(f.printType, offerUnlocked()); }
function filePrice(f) { return effectivePages(f) * fileRate(f) * (f.copies || 1); }

/* ---------- escaping / labels ---------- */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(str) { return escapeHtml(str); }

function extLabel(f) {
  if (f.kind === 'pdf') return 'PDF';
  if (f.kind === 'doc') return 'DOC';
  if (f.kind === 'image') return 'IMG';
  const m = f.file.name.match(/\.([^.]+)$/);
  return m ? m[1].slice(0, 4).toUpperCase() : 'FILE';
}

function showMsg(text, type) {
  const icon = type === 'error' ? '⚠️' : '✅';
  msgArea.innerHTML = `<div class="msg ${type}"><span>${icon}</span><span>${text}</span></div>`;
  msgArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ---------- print-mode tiles (apply to all) ---------- */
function currentMode() {
  if (!selectedFiles.length) return defaultType;
  const set = new Set(selectedFiles.map(f => f.printType));
  return set.size === 1 ? [...set][0] : null;
}

function renderModes() {
  // rates are display-only; the print type is chosen on each file card
  modeTiles.innerHTML = ['bw', 'color', 'photo'].map(rateTileHtml).join('');
}

function setAllMode(t) {
  defaultType = t;
  selectedFiles.forEach(f => { f.printType = t; });
  afterChange();
}

/* ---------- file cards ---------- */
function subHtml(f) {
  let p;
  if (f.kind === 'pdf') p = f.pageCount ? `${f.pageCount} page${f.pageCount > 1 ? 's' : ''}` : 'reading…';
  else if (f.kind === 'image') p = '1 page';
  else p = 'Word file';
  const sel = (f.pageMode === 'custom' && parsePageRanges(f.customPages, f.pageCount)) ? ` · ${effectivePages(f)} selected` : '';
  return `<span>${p}${sel}</span><span class="lnk">Preview ›</span>`;
}
function priceHtml(f) {
  return `<b>₹${filePrice(f)}</b>${offerApplies(f) ? '<em>offer</em>' : ''}`;
}

function canCustomPages(f) {
  return f.kind === 'pdf' && f.pageCount && f.pageCount > 1 && !f._extracted;
}
function pagesRowHtml(f) {
  if (!canCustomPages(f)) return '';
  const custom = f.pageMode === 'custom';
  const bad = custom && f.customPages && !parsePageRanges(f.customPages, f.pageCount);
  return `
      <div class="fc-pages ${custom ? 'cust' : ''}">
        <div class="mseg pseg" role="group" aria-label="Pages to print">
          <button type="button" data-pm="all" aria-pressed="${!custom}">All pages</button>
          <button type="button" data-pm="custom" aria-pressed="${custom}">Custom</button>
        </div>
        <input type="text" id="cu-${f.id}" class="custom-input ${bad ? 'bad' : ''}" placeholder="e.g. 1,3,5-7 (of ${f.pageCount})" value="${escapeAttr(f.customPages)}" aria-label="Pages to print" autocomplete="off" ${custom ? '' : 'hidden'}>
      </div>`;
}

function syncControls() {
  const has = selectedFiles.length > 0;
  checkoutBar.hidden = !has || resultShown;
  $('notesBlock').hidden = !has;
  $('pickupNote').hidden = !has;
  $('addTopBtn').hidden = !has;
  uploadBtn.disabled = busy || !has;
  if (!busy) uploadBtn.textContent = uploadLabel();
  $('pageTitle').textContent = activeReq ? 'Add more files' : 'Send your files';
  renderAppendBanner();
  renderModes();
}

function recalcPrice() {
  const total = baseTotal() + selectedFiles.reduce((sum, f) => sum + filePrice(f), 0);
  const n = selectedFiles.length;
  $('barAmount').textContent = '₹' + total;
  $('barMeta').textContent = activeReq
    ? (n ? `New total · +${n} file${n > 1 ? 's' : ''}` : 'Token total')
    : (n ? `Total · ${n} file${n > 1 ? 's' : ''}` : 'Total');
  selectedFiles.forEach(f => {
    const pr = $('pr-' + f.id); if (pr) pr.innerHTML = priceHtml(f);
    const sub = $('sub-' + f.id); if (sub) sub.innerHTML = subHtml(f);
    const cp = $('cp-' + f.id); if (cp) cp.textContent = f.copies;
  });
  updateOfferBox();
  refreshRateTags();
  return total;
}

function updateOfferBox() {
  const o = CONFIG.offer;
  if (!o || !selectedFiles.length) { offerBox.hidden = true; return; }
  const glossyOff = offerRate('photo') < modePrice('photo');
  const ratesTxt = `B&amp;W ₹${o.blackAndWhite} · Colour ₹${o.color}` + (glossyOff ? ` · Glossy ₹${offerRate('photo')}` : '');
  const pages = orderPages();
  offerBox.hidden = false;
  if (pages >= o.minPages) {
    offerBox.className = 'offer unlocked';
    offerBox.innerHTML = `<span class="tag">Unlocked</span><strong>Bulk offer applied</strong> · ${ratesTxt}/page`;
  } else {
    const need = o.minPages - pages;
    const pct = Math.max(4, Math.round(pages / o.minPages * 100));
    offerBox.className = 'offer';
    offerBox.innerHTML = `<span class="tag">Offer</span>Add <strong>${need} more page${need > 1 ? 's' : ''}</strong> → ${ratesTxt}/page<div class="meter"><span style="width:${pct}%"></span></div>`;
  }
}

function afterChange() {
  renderFileList();
  updateSheetLive();
}

/* ============================================================
   Editor sheet — live preview + per-file settings
   ============================================================ */
const sheetModal = $('sheetModal'), sheetEl = $('sheet'), shPages = $('shPages'), shCtrl = $('shCtrl');
let sheetIdx = 0;
let pvToken = 0;
let pvTimer = null;
const PV_MAX = 40;

function openSheet(i, expand) {
  if (!selectedFiles.length) return;
  sheetIdx = Math.min(Math.max(i, 0), selectedFiles.length - 1);
  sheetEl.classList.toggle('expanded', !!expand);
  $('shExpand').textContent = expand ? '⤡ Collapse' : '⤢ Expand';
  sheetModal.hidden = false;
  document.body.style.overflow = 'hidden';
  renderSheet();
}

function closeSheet() {
  sheetModal.hidden = true;
  document.body.style.overflow = '';
  pvToken++;
  shPages.innerHTML = '';
}

function refreshSheetIfOpen(f) {
  if (sheetModal.hidden) return;
  if (selectedFiles[sheetIdx] === f) renderSheet();
}

$('shClose').addEventListener('click', closeSheet);
$('shDone').addEventListener('click', closeSheet);
sheetModal.addEventListener('click', e => { if (e.target === sheetModal) closeSheet(); });
$('shPrevBtn').addEventListener('click', () => { if (sheetIdx > 0) { sheetIdx--; renderSheet(); } });
$('shNextBtn').addEventListener('click', () => { if (sheetIdx < selectedFiles.length - 1) { sheetIdx++; renderSheet(); } });
$('shExpand').addEventListener('click', () => {
  const on = sheetEl.classList.toggle('expanded');
  $('shExpand').textContent = on ? '⤡ Collapse' : '⤢ Expand';
});
document.addEventListener('keydown', e => {
  if (sheetModal.hidden) return;
  if (e.key === 'Escape') closeSheet();
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') $('shPrevBtn').click();
  if (e.key === 'ArrowRight') $('shNextBtn').click();
});

function updateSheetLive() {
  if (sheetModal.hidden) return;
  const f = selectedFiles[sheetIdx];
  if (!f) return;
  $('shPrice').innerHTML = '₹' + filePrice(f) + (offerApplies(f) ? '<span class="off">offer</span>' : '');
  shPages.classList.toggle('bw', f.printType === 'bw');
  shCtrl.querySelectorAll('[data-type]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.type === f.printType)));
  const all = $('applyAll');
  if (all) all.textContent = `Use ${MODE_META[f.printType].name} for all ${selectedFiles.length} files`;
}

function renderSheet() {
  const f = selectedFiles[sheetIdx];
  if (!f) { closeSheet(); return; }
  const n = selectedFiles.length;
  const canCustom = f.kind === 'pdf' && f.pageCount && f.pageCount > 1 && !f._extracted;

  let pageInfo;
  if (f.kind === 'pdf') pageInfo = f.pageCount ? `${f.pageCount} page${f.pageCount > 1 ? 's' : ''}` : 'reading pages…';
  else if (f.kind === 'image') pageInfo = '1 page · fitted to A4';
  else pageInfo = 'Word / other';

  $('shName').textContent = f.file.name;
  $('shSub').textContent = (n > 1 ? `File ${sheetIdx + 1} of ${n} · ` : '') + pageInfo;
  $('shPrevBtn').style.display = $('shNextBtn').style.display = n > 1 ? '' : 'none';
  $('shPrevBtn').disabled = sheetIdx === 0;
  $('shNextBtn').disabled = sheetIdx === n - 1;

  shCtrl.innerHTML = `
    <div class="grp">
      <div class="sec-lbl"><span>Print type</span></div>
      <div class="modes sm" style="margin:0">${['bw', 'color', 'photo'].map(t => modeBtnHtml(t, f.printType === t, 'data-type', true)).join('')}</div>
    </div>
    <div class="two">
      <div class="grp">
        <div class="sec-lbl"><span>Copies</span></div>
        <div class="stp">
          <button type="button" id="cpMinus" aria-label="Fewer copies">−</button>
          <input type="number" id="cpInput" min="1" inputmode="numeric" value="${f.copies}" aria-label="Copies">
          <button type="button" id="cpPlus" aria-label="More copies">+</button>
        </div>
      </div>
      <div class="grp">
        <div class="sec-lbl"><span>Pages</span></div>
        <div class="pgmodes">
          <button type="button" data-pm="all" aria-pressed="${f.pageMode === 'all'}">All</button>
          <button type="button" data-pm="custom" aria-pressed="${f.pageMode === 'custom'}" ${canCustom ? '' : 'disabled'}>Custom</button>
        </div>
      </div>
    </div>
    ${canCustom
      ? `<input type="text" id="customInput" class="custom-input" placeholder="Pages e.g. 1,3,5-7" value="${escapeAttr(f.customPages)}" style="display:${f.pageMode === 'custom' ? 'block' : 'none'};">`
      : (f.kind === 'doc' ? '<p class="note">Page selection isn’t available for Word files — all pages will be printed.</p>' : (f.kind === 'other' ? '<p class="note">Page selection is not available for this file type.</p>' : ''))}
    ${n > 1 ? '<button type="button" class="link-btn" id="applyAll"></button>' : ''}
  `;

  shCtrl.querySelectorAll('[data-type]').forEach(btn => {
    btn.addEventListener('click', () => { f.printType = btn.dataset.type; afterChange(); });
  });

  const cp = $('cpInput');
  const setCopies = v => { f.copies = Math.max(1, v || 1); cp.value = f.copies; afterChange(); };
  cp.addEventListener('input', () => { f.copies = Math.max(1, parseInt(cp.value, 10) || 1); afterChange(); });
  cp.addEventListener('blur', () => { cp.value = f.copies; });
  $('cpMinus').addEventListener('click', () => setCopies(f.copies - 1));
  $('cpPlus').addEventListener('click', () => setCopies(f.copies + 1));

  const customInput = $('customInput');
  shCtrl.querySelectorAll('[data-pm]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      f.pageMode = btn.dataset.pm;
      shCtrl.querySelectorAll('[data-pm]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      if (customInput) {
        customInput.style.display = f.pageMode === 'custom' ? 'block' : 'none';
        if (f.pageMode === 'custom') customInput.focus();
      }
      afterChange();
      renderPreviewPages();
    });
  });
  if (customInput) {
    customInput.addEventListener('input', () => {
      f.customPages = customInput.value;
      const ok = !f.customPages || !!parsePageRanges(f.customPages, f.pageCount);
      customInput.classList.toggle('bad', !ok);
      afterChange();
      if (ok) { clearTimeout(pvTimer); pvTimer = setTimeout(renderPreviewPages, 350); }
    });
  }
  const all = $('applyAll');
  if (all) all.addEventListener('click', () => setAllMode(f.printType));

  updateSheetLive();
  renderPreviewPages();
}

async function renderPreviewPages() {
  const my = ++pvToken;
  const f = selectedFiles[sheetIdx];
  if (!f) return;
  shPages.classList.toggle('bw', f.printType === 'bw');
  shPages.scrollTop = 0; shPages.scrollLeft = 0;
  const info = $('pvInfo');
  info.textContent = '';

  try {
    if (f.kind === 'image') {
      if (!f._objUrl) f._objUrl = URL.createObjectURL(f.file);
      shPages.innerHTML = `<div class="pg"><img src="${f._objUrl}" alt=""><span class="pn">Fitted to A4</span></div>`;
      info.textContent = '1 page';
      return;
    }

    if (f.kind === 'pdf') {
      if (!f.pageCount) { shPages.innerHTML = '<div class="pv-msg">Reading pages…</div>'; return; }
      const custom = (!f._extracted && f.pageMode === 'custom') ? parsePageRanges(f.customPages, f.pageCount) : null;
      let pages = custom && custom.length ? custom : null;
      if (!pages) {
        const total = f._extracted ? (await getPdfDoc(f)).numPages : f.pageCount;
        pages = Array.from({ length: total }, (_, i) => i + 1);
      }
      const truncated = pages.length > PV_MAX;
      if (truncated) pages = pages.slice(0, PV_MAX);

      shPages.innerHTML = '';
      const holders = pages.map(() => {
        const d = document.createElement('div');
        d.className = 'pg sk';
        shPages.appendChild(d);
        return d;
      });
      info.textContent = custom ? `${pages.length} selected page${pages.length > 1 ? 's' : ''}` : `${pages.length}${truncated ? '+' : ''} page${pages.length > 1 ? 's' : ''}`;

      for (let i = 0; i < pages.length; i++) {
        const url = await getPageImg(f, pages[i]);
        if (my !== pvToken) return;
        holders[i].className = 'pg';
        holders[i].innerHTML = `<img src="${url}" alt="Page ${pages[i]}"><span class="pn">${pages[i]}</span>`;
      }
      if (truncated) info.textContent += ' · first ' + PV_MAX;
      return;
    }

    shPages.innerHTML = `<div class="pv-msg"><div style="font-size:2rem">📄</div><b style="color:var(--ink)">Preview not available</b><br>${f.kind === 'doc' ? 'Word files can’t be previewed here. All pages will be printed exactly as in your document.' : 'This file type can’t be previewed here.'}</div>`;
  } catch (err) {
    if (my !== pvToken) return;
    shPages.innerHTML = `<div class="pv-msg"><b style="color:var(--red-dark)">Couldn’t load preview</b><br>${escapeHtml(err.message || 'Please try again.')}</div>`;
  }
}

/* ============================================================
   Upload progress overlay (animated)
   ============================================================ */
const upOv = $('upOv');
let upSnap = [];          // files being uploaded (snapshot)
let upStage = 'preparing'; // preparing | uploading | finishing | done | error
let upCurrent = 1;
let upErrMsg = '';
let upShown = 0;
let upRaf = null;

function showUploadOverlay() {
  upSnap = selectedFiles.slice();
  upStage = 'preparing';
  upCurrent = 1;
  upShown = 0;
  upErrMsg = '';
  $('upFiles').innerHTML = upSnap.map(f => `
    <div class="uf" id="uf-${f.id}">
      <span class="st"><span class="dotw">•</span></span>
      <span class="nm">${escapeHtml(f.file.name)}</span>
      <span class="pc">Waiting</span>
      <span class="mb"><i></i></span>
    </div>`).join('');
  $('upActions').hidden = true;
  upOv.hidden = false;
  document.body.style.overflow = 'hidden';
  updateUploadUI();
  cancelAnimationFrame(upRaf);
  upRaf = requestAnimationFrame(upTick);
}

function hideUploadOverlay() {
  upOv.hidden = true;
  document.body.style.overflow = '';
  cancelAnimationFrame(upRaf);
}

function upTarget() {
  if (upStage === 'done') return 100;
  const n = upSnap.length;
  if (!n) return 0;
  let sum = 0;
  upSnap.forEach(f => {
    if (f.status === 'done') sum += 100;
    else if (f.status === 'uploading') sum += 12 + (f.progress || 0) * 0.88;
    else if (f.status === 'converting') sum += 6;
  });
  const p = sum / n;
  return Math.min(p, 96); // last bit is reserved for "creating token"
}

function upTick() {
  const t = upTarget();
  upShown += (t - upShown) * 0.14;
  if (Math.abs(t - upShown) < 0.1) upShown = t;
  $('upPct').textContent = Math.round(upShown) + '%';
  $('upBar').style.width = upShown + '%';
  if (!upOv.hidden && upStage !== 'error') upRaf = requestAnimationFrame(upTick);
}

function updateUploadUI() {
  if (upOv.hidden) return;
  const n = upSnap.length;

  upSnap.forEach(f => {
    const row = $('uf-' + f.id);
    if (!row) return;
    const st = row.querySelector('.st'), pc = row.querySelector('.pc'), bar = row.querySelector('.mb i');
    let cls = 'uf', icon = '<span style="opacity:.35">•</span>', txt = 'Waiting', w = 0;
    if (f.status === 'converting') { icon = '<span class="spin"></span>'; txt = 'Preparing'; w = 8; }
    else if (f.status === 'uploading') { icon = '<span class="spin"></span>'; txt = (f.progress || 0) + '%'; w = f.progress || 0; }
    else if (f.status === 'done') { cls += ' done'; icon = '✓'; txt = 'Uploaded'; w = 100; }
    else if (f.status === 'error') { cls += ' error'; icon = '✕'; txt = 'Failed'; w = 100; }
    row.className = cls;
    if (st.dataset.k !== icon) { st.innerHTML = icon; st.dataset.k = icon; }
    pc.textContent = txt;
    bar.style.width = w + '%';
  });

  const printer = $('upPrinter');
  printer.hidden = upStage === 'done' || upStage === 'error';
  $('upOk').hidden = upStage !== 'done';
  $('upErr').hidden = upStage !== 'error';
  $('upBarWrap').classList.toggle('done', upStage === 'done');

  const titles = {
    preparing: ['Preparing your files', 'Getting them ready for print…'],
    uploading: [`Uploading file ${Math.min(upCurrent, n)} of ${n}`, 'Please keep this page open'],
    finishing: [activeReq ? 'Updating your token' : 'Creating your token', 'Almost done…'],
    done: ['All set!', 'Your token is ready'],
    error: ['Upload failed', upErrMsg || 'Something went wrong.'],
  };
  const [t, s] = titles[upStage] || titles.preparing;
  $('upTitle').textContent = t;
  $('upSub').textContent = s;
}

function showUploadError(msg) {
  upStage = 'error';
  upErrMsg = msg;
  busy = false;
  uploadBtn.classList.remove('busy');
  uploadBtn.textContent = uploadLabel();
  uploadBtn.disabled = false;
  const act = $('upActions');
  act.hidden = false;
  act.innerHTML = '<button type="button" class="btn btn-primary" id="upRetry">Try again</button><button type="button" class="btn btn-outline" id="upBack">Back to my files</button>';
  $('upRetry').addEventListener('click', () => { hideUploadOverlay(); startUpload(); });
  $('upBack').addEventListener('click', () => { hideUploadOverlay(); renderFileList(); });
  updateUploadUI();
}

// ---- convert an image file into a single-page A4 PDF. When `grayscale`
// is true, the image is desaturated on a canvas before being embedded,
// so a "Black & white" image prints as true black & white. ----
function imageFileToA4Pdf(file, grayscale) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read ' + file.name));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode ' + file.name));
      img.onload = () => {
        try {
          const { jsPDF } = window.jspdf;
          const isLandscape = img.width > img.height;
          const orientation = isLandscape ? 'landscape' : 'portrait';
          const doc = new jsPDF({ orientation, unit: 'mm', format: 'a4' });

          const pageW = doc.internal.pageSize.getWidth();
          const pageH = doc.internal.pageSize.getHeight();
          const margin = 10;
          const availW = pageW - margin * 2;
          const availH = pageH - margin * 2;

          const imgRatio = img.width / img.height;
          let drawW = availW;
          let drawH = drawW / imgRatio;
          if (drawH > availH) {
            drawH = availH;
            drawW = drawH * imgRatio;
          }
          const x = (pageW - drawW) / 2;
          const y = (pageH - drawH) / 2;

          let imageData = reader.result;
          let format = /png/i.test(file.type) ? 'PNG' : 'JPEG';

          if (grayscale) {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const px = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = px.data;
            for (let i = 0; i < d.length; i += 4) {
              const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
              d[i] = d[i + 1] = d[i + 2] = gray;
            }
            ctx.putImageData(px, 0, 0);
            imageData = canvas.toDataURL('image/jpeg', 0.92);
            format = 'JPEG';
          }

          doc.addImage(imageData, format, x, y, drawW, drawH, undefined, 'FAST');

          const blob = doc.output('blob');
          const pdfName = file.name.replace(/\.[^.]+$/, '') + '.pdf';
          resolve(new File([blob], pdfName, { type: 'application/pdf' }));
        } catch (err) {
          reject(err);
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---- render one PDF.js page onto a canvas and desaturate it ----
async function renderPageToGrayscaleCanvas(page, scale) {
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;

  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    d[i] = d[i + 1] = d[i + 2] = gray;
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

// ---- rebuild a PDF with every page flattened to grayscale. Each page
// is rasterized (via PDF.js) then re-embedded as an image, since there
// is no way to desaturate a PDF's vector/text content in the browser
// without rendering it first. Text stops being selectable as a result —
// that's the trade-off for guaranteeing true black & white output. ----
// Largest file we try to send in one go. Cloudinary's free plan rejects
// anything over 10 MB, so the converted PDF is kept under that by lowering
// the render resolution for long documents. Raise it (or set
// CONFIG.cloudinary.maxBytes) if your plan allows bigger files.
const UPLOAD_SOFT_LIMIT = (window.CONFIG && CONFIG.cloudinary && CONFIG.cloudinary.maxBytes) || 9.5 * 1024 * 1024;

const tick = () => new Promise(r => setTimeout(r, 0));

// Rasterize every page to grayscale JPEG and bundle them into a PDF.
// Returns null early if the result is clearly going to blow past `budget`.
async function rasterizeGrayscalePdf(pdf, scale, quality, budget) {
  const out = await PDFLib.PDFDocument.create();
  let bytesSoFar = 0;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const canvas = await renderPageToGrayscaleCanvas(page, scale);
    const widthPt = canvas.width / scale;
    const heightPt = canvas.height / scale;
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
    const jpg = new Uint8Array(await blob.arrayBuffer());
    canvas.width = canvas.height = 0;     // free the bitmap right away
    page.cleanup();

    const img = await out.embedJpg(jpg);
    const pg = out.addPage([widthPt, heightPt]);
    pg.drawImage(img, { x: 0, y: 0, width: widthPt, height: heightPt });

    bytesSoFar += jpg.length;
    // after a few pages, bail out early if the projected size is too big
    if (i >= 4 && i < pdf.numPages && (bytesSoFar / i) * pdf.numPages > budget * 1.15) return null;
    if (i % 3 === 0) await tick();        // keep the page responsive
  }
  return await out.save();
}

// ---- rebuild a PDF with every page flattened to grayscale. Each page
// is rasterized (via PDF.js) then re-embedded as an image, since there
// is no way to desaturate a PDF's vector/text content in the browser
// without rendering it first. Long documents are rendered at a lower
// resolution so the result stays small enough to upload. If conversion is
// not possible (or would not shrink below the limit) the original PDF is
// sent instead — the shop still prints it in B&W from the order details. ----
async function convertPdfToGrayscale(file) {
  if (!window.pdfjsLib || !window.PDFLib) return file;
  try {
    const bytes = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
    const n = pdf.numPages;

    // [scale, jpeg quality] — start by page count, then step down if needed
    const start = n <= 25 ? 2 : n <= 60 ? 1.6 : n <= 150 ? 1.35 : 1.15;
    const ladder = [[start, 0.8], [Math.min(start, 1.3), 0.65], [1.0, 0.55], [0.85, 0.5]]
      .filter((v, i, arr) => i === 0 || v[0] < arr[i - 1][0] || v[1] < arr[i - 1][1]);

    let result = null;
    for (const [scale, quality] of ladder) {
      const data = await rasterizeGrayscalePdf(pdf, scale, quality, UPLOAD_SOFT_LIMIT);
      if (data && data.length <= UPLOAD_SOFT_LIMIT) { result = data; break; }
    }
    try { await pdf.destroy(); } catch (e) {}

    if (result) return new File([result], file.name, { type: 'application/pdf' });
    return file; // could not get it small enough — upload the original
  } catch (err) {
    console.warn('B&W conversion skipped:', err);
    return file;
  }
}

// ---- rebuild a PDF containing only the chosen pages ----
async function extractPdfPages(file, pageNumbers) {
  const bytes = await file.arrayBuffer();
  const src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
  const out = await PDFLib.PDFDocument.create();
  const indices = pageNumbers.map(n => n - 1);
  const copied = await out.copyPages(src, indices);
  copied.forEach(p => out.addPage(p));
  const newBytes = await out.save();
  return new File([newBytes], file.name, { type: 'application/pdf' });
}

// ---- upload one file to Cloudinary with progress ----
// Small files go up in one request. Bigger files are sent in 6 MB chunks
// (Cloudinary "chunked upload"), each retried a few times, so a slow or
// flaky connection no longer kills the whole upload.
const UPLOAD_CHUNK = 6 * 1024 * 1024;

function cloudinaryPost(url, formData, headers, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    Object.keys(headers || {}).forEach(k => xhr.setRequestHeader(k, headers[k]));
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total); };
    xhr.onload = () => resolve({ status: xhr.status, text: xhr.responseText });
    xhr.onerror = () => reject(new Error('network'));
    xhr.ontimeout = () => reject(new Error('network'));
    xhr.send(formData);
  });
}

function cloudinaryErrorText(res, fallback) {
  let message = fallback;
  try {
    const errData = JSON.parse(res.text);
    if (errData && errData.error && errData.error.message) message = errData.error.message;
  } catch (err) { /* not JSON — keep the generic message */ }
  if (/too large|file size|maximum/i.test(message)) message += ' (the file is bigger than the upload limit)';
  return message;
}

async function uploadToCloudinary(fileItem) {
  const file = fileItem.file;
  const url = `https://api.cloudinary.com/v1_1/${CONFIG.cloudinary.cloudName}/auto/upload`;
  const fail = msg => {
    fileItem.status = 'error';
    fileItem.errorMessage = msg;
    renderFileList();
    throw new Error(msg);
  };

  fileItem.status = 'uploading';
  fileItem.progress = 0;
  renderFileList();

  let last = null;
  const uploadId = Date.now() + '-' + Math.random().toString(36).slice(2);
  const chunked = file.size > UPLOAD_CHUNK;
  const step = chunked ? UPLOAD_CHUNK : file.size;
  let lastPaint = 0;
  const paint = (sent) => {
    const pct = Math.min(99, Math.round((sent / file.size) * 100));
    const now = Date.now();
    if (pct !== fileItem.progress && now - lastPaint > 120) {
      fileItem.progress = pct; lastPaint = now; renderFileList();
    }
  };

  for (let startByte = 0; startByte < file.size || startByte === 0; startByte += step) {
    const endByte = Math.min(startByte + step, file.size);
    const fd = new FormData();
    fd.append('file', chunked ? file.slice(startByte, endByte) : file, file.name);
    fd.append('upload_preset', CONFIG.cloudinary.uploadPreset);
    const headers = chunked ? {
      'X-Unique-Upload-Id': uploadId,
      'Content-Range': `bytes ${startByte}-${endByte - 1}/${file.size}`,
    } : {};

    let res = null, tries = 0;
    while (true) {
      try {
        res = await cloudinaryPost(url, fd, headers, (loaded, total) => paint(startByte + (loaded / total) * (endByte - startByte)));
        if (res.status >= 500 && tries < 3) { tries++; await new Promise(r => setTimeout(r, 800 * tries)); continue; }
        break;
      } catch (e) {
        if (tries >= 3) fail('Network error uploading ' + file.name + '. Check your connection and try again.');
        tries++;
        await new Promise(r => setTimeout(r, 800 * tries));
      }
    }
    if (res.status < 200 || res.status >= 300) fail(cloudinaryErrorText(res, 'Upload failed for ' + file.name));
    last = res;
    if (!chunked) break;
  }

  let data;
  try { data = JSON.parse(last.text); } catch (e) { data = null; }
  if (!data || !data.secure_url) fail('Upload did not finish for ' + file.name + '. Please try again.');

  fileItem.status = 'done';
  fileItem.progress = 100;
  fileItem.url = data.secure_url;
  fileItem.resourceType = data.resource_type;
  fileItem.format = data.format;
  fileItem.publicId = data.public_id || null;
  fileItem.deleteToken = data.delete_token || null;
  renderFileList();
  return data;
}

// ---- "Share via WhatsApp": creates a brand-new token (saved as its own
// pending request, flagged source:'whatsapp', with no files attached) and
// opens a WhatsApp chat with the shop with the token already in the message.
// The customer then attaches their files in that chat. ----
const WHATSAPP_NUMBER = (window.CONFIG && CONFIG.whatsappNumber) || '919556771667';
let waBusy = false;

async function shareViaWhatsApp(btn) {
  if (waBusy) return;
  waBusy = true;
  btn.disabled = true;
  const sub = btn.querySelector('small');
  const oldSub = sub ? sub.textContent : '';
  if (sub) sub.textContent = 'Creating your token…';
  // open the tab inside the click so popup blockers allow it; filled in below
  const win = window.open('', '_blank');

  try {
    const token = await nextToken();
    await db.ref('printRequests').push().set({
      token,
      status: 'pending',
      paymentStatus: 'unpaid',
      amount: 0,
      source: 'whatsapp',
      notes: 'Customer will send files on WhatsApp',
      createdAt: firebase.database.ServerValue.TIMESTAMP,
    });

    const text =
      'Hii NextPrint 👋\n' +
      'I want to get some printing done. My token number is *' + token + '*.\n' +
      "I'm sending my files here on WhatsApp — please print them and keep them ready for pickup at Room No. 136.\n\n" +
      'Print type (B&W / Colour / Glossy):\nCopies:\nPages (all or specific):\n\nThank you!';
    const link = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(text);

    if (win) win.location.href = link; else window.location.href = link;
    showMsg('Token <b>' + token + '</b> created. Send your files in the WhatsApp chat.', 'success');
  } catch (err) {
    if (win) win.close();
    showMsg('We could not create a token (' + escapeHtml(err.message || String(err)) + '). Please try again.', 'error');
  } finally {
    waBusy = false;
    btn.disabled = false;
    if (sub) sub.textContent = oldSub;
  }
}

// ---- pickup token: a sequential 4-digit number from 1001–9999 that
// wraps back to 1001 once it reaches the top. Stored as a single
// counter in Firebase and advanced atomically with a transaction, so
// concurrent submissions never hand out the same token. ----
async function nextToken() {
  const result = await db.ref('tokenCounter/current').transaction(current => {
    if (!current || current >= 9999) return 1001;
    return current + 1;
  });
  return String(result.snapshot.val());
}

// ---- optional post-token survey: 1-5 stars, quick-pick reasons that
// change with the rating, and free-text feedback. Saved to
// feedback/<id>, and also added to running totals in ratingStats/
// (per-day buckets + all-time) so averages survive "Clear feedback". ----
const SURVEY_OPTIONS = {
  1: { title: 'Sorry about that. What went wrong?', opts: ['Terrible website', 'Prices are too high', 'WhatsApp is a better option', 'Upload kept failing or was too slow', 'Too confusing to use'] },
  2: { title: 'We can do better. What bothered you?', opts: ['Hard to use', 'Prices are high', 'Upload was slow', 'Payment was confusing', 'WhatsApp seems easier'] },
  3: { title: 'Okay is not great. What could improve?', opts: ['Could be faster', 'Some steps were confusing', 'Pricing is average', 'Needs more print options', 'It was fine overall'] },
  4: { title: 'Glad it went well! What worked?', opts: ['Easy to use', 'Fast upload', 'Fair prices', 'Smooth payment', 'Just minor issues'] },
  5: { title: 'Awesome! What did you like?', opts: ['Super easy website', 'Fast upload', 'Great prices', 'Easy payment', 'Will use again'] },
};

const RATE_LABELS = { 1: 'Terrible', 2: 'Poor', 3: 'Okay', 4: 'Good', 5: 'Excellent' };

function surveyDayKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function initSurvey(token, requestKey) {
  const box = $('survey');
  if (!box) return;
  const stars = [...document.querySelectorAll('#surveyStars button')];
  const more = $('surveyMore');
  const optsEl = $('surveyOpts');
  let rating = 0;

  $('surveySkip').addEventListener('click', () => { box.remove(); });

  stars.forEach(btn => btn.addEventListener('click', () => {
    const n = Number(btn.dataset.n);
    const changed = n !== rating;
    rating = n;
    stars.forEach(s => {
      const on = Number(s.dataset.n) <= n;
      s.classList.toggle('on', on);
      s.setAttribute('aria-checked', String(Number(s.dataset.n) === n));
    });
    box.dataset.tone = n <= 2 ? 'low' : n === 3 ? 'mid' : 'high';
    $('rateLabel').textContent = RATE_LABELS[n];
    if (changed) {
      const cfg = SURVEY_OPTIONS[n];
      $('surveyTitle').textContent = cfg.title;
      optsEl.innerHTML = cfg.opts.map(o =>
        `<label class="survey-opt"><input type="checkbox" value="${o}"><span class="tick">✓</span><span>${o}</span></label>`).join('');
    }
    more.classList.add('show');
  }));

  $('surveySubmit').addEventListener('click', async (e) => {
    if (!rating) return;
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = 'Sending…';
    const reasons = [...optsEl.querySelectorAll('input:checked')].map(i => i.value);
    const comment = $('surveyComment').value.trim().slice(0, 500);
    const dKey = surveyDayKey(new Date());
    try {
      await db.ref('feedback').push({
        rating, reasons, comment, token, requestKey,
        day: dKey,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
      });
      const bump = cur => {
        cur = cur || { count: 0, sum: 0 };
        return { count: (cur.count || 0) + 1, sum: (cur.sum || 0) + rating };
      };
      await db.ref('ratingStats/days/' + dKey).transaction(bump);
      await db.ref('ratingStats/total').transaction(cur => {
        cur = cur || { count: 0, sum: 0 };
        const out = { count: (cur.count || 0) + 1, sum: (cur.sum || 0) + rating };
        for (let i = 1; i <= 5; i++) out['s' + i] = (cur['s' + i] || 0) + (i === rating ? 1 : 0);
        return out;
      });
      box.innerHTML = '<div class="survey-thanks">🙏 Thanks for your feedback!</div>';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Submit feedback';
      alert('Could not send feedback right now. You can skip it, no problem.');
    }
  });
}
