      <div class="b">
        <div class="k">Amount</div>
        <div class="v">₹${amount}</div>
        <div class="s" id="payStatus">${payStatusText(req)}</div>
      </div>
      ${canPay ? `
      <div class="b pay wide">
        <div class="k">Pay online</div>
        <p>${paid > 0 ? 'Pay the remaining balance now, or at the counter when you collect.' : 'Pay now, or at the counter when you collect.'}</p>
        <button type="button" class="btn btn-pay" id="payNowBtn">${payLabel} · ₹${due}</button>
        <div id="payMsg"></div>
      </div>` : ''}
      ${showSurvey ? `
      <div class="b survey wide" id="survey">
        <button type="button" class="survey-skip" id="surveySkip">Skip</button>
        <h4>How was your experience?</h4>
        <div class="stars" id="surveyStars" role="radiogroup" aria-label="Rate your experience from 1 to 5">
          ${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}" role="radio" aria-checked="false" aria-label="${n} star${n>1?'s':''}">★</button>`).join('')}
        </div>
        <div class="rate-label" id="rateLabel">Tap a star (optional)</div>
        <div class="survey-more" id="surveyMore">
          <div class="survey-title" id="surveyTitle"></div>
          <div class="survey-opts" id="surveyOpts"></div>
          <textarea id="surveyComment" maxlength="500" placeholder="Anything else? (optional)"></textarea>
          <button type="button" class="survey-submit" id="surveySubmit">Submit feedback</button>
        </div>
      </div>` : ''}
      <div style="grid-column:1/-1"><button type="button" class="btn btn-outline" id="sendAnotherBtn">＋ Add more files to this token</button></div>
    </div>`;

  if (showSurvey) initSurvey(token, requestKey);
  window.scrollTo({ top: 0, behavior: 'smooth' });

  const copyBtn = $('copyToken');
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(token); copyBtn.textContent = 'Copied ✓'; }
    catch (e) { copyBtn.textContent = 'Press and hold to copy'; }
    setTimeout(() => { copyBtn.textContent = 'Copy token'; }, 1800);
  });

  const payBtn = $('payNowBtn');
  if (payBtn) {
    payBtn.addEventListener('click', () => startPayment(req, due, payBtn, $('payMsg'), payLabel));
  }
  $('sendAnotherBtn').addEventListener('click', enterAppendMode);
}

// ---- "Add more files to this token": go back to the upload screen but keep
// the same token. New files are appended to that request and the total is
// recalculated (including the bulk offer) when they're uploaded. ----
function enterAppendMode() {
  activeReq = lastReq;
  msgArea.innerHTML = '';
  resultArea.innerHTML = '';
  resultArea.hidden = true;
  resultShown = false;
  mainView.hidden = false;
  $('notes').value = '';
  renderFileList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelAppend() {
  selectedFiles.forEach(f => { if (f._objUrl) { try { URL.revokeObjectURL(f._objUrl); } catch (e) {} } });
  selectedFiles = [];
  const req = activeReq;
  activeReq = null;
  mainView.hidden = true;
  if (req) showTokenSuccess(req, { noSurvey: true });
}

// ---- validation before upload: checks files are attached
// and any custom page ranges are valid, then returns the total amount
// (or null, having already shown an error message) ----
function validateAndGetAmount() {
  msgArea.innerHTML = '';

  if (selectedFiles.length === 0) {
    showMsg('Please attach at least one file.', 'error');
    return null;
  }

  for (let i = 0; i < selectedFiles.length; i++) {
    const f = selectedFiles[i];
    if (f.pageMode === 'custom' && !f._extracted) {
      const parsed = parsePageRanges(f.customPages, f.pageCount);
      if (!parsed) {
        showMsg(`Please enter valid page numbers for "${escapeHtml(f.file.name)}" (e.g. 1,3,5-7).`, 'error');
        const inp = $('cu-' + f.id);
        if (inp) { inp.classList.add('bad'); inp.scrollIntoView({ behavior: 'smooth', block: 'center' }); inp.focus({ preventScroll: true }); }
        else openSheet(i);
        return null;
      }
      f._resolvedPages = parsed;
    } else if (f.pageMode !== 'custom') {
      f._resolvedPages = null;
    }
  }

  const amount = recalcPrice();
  if (amount <= 0) {
    showMsg('Please check your print settings — the total looks incorrect.', 'error');
    return null;
  }
  return amount;
}

// ---- file prep + upload ----
async function processFiles() {
  let idx = 0;
  for (const f of selectedFiles) {
    idx++;
    if (f.status === 'done') continue;
    upCurrent = idx;

    const wantsGrayscale = f.printType === 'bw';

    // Convert images to a single-page A4 PDF first (desaturated up
    // front when Black & white is selected).
    if (f.kind === 'image') {
      upStage = 'preparing';
      f.status = 'converting';
      renderFileList();
      f.file = await imageFileToA4Pdf(f.file, wantsGrayscale);
      f.kind = 'pdf';
      f.pageCount = 1;
      f._grayscaled = wantsGrayscale;
    }

    // Trim down to only the chosen pages (once — retries skip this).
    if (f.kind === 'pdf' && !f._extracted && f.pageMode === 'custom' && f._resolvedPages && f._resolvedPages.length) {
      upStage = 'preparing';
      f.status = 'converting';
      renderFileList();
      f.file = await extractPdfPages(f.file, f._resolvedPages);
      f._extracted = true;
    }

    // Flatten real PDF files to grayscale when Black & white is
    // selected (image-origin PDFs are already grayscale from above).
    if (f.kind === 'pdf' && wantsGrayscale && !f._grayscaled) {
      upStage = 'preparing';
      f.status = 'converting';
      renderFileList();
      f.file = await convertPdfToGrayscale(f.file);
      f._grayscaled = true;
    }

    upStage = 'uploading';
    await uploadToCloudinary(f);
  }
}

// ---- "Upload Files": prep & upload files (with the animated progress
// overlay), then save the request as unpaid and hand out the token.
// "Pay now" is offered on the token screen. ----
async function startUpload() {
  if (busy) return;
  if (!sheetModal.hidden) closeSheet();
  const amount = validateAndGetAmount();
  if (amount === null) return;

  busy = true;
  uploadBtn.disabled = true;
  showUploadOverlay();

  try {
    await processFiles();
  } catch (err) {
    showUploadError(err.message || 'Something went wrong preparing your files.');
    return;
  }

  upStage = 'finishing';
  updateUploadUI();
  const formValues = { notes: $('notes').value.trim() };
  await saveRequest(formValues, amount, { paymentStatus: 'unpaid' });
}
uploadBtn.addEventListener('click', startUpload);

// ---- "Pay now" (shown on the token screen): opens Razorpay for the amount
// still due on the request and, on success, marks the request as paid ----
function startPayment(req, amount, payBtn, payMsg, label) {
  label = label || 'Pay now';
  if (!CONFIG.paymentsEnabled || !window.Razorpay) {
    payMsg.innerHTML = '<div class="msg error">Online payment is unavailable right now. You can pay at the counter.</div>';
    return;
  }
  payMsg.innerHTML = '';
  payBtn.disabled = true;
  payBtn.textContent = 'Opening payment…';

  const rzp = new Razorpay({
    key: CONFIG.razorpay.keyId,
    amount: Math.round(amount * 100), // paise
    currency: 'INR',
    name: 'NextPrint',
    description: 'Print request ' + req.token,
    handler: function (response) {
      payBtn.textContent = 'Confirming payment…';
      db.ref('printRequests/' + req.key).update({
        paymentStatus: 'paid',
        paymentId: response.razorpay_payment_id,
        paymentMethod: 'razorpay',
        paidAmount: req.amount,
      }).then(() => {
        req.paymentStatus = 'paid';
        req.paidAmount = req.amount;
        payBtn.style.display = 'none';
        const ps = $('payStatus'); if (ps) ps.textContent = '✓ Paid online';
        payMsg.innerHTML = '<div class="msg success">✅ Payment received. Thank you!</div>';
      }).catch(() => {
        payBtn.style.display = 'none';
        payMsg.innerHTML = '<div class="msg error">Payment went through (ID: ' + escapeHtml(response.razorpay_payment_id) + ') but we could not update your request. Please show this ID at the counter.</div>';
      });
    },
    modal: {
      ondismiss: function () {
        payBtn.disabled = false;
        payBtn.textContent = label + ' · ₹' + amount;
      },
    },
  });

  rzp.on('payment.failed', function (response) {
    payBtn.disabled = false;
    payBtn.textContent = label + ' · ₹' + amount;
    const desc = response && response.error && response.error.description;
    payMsg.innerHTML = '<div class="msg error">Payment failed' + (desc ? ': ' + escapeHtml(desc) : '.') + ' You can try again or pay at the counter.</div>';
  });

  rzp.open();
}

function buildFilesData() {
  return selectedFiles.map(f => ({
    name: f.file.name,
    url: f.url,
    resourceType: f.resourceType,
    format: f.format,
    printType: f.printType,
    copies: f.copies,
    pageMode: f.pageMode,
    pages: f.pageMode === 'custom' && f._resolvedPages ? f._resolvedPages.join(',') : 'all',
    pageCount: effectivePages(f),
    publicId: f.publicId || null,
    deleteToken: f.deleteToken || null,
  }));
}

// ---- shared "it worked" ending for new tokens and added-to-token saves ----
function finishSave(req, opts) {
  upStage = 'done';
  busy = false;
  updateUploadUI();
  selectedFiles.forEach(f => { if (f._objUrl) { try { URL.revokeObjectURL(f._objUrl); } catch (e) {} } });
  selectedFiles = [];
  lastReq = req;
  activeReq = null;
  uploadBtn.classList.remove('busy');
  uploadBtn.textContent = uploadLabel();
  setTimeout(() => {
    hideUploadOverlay();
    showTokenSuccess(req, opts || {});
  }, 1200);
}

// ---- add the newly uploaded files to an existing request (same token) and
// store the recalculated total ----
async function appendToRequest(formValues, amount) {
  const req = activeReq;
  const ref = db.ref('printRequests/' + req.key);

  let cur;
  try {
    cur = (await ref.once('value')).val();
  } catch (err) {
    showUploadError('We could not reach your request (' + (err.message || err) + '). Please try again.');
    return;
  }

  // If the shop has already processed that request, start a fresh token instead.
  if (!cur || (cur.status && cur.status !== 'pending')) {
    const oldToken = req.token;
    activeReq = null;
    const ownAmount = recalcPrice();
    return saveRequest(formValues, ownAmount, { paymentStatus: 'unpaid' },
      'Token ' + oldToken + ' was already being processed, so these files got a new token.');
  }

  const prevFiles = Array.isArray(cur.files) ? cur.files : Object.values(cur.files || {});
  const newFiles = buildFilesData();
  const files = prevFiles.concat(newFiles);
  const prevPaid = cur.paymentStatus === 'paid'
    ? (cur.paidAmount != null ? cur.paidAmount : (cur.amount || 0))
    : (cur.paidAmount || 0);
  const notes = [cur.notes, formValues.notes].filter(Boolean).join('\n');
  const paymentStatus = prevPaid > 0 && prevPaid >= amount ? 'paid' : 'unpaid';

  try {
    await ref.update({
      files, amount, notes, paymentStatus,
      paidAmount: prevPaid,
      updatedAt: firebase.database.ServerValue.TIMESTAMP,
    });
  } catch (err) {
    showUploadError('We could not add the files to your token (' + (err.message || err) + '). Please try again.');
    return;
  }

  finishSave({ key: req.key, token: req.token, files, amount, notes, paymentStatus, paidAmount: prevPaid },
    { added: newFiles.length });
}

async function saveRequest(formValues, amount, paymentInfo, notice) {
  if (activeReq) return appendToRequest(formValues, amount);

  let token;
  try {
    token = await nextToken();
  } catch (err) {
    showUploadError('We could not generate a token (' + (err.message || err) + '). Check that your Firebase Realtime Database rules allow read/write on the "tokenCounter" path.');
    return;
  }

  const filesData = buildFilesData();

  const record = {
    ...formValues,
    amount,
    token,
    status: 'pending',
    paymentStatus: paymentInfo.paymentStatus,
    ...(paymentInfo.paymentId ? { paymentId: paymentInfo.paymentId, paymentMethod: 'razorpay' } : {}),
    createdAt: firebase.database.ServerValue.TIMESTAMP,
    files: filesData,
  };

  const newRef = db.ref('printRequests').push();
  try {
    await newRef.set(record);
  } catch (err) {
    showUploadError('We could not save your request (' + (err.message || err) + '). Please try again or contact us directly.');
    return;
  }

  finishSave({
    key: newRef.key, token, files: filesData, amount,
    notes: formValues.notes || '', paymentStatus: paymentInfo.paymentStatus, paidAmount: 0,
  }, notice ? { notice } : {});
}

renderFileList();
</script>
<script src="analytics.js"></script>
