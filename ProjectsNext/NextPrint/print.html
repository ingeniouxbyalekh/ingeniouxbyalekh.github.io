<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print desk — NextPrint</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* ===== Print desk — redesign ===== */
  .pd-head { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:18px; }
  .pd-head h1 { font-family:"Fraunces", Georgia, serif; font-size:1.8rem; margin:0; line-height:1.1; }
  .pd-head .pd-sub { margin:4px 0 0; font-size:.84rem; color:var(--ink-soft, #62625c); }
  .pd-tools { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }

  .pd-tabs { display:inline-flex; gap:2px; padding:3px; border-radius:13px; background:#ebe8dd; }
  .pd-tab { display:inline-flex; align-items:center; gap:6px; border:0; background:transparent; font:inherit; font-size:.86rem; font-weight:500; color:var(--ink-soft, #62625c); padding:7px 13px; border-radius:10px; cursor:pointer; }
  .pd-tab .n { font-size:.7rem; font-weight:600; padding:1px 7px; border-radius:999px; background:rgba(0,0,0,.07); }
  .pd-tab.active { background:#fff; color:var(--ink, #17181c); font-weight:600; box-shadow:0 1px 3px rgba(23,24,28,.16); }

  .pd-switch { display:inline-flex; align-items:center; gap:8px; border:1.5px solid #cfd8d2; background:#fff; border-radius:999px; padding:5px 12px 5px 6px; font:inherit; font-size:.84rem; font-weight:600; color:#3c4a41; cursor:pointer; transition:background .15s, border-color .15s; }
  .pd-switch .track { position:relative; width:34px; height:20px; border-radius:999px; background:#c9cfcb; transition:background .15s; flex:none; }
  .pd-switch .track::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s; }
  .pd-switch svg { width:15px; height:15px; color:#25d366; flex:none; }
  .pd-switch .n { font-size:.7rem; padding:1px 7px; border-radius:999px; background:rgba(0,0,0,.07); font-weight:600; }
  .pd-switch[aria-checked="true"] { background:#f1faf4; border-color:#9fd6b2; color:#14532d; }
  .pd-switch[aria-checked="true"] .track { background:#25d366; }
  .pd-switch[aria-checked="true"] .track::after { transform:translateX(14px); }

  .pd-list { display:flex; flex-direction:column; gap:12px; }
  .pd-card { display:grid; grid-template-columns:auto 1fr auto; gap:6px 16px; align-items:center; background:#fff; border:1px solid var(--line, #e3e0d4); border-radius:18px; padding:14px 16px; box-shadow:0 1px 2px rgba(23,24,28,.05), 0 6px 18px rgba(23,24,28,.05); }
  .pd-card.wa { border-color:#b5e0c3; background:linear-gradient(100deg, #eefaf2, #fff 60%); }
  .pd-token { min-width:88px; text-align:center; padding:9px 12px 8px; border-radius:14px; background:#17181c; color:#fff; }
  .pd-token small { display:block; font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; opacity:.7; }
  .pd-token b { display:block; font-family:"Fraunces", Georgia, serif; font-size:1.75rem; line-height:1.05; font-weight:600; }
  .pd-card.wa .pd-token { background:#128c4a; }

  .pd-main { min-width:0; }
  .pd-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:.7rem; font-weight:600; letter-spacing:.02em; padding:3px 9px; border-radius:999px; background:#eee; color:#444; }
  .chip svg { width:12px; height:12px; }
  .chip.wa { background:#25d366; color:#fff; }
  .chip.paid { background:#dff1e5; color:#1f5a37; }
  .chip.topay { background:#fdf0d9; color:#8a5200; }
  .chip.nb { background:#e3f0fb; color:#16507f; }
  .pd-card.nb { border-color:#b9d6ee; background:linear-gradient(100deg, #eef6fd, #fff 60%); }
  .pd-card.nb .pd-token { background:#1f6fb0; }
  .chip.glossy { background:#efe6fb; color:#5b34a0; }
  .chip.printed { background:#e6e6e6; color:#555; text-transform:capitalize; }
  .pd-files { font-size:.92rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pd-files.wa { display:flex; align-items:center; gap:6px; color:#14532d; white-space:normal; }
  .pd-files.wa svg { width:16px; height:16px; color:#25d366; flex:none; }
  .pd-files .more { color:var(--ink-soft, #62625c); font-weight:400; }
  .pd-meta { margin-top:3px; font-size:.78rem; color:var(--ink-soft, #62625c); }
  .pd-meta b { color:var(--ink, #17181c); font-weight:600; }

  .pd-actions { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
  .pd-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line, #d9d6c8); background:#fff; color:var(--ink, #17181c); border-radius:11px; padding:8px 14px; font:inherit; font-size:.84rem; font-weight:600; text-decoration:none; cursor:pointer; }
  .pd-btn:active { transform:scale(.97); }
  .pd-btn.primary { background:var(--ink, #17181c); border-color:var(--ink, #17181c); color:#fff; }
  .pd-btn.wa { background:#25d366; border-color:#25d366; color:#fff; }
  .pd-btn.danger { color:#a02722; border-color:#efc9c6; }
  .pd-btn.sm { padding:6px 11px; font-size:.78rem; border-radius:9px; }
  .pd-btn:disabled { opacity:.6; cursor:wait; }

  .pd-body { grid-column:1 / -1; margin-top:8px; padding-top:12px; border-top:1px dashed var(--line, #ddd9ca); display:flex; flex-direction:column; gap:10px; }
  .pd-spec { display:flex; flex-wrap:wrap; gap:14px; font-size:.86rem; color:var(--ink-soft, #62625c); }
  .pd-spec b { color:var(--ink, #17181c); }
  .pd-note { margin:0; font-size:.86rem; }
  .pd-file { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; border-radius:10px; background:#faf9f4; font-size:.84rem; }
  .pd-file span { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .pd-body-actions { display:flex; flex-wrap:wrap; gap:8px; }

  .pd-empty { text-align:center; color:var(--ink-soft, #62625c); padding:56px 10px; background:#fff; border:1px dashed var(--line, #d9d6c8); border-radius:18px; }
  .pd-hidden-note { text-align:center; font-size:.82rem; color:#3c4a41; padding:10px; border-radius:12px; background:#f1faf4; border:1px dashed #9fd6b2; }
  .pd-hidden-note button { border:0; background:none; font:inherit; font-weight:700; color:#128c4a; text-decoration:underline; cursor:pointer; padding:0 2px; }
  #clearAllBtn:disabled { opacity:.6; cursor:wait; }

  @media (max-width:640px) {
    .pd-tools { width:100%; justify-content:space-between; }
    .pd-card { grid-template-columns:auto 1fr; }
    .pd-actions { grid-column:1 / -1; justify-content:stretch; }
    .pd-actions .pd-btn { flex:1; }
    .pd-token { min-width:72px; }
    .pd-token b { font-size:1.45rem; }
  }

  /* ===== v3: gate, app bar, stats, toolbar, modal ===== */
  body { background:#f4f2ea; font-family:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; color:#17181c; }
  button, input, select { font:inherit; }
  .pd-wrap { max-width:980px; margin:0 auto; padding:0 16px; }

  .pd-gate { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; background:radial-gradient(900px 500px at 15% 10%, #fde9e7, transparent 60%), radial-gradient(800px 500px at 90% 90%, #e3eefb, transparent 60%), #f4f2ea; }
  .pd-gate-card { width:100%; max-width:380px; display:flex; flex-direction:column; gap:12px; background:#fff; border:1px solid #e3e0d4; border-radius:24px; padding:30px 26px 26px; box-shadow:0 20px 50px rgba(23,24,28,.12); text-align:center; }
  .pd-gate-card > * { order:1; }
  .pd-gate-logo { order:-2; font-family:"Fraunces", Georgia, serif; font-size:1.7rem; font-weight:600; }
  .pd-gate-logo span, .pd-logo span { color:#c6332e; }
  .pd-gate-lock { order:-1; width:54px; height:54px; margin:0 auto; border-radius:50%; background:#17181c; color:#fff; display:grid; place-items:center; }
  .pd-gate-lock svg { width:24px; height:24px; }
  .pd-gate-intro { order:0; margin:0 0 4px; font-size:.92rem; color:#62625c; }
  .pd-gate-err { order:5; margin:0; min-height:1.2em; font-size:.84rem; color:#c6332e; }
  .pd-field { position:relative; display:block; }
  .pd-field input, .pd-input { width:100%; box-sizing:border-box; border:1.5px solid #ddd9ca; background:#fcfbf7; border-radius:13px; padding:12px 14px; font-size:16px; outline:none; transition:border-color .15s; }
  .pd-field input:focus, .pd-input:focus { border-color:#17181c; background:#fff; }
  .pd-field input { padding-right:62px; }
  .pd-eye { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; color:#62625c; font-size:.78rem; font-weight:600; padding:8px; cursor:pointer; }
  .pd-btn.block { width:100%; padding:12px 14px; font-size:.95rem; border-radius:13px; }

  .pd-bar { position:sticky; top:0; z-index:30; background:rgba(244,242,234,.92); backdrop-filter:blur(10px); border-bottom:1px solid #e3e0d4; }
  .pd-bar-in { display:flex; align-items:center; gap:12px; height:56px; }
  .pd-logo { font-family:"Fraunces", Georgia, serif; font-size:1.3rem; font-weight:600; color:#17181c; text-decoration:none; }
  .pd-live { display:inline-flex; align-items:center; gap:6px; font-size:.72rem; font-weight:600; color:#2f7a4d; background:#e6f3ea; padding:3px 9px; border-radius:999px; }
  .pd-live i { width:7px; height:7px; border-radius:50%; background:#2f7a4d; animation:pdpulse 1.6s infinite; }
  @keyframes pdpulse { 50% { opacity:.3; } }
  .pd-nav { margin-left:auto; display:flex; align-items:center; gap:4px; }
  .pd-link { font-size:.86rem; font-weight:500; color:#17181c; text-decoration:none; padding:7px 10px; border-radius:9px; }
  .pd-link:hover, .pd-icon:hover { background:#ebe8dd; }
  .pd-icon { width:36px; height:36px; border:0; background:transparent; border-radius:10px; display:grid; place-items:center; color:#17181c; cursor:pointer; }
  .pd-icon svg { width:19px; height:19px; }
  .pd-icon.off { color:#a9a79c; }

  .pd-stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin:16px 0 12px; }
  .pd-stat { background:#fff; border:1px solid #e3e0d4; border-radius:16px; padding:11px 14px; }
  .pd-stat small { display:block; font-size:.66rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#62625c; }
  .pd-stat b { display:block; margin-top:2px; font-family:"Fraunces", Georgia, serif; font-size:1.55rem; line-height:1.1; font-weight:600; }
  .pd-stat.wa b { color:#128c4a; } .pd-stat.due b { color:#a56200; } .pd-stat.ok b { color:#2f7a4d; }

  .pd-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  .pd-search { position:relative; flex:1 1 220px; }
  .pd-search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:#8a887d; pointer-events:none; }
  .pd-search input { width:100%; box-sizing:border-box; border:1.5px solid #ddd9ca; background:#fff; border-radius:12px; padding:10px 12px 10px 34px; font-size:16px; outline:none; }
  .pd-search input:focus { border-color:#17181c; }
  .pd-select { border:1.5px solid #ddd9ca; background:#fff; border-radius:12px; padding:9px 12px; font-size:.86rem; font-weight:500; color:#17181c; }
  .pd-seg { display:inline-flex; gap:2px; padding:3px; border-radius:12px; background:#ebe8dd; }
  .pd-seg button { border:0; background:transparent; padding:6px 11px; border-radius:9px; font-size:.8rem; font-weight:500; color:#62625c; cursor:pointer; }
  .pd-seg button.active { background:#fff; color:#17181c; font-weight:600; box-shadow:0 1px 3px rgba(23,24,28,.16); }
  .pd-row2 { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .pd-row2 .grp { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }

  .pd-modal { position:fixed; inset:0; z-index:60; background:rgba(23,24,28,.45); overflow-y:auto; padding:14px; }
  .pd-modal-card { max-width:380px; margin:12vh auto 0; background:#fff; border-radius:20px; padding:22px; display:flex; flex-direction:column; gap:10px; box-shadow:0 20px 50px rgba(23,24,28,.25); }
  .pd-modal-card h3 { margin:0 0 2px; font-family:"Fraunces", Georgia, serif; font-size:1.2rem; }
  .pd-modal-card .hint { margin:0; font-size:.84rem; min-height:1.1em; }
  .pd-modal-card .row { display:flex; gap:8px; }
  .pd-modal-card .row .pd-btn { flex:1; }
  .pd-toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%, 30px); opacity:0; pointer-events:none; background:#17181c; color:#fff; padding:10px 16px; border-radius:12px; font-size:.86rem; font-weight:500; transition:all .25s; z-index:90; max-width:90vw; }
  .pd-toast.show { opacity:1; transform:translate(-50%, 0); }
  #print-frame { position:absolute; width:0; height:0; border:0; }
  .pd-card .pd-actions .pd-btn.ok { color:#1f5a37; border-color:#b5e0c3; background:#f1faf4; }
  @media (max-width:640px) {
    .pd-stats { grid-template-columns:repeat(2, 1fr); }
    .pd-link { display:none; }
  }

  /* ===== login redesign ===== */
  .pd-login { width:100%; max-width:800px; display:grid; grid-template-columns:1fr 1fr; background:#fff; border:1px solid #e3e0d4; border-radius:28px; overflow:hidden; box-shadow:0 24px 60px rgba(23,24,28,.14); }
  .pd-login .pd-gate-card { max-width:none; border:0; box-shadow:none; border-radius:0; justify-content:center; padding:44px 36px; text-align:left; background:#fff; }
  .pd-login .pd-gate-lock { margin:0 0 6px; }
  .pd-login .pd-gate-intro { margin:0; font-size:.88rem; color:#8a4b00; background:#fdf0d9; border-radius:12px; padding:10px 12px; text-align:left; }
  .pd-login .pd-gate-intro:empty { display:none; }
  .pd-login .pd-gate-err { text-align:left; }
  .pd-login-art { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:10px; padding:28px 24px; color:#fff; background:radial-gradient(260px 200px at 30% 20%, rgba(198,51,46,.55), transparent 70%), radial-gradient(240px 200px at 80% 90%, rgba(31,95,168,.5), transparent 70%), #17181c; min-height:340px; }
  .pd-art-logo { align-self:flex-start; font-family:"Fraunces", Georgia, serif; font-size:1.55rem; font-weight:600; }
  .pd-art-logo span { color:#ff6b64; }
  .pd-art-printer { width:100%; max-width:230px; height:auto; filter:drop-shadow(0 14px 22px rgba(0,0,0,.4)); }
  .pd-art-paper { animation:pdfeed 3.2s ease-in-out infinite; }
  @keyframes pdfeed { 0% { transform:translateY(-64px); } 55%, 80% { transform:translateY(0); } 100% { transform:translateY(0); opacity:0; } }
  .pd-led { animation:pdblink 1s steps(2) infinite; }
  .pd-led2 { animation-delay:.5s; }
  @keyframes pdblink { 50% { opacity:.25; } }
  .pd-art-room { align-self:flex-start; font-size:.74rem; font-weight:600; letter-spacing:.06em; padding:5px 11px; border-radius:999px; background:rgba(255,255,255,.12); }
  @media (max-width:700px) {
    .pd-login { grid-template-columns:1fr; max-width:400px; }
    .pd-login-art { min-height:0; padding:18px 20px; flex-direction:row; flex-wrap:wrap; justify-content:space-between; }
    .pd-art-printer { max-width:110px; order:3; }
    .pd-art-room { align-self:center; }
    .pd-login .pd-gate-card { padding:26px 22px; }
  }

  /* ===== v4 redesign: earnings strip, price panel, grouped queue ===== */
  .pd-earn { display:grid; grid-template-columns:minmax(220px,1.1fr) 2fr; gap:10px; margin:16px 0 14px; }
  .pd-earn-main { position:relative; overflow:hidden; border-radius:20px; padding:16px 20px; color:#fff; background:radial-gradient(220px 140px at 90% 0%, rgba(198,51,46,.6), transparent 70%), radial-gradient(200px 140px at 0% 110%, rgba(31,95,168,.45), transparent 70%), #17181c; }
  .pd-earn-main small { display:block; font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; opacity:.7; }
  .pd-earn-main b { display:block; font-family:"Fraunces", Georgia, serif; font-size:2.5rem; line-height:1.05; font-weight:600; margin:4px 0 2px; }
  .pd-earn-main span { font-size:.76rem; opacity:.7; }
  .pd-earn-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .pd-earn-grid > div { background:#fff; border:1px solid #e3e0d4; border-radius:18px; padding:14px 16px; display:flex; flex-direction:column; justify-content:center; }
  .pd-earn-grid small { font-size:.66rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#62625c; }
  .pd-earn-grid b { margin-top:3px; font-family:"Fraunces", Georgia, serif; font-size:1.6rem; line-height:1.1; font-weight:600; }
  .pd-earn-grid .due b { color:#a56200; } .pd-earn-grid .today b { color:#2f7a4d; }

  .pd-group { display:flex; align-items:center; gap:8px; margin:10px 2px 0; font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#62625c; }
  .pd-group:first-child { margin-top:0; }
  .pd-group::after { content:""; flex:1; height:1px; background:#e3e0d4; }
  .pd-group .n { font-size:.7rem; padding:1px 8px; border-radius:999px; background:#ebe8dd; letter-spacing:0; }
  .pd-group.paid { color:#1f5a37; } .pd-group.paid .n { background:#dff1e5; }
  .pd-group.unpaid { color:#8a5200; } .pd-group.unpaid .n { background:#fdf0d9; }

  .pd-card { grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"tk main price" "tk act act"; align-items:start; gap:8px 16px; border-radius:20px; }
  .pd-card > .pd-token { grid-area:tk; align-self:center; }
  .pd-card > .pd-main { grid-area:main; }
  .pd-card > .pd-price { grid-area:price; }
  .pd-card > .pd-actions { grid-area:act; justify-content:flex-start; }
  .pd-card > .pd-body { grid-column:1 / -1; }
  .pd-card.is-paid { border-left:4px solid #3f9a63; }
  .pd-card.is-unpaid { border-left:4px solid #e0a210; }

  .pd-price { min-width:210px; display:flex; flex-direction:column; gap:6px; align-items:stretch; padding:10px 12px; border-radius:14px; background:#faf9f4; border:1px solid #ebe8dd; }
  .pd-price .exp { display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:.74rem; color:#62625c; }
  .pd-price .exp b { font-size:.95rem; color:#17181c; }
  .pd-price .exp.muted b { color:#8a887d; font-weight:500; }
  .pd-set { display:flex; align-items:center; gap:6px; }
  .pd-set .cur { font-weight:600; color:#62625c; }
  .pd-price-in { width:100%; min-width:0; box-sizing:border-box; border:1.5px solid #ddd9ca; background:#fff; border-radius:10px; padding:7px 9px; font-size:16px; font-weight:600; outline:none; }
  .pd-price-in:focus { border-color:#17181c; }
  .pd-price .st { font-size:.72rem; font-weight:600; }
  .pd-price .st.set { color:#1f5a37; } .pd-price .st.est { color:#8a5200; } .pd-price .st.fixed { color:#16507f; }
  .chip.priced { background:#e6f3ea; color:#1f5a37; }
  .chip.partial { background:#fdf0d9; color:#8a5200; }

  @media (max-width:760px) {
    .pd-earn { grid-template-columns:1fr; }
    .pd-card { grid-template-columns:auto minmax(0,1fr); grid-template-areas:"tk main" "price price" "act act"; }
    .pd-price { min-width:0; }
    .pd-card > .pd-actions .pd-btn { flex:1; }
  }
  @media (max-width:520px) { .pd-earn-grid { grid-template-columns:1fr 1fr; } .pd-earn-grid > div:last-child { grid-column:1 / -1; } .pd-earn-main b { font-size:2.1rem; } }
</style>
</head>
<body>

<div id="gate" class="pd-gate">
  <div class="pd-login">
    <aside class="pd-login-art" aria-hidden="true">
      <div class="pd-art-logo">Next<span>Print</span></div>
      <svg class="pd-art-printer" viewBox="0 0 220 170">
        <defs><clipPath id="pdOut"><rect x="0" y="136" width="220" height="40"/></clipPath></defs>
        <g clip-path="url(#pdOut)">
          <g class="pd-art-paper">
            <rect x="70" y="128" width="80" height="62" rx="4" fill="#fff"/>
            <rect x="80" y="142" width="60" height="4" rx="2" fill="#d8d5c8"/>
            <rect x="80" y="152" width="46" height="4" rx="2" fill="#d8d5c8"/>
            <rect x="80" y="162" width="54" height="4" rx="2" fill="#d8d5c8"/>
          </g>
        </g>
        <rect x="26" y="70" width="168" height="70" rx="16" fill="#2c2e36"/>

<script>

const db = firebase.database();

// ---- password hashing (SHA-256, stored in Firebase — never plaintext) ----
async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

const gate = document.getElementById('gate');
const gateCard = document.getElementById('gateCard');
const gateIntro = document.getElementById('gateIntro');
const gateError = document.getElementById('gateError');
const dashboard = document.getElementById('dashboard');

// ---- render either "create password" (first run) or "enter password" ----
function wireEyes(root) {
  root.querySelectorAll('.pd-eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const inp = btn.parentElement.querySelector('input');
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
    });
  });
}

function renderCreatePasswordForm() {
  gateIntro.textContent = 'First time here — create a password for the print desk.';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:10px;';
  wrap.innerHTML = `
    <label class="pd-field"><input type="password" id="newPw" placeholder="Create a password" autocomplete="new-password"><button type="button" class="pd-eye">Show</button></label>
    <label class="pd-field"><input type="password" id="confirmPw" placeholder="Confirm password" autocomplete="new-password"><button type="button" class="pd-eye">Show</button></label>
    <button class="pd-btn primary block" id="createBtn">Create password &amp; unlock</button>
  `;
  gateCard.appendChild(wrap);
  wireEyes(wrap);

  document.getElementById('createBtn').addEventListener('click', async () => {
    const pw = document.getElementById('newPw').value;
    const confirm = document.getElementById('confirmPw').value;
    gateError.textContent = '';
    if (!pw || pw.length < 4) {
      gateError.textContent = 'Password must be at least 4 characters.';
      return;
    }
    if (pw !== confirm) {
      gateError.textContent = 'Passwords do not match.';
      return;
    }
    const hash = await sha256Hex(pw);
    db.ref('adminAuth/passwordHash').set(hash)
      .then(() => unlock())
      .catch(() => { gateError.textContent = 'Could not save password. Try again.'; });
  });
}

function renderLoginForm() {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:10px;';
  wrap.innerHTML = `
    <label class="pd-field"><input type="password" id="passcodeInput" placeholder="Password" autocomplete="current-password" autofocus><button type="button" class="pd-eye">Show</button></label>
    <button class="pd-btn primary block" id="unlockBtn">Unlock desk</button>
  `;
  gateCard.appendChild(wrap);
  wireEyes(wrap);

  const passcodeInput = document.getElementById('passcodeInput');

  async function tryUnlock() {
    gateError.textContent = '';
    try {
      const entered = passcodeInput.value;
      const hash = await sha256Hex(entered);
      const snap = await db.ref('adminAuth/passwordHash').once('value');
      if (hash === snap.val()) {
        unlock();
      } else {
        gateError.textContent = 'Incorrect password.';
      }
    } catch (err) {
      gateError.textContent = 'Could not reach the database (' + (err.message || err) + '). Check your Firebase rules.';
    }
  }
  document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
  passcodeInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
}

// ---- single-session enforcement: only one device may be logged in at a
// time. Logging in writes a fresh session id to Firebase; any other
// device watching that path sees the mismatch and is logged out. ----
function makeSessionId() {
  return (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2)));
}

// remove any form elements appended to the gate card so we can render
// a fresh login form on top of the original logo/intro/error nodes
function resetGateCard() {
  while (gateCard.children.length > 2) {
    gateCard.removeChild(gateCard.lastChild);
  }
  gateError.textContent = '';
}

let sessionWatcherStarted = false;
function watchSession() {
  if (sessionWatcherStarted) return;
  sessionWatcherStarted = true;
  db.ref('adminAuth/activeSession').on('value', snap => {
    const active = snap.val();
    const mine = localStorage.getItem('np_session_id');
    if (dashboard.style.display !== 'none' && mine && active !== mine) {
      // another device has logged in — kick this one out
      localStorage.removeItem('np_session_id');
      sessionStorage.removeItem('np_admin_ok');
      dashboard.style.display = 'none';
      gate.style.display = 'flex';
      resetGateCard();
      gateIntro.textContent = "You've been logged out because this account was signed in on another device.";
      renderLoginForm();
    }
  });
}

function unlock() {
  const sid = makeSessionId();
  localStorage.setItem('np_session_id', sid);
  sessionStorage.setItem('np_admin_ok', '1');
  db.ref('adminAuth/activeSession').set(sid);
  gate.style.display = 'none';
  dashboard.style.display = 'block';
  startDashboard();
  watchSession();
}

// ---- decide which gate form to show ----
(async function initGate() {
  if (sessionStorage.getItem('np_admin_ok') === '1') {
    try {
      const activeSnap = await db.ref('adminAuth/activeSession').once('value');
      const mine = localStorage.getItem('np_session_id');
      if (mine && activeSnap.val() === mine) {
        gate.style.display = 'none';
        dashboard.style.display = 'block';
        startDashboard();
        watchSession();
        return;
      }
      // session was taken over by another device while we were away
      sessionStorage.removeItem('np_admin_ok');
      localStorage.removeItem('np_session_id');
    } catch (err) {
      // fall through to normal login if we can't verify the session
    }
  }
  try {
    const snap = await db.ref('adminAuth/passwordHash').once('value');
    if (snap.exists()) {
      renderLoginForm();
    } else {
      renderCreatePasswordForm();
    }
  } catch (err) {
    gateError.textContent = 'Could not reach the database (' + (err.message || err) + '). Check that your Firebase Realtime Database rules allow read/write on the "adminAuth" path.';
  }
})();

// ---- change password (from inside the dashboard) ----
const showChangePw = document.getElementById('showChangePw');

showChangePw.addEventListener('click', () => {

document.getElementById('cpSave').addEventListener('click', async () => {
  cpError.textContent = '';
  cpSuccess.textContent = '';
  const current = document.getElementById('cpCurrent').value;
  const next = document.getElementById('cpNew').value;
  const confirm = document.getElementById('cpConfirm').value;

  if (!next || next.length < 4) {
    cpError.textContent = 'New password must be at least 4 characters.';
    return;
  }
  if (next !== confirm) {
    cpError.textContent = 'New passwords do not match.';
    return;
  }

  let snap;
  try {
    const currentHash = await sha256Hex(current);
    snap = await db.ref('adminAuth/passwordHash').once('value');
    if (currentHash !== snap.val()) {
      cpError.textContent = 'Current password is incorrect.';
      return;
    }
  } catch (err) {
    cpError.textContent = 'Could not reach the database (' + (err.message || err) + '). Check your Firebase rules.';

  db.ref('adminAuth/passwordHash').set(newHash)
    .then(() => {
      cpSuccess.textContent = 'Password updated.';
      document.getElementById('cpCurrent').value = '';
      document.getElementById('cpNew').value = '';
      document.getElementById('cpConfirm').value = '';
    })

});

// ---- payment helpers ----
function paidOf(r) {
  if (r.paymentStatus === 'paid') return r.paidAmount != null ? Number(r.paidAmount) || 0 : Number(r.amount) || 0;
  return Number(r.paidAmount) || 0;
}
function isPaid(r) { return r.paymentStatus === 'paid'; }
function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

// ---- earnings ledger -------------------------------------------------
// Money received is added to earnings/total (and earnings/days/<day>) and the
// request remembers how much of it is already counted in earnedAmount. That
// way "Clear tokens", "Printed" and "Cancel" can delete requests without ever
// touching what has been earned, and nothing is counted twice.
let earn = { total: 0, days: {} };
const bankedLocal = {};      // request id -> amount already counted (instant, before Firebase echoes it)
let banking = Promise.resolve(true);
function unbanked(r) { return Math.max(0, paidOf(r) - Math.max(Number(r.earnedAmount) || 0, bankedLocal[r.id] || 0)); }

function bankEarnings(list) {
  banking = banking.then(async () => {
    const rows = (list || allRequests).map(r => ({ r, d: unbanked(r) })).filter(x => x.d > 0);
    if (!rows.length) return true;
    const sum = rows.reduce((t, x) => t + x.d, 0);
    const days = {};
    rows.forEach(x => { const k = dayKey(new Date(x.r.paidAt || Date.now())); days[k] = (days[k] || 0) + x.d; });
    const prev = {};
    rows.forEach(x => { prev[x.r.id] = bankedLocal[x.r.id]; bankedLocal[x.r.id] = paidOf(x.r); });
    try {
      await db.ref('earnings/total').transaction(c => (Number(c) || 0) + sum);
      for (const k of Object.keys(days)) await db.ref('earnings/days/' + k).transaction(c => (Number(c) || 0) + days[k]);
      const upd = {};
      rows.forEach(x => { upd['printRequests/' + x.r.id + '/earnedAmount'] = paidOf(x.r); });
      await db.ref().update(upd);
      return true;
    } catch (err) {
      rows.forEach(x => { if (prev[x.r.id] === undefined) delete bankedLocal[x.r.id]; else bankedLocal[x.r.id] = prev[x.r.id]; });
      console.error('earnings', err);
      return false;
    }
  });
  return banking;
}
// every deletion goes through this: earnings are saved first, and if that
// fails nothing is deleted
async function bankOrWarn() {
  const ok = await bankEarnings(allRequests);
  if (!ok) alert('Could not save the earnings to Firebase, so nothing was deleted. Check that your database rules allow read/write on the "earnings" path.');
  return ok;
}

function matchesStatus(r) { return currentFilter === 'all' || (r.status || 'pending') === currentFilter; }
function matchesSearch(r) {
  if (!searchQ) return true;
  const hay = [r.token, r.notes, ...(r.files || []).map(f => f.name), ...(r.items || []).map(i => i.name)].join(' ').toLowerCase();
  return hay.includes(searchQ);
}
function matchesPay(r) {
  if (payFilter === 'any') return true;

// what the desk currently shows: tab + WhatsApp switch + search + payment filter
function visibleRequests() {
  return allRequests.filter(r => matchesStatus(r) && matchesSearch(r) && matchesPay(r) && (showWA || r.source !== 'whatsapp'));
}

function timeAgo(ts) {
  if (!ts) return '—';
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' hr ago';
  return Math.floor(h / 24) + ' d ago';
}

function toast(msg) {
  const t = document.getElementById('pdToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * 0.17;
      o.frequency.value = f; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.14, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
      o.start(t0); o.stop(t0 + 0.17);
    });
  } catch (e) {}
}

// chime + toast when a brand-new pending request arrives (not on first load)
function notifyNew(list) {
  const ids = new Set(list.map(r => r.id));
  if (knownIds) {
    const fresh = list.filter(r => !knownIds.has(r.id) && (r.status || 'pending') === 'pending');
    if (fresh.length) {
      if (soundOn) beep();
      toast('New request · token ' + fresh.map(r => r.token || '—').join(', '));
    }
  }
  knownIds = ids;
}

window.markPaid = async function (id) {
  const req = allRequests.find(r => r.id === id);
  if (!req) return;
  const bal = Math.max(0, (Number(req.amount) || 0) - paidOf(req));
  if (!confirm('Token ' + (req.token || '') + ': received ₹' + bal + ' at the counter?')) return;
  try {
    await db.ref('printRequests/' + id).update({
      paymentStatus: 'paid', paidAmount: Number(req.amount) || 0, paymentMethod: 'counter',
      paidAt: firebase.database.ServerValue.TIMESTAMP,
    });
    toast('Token ' + (req.token || '') + ' marked paid');
  } catch (err) { alert('Could not update: ' + (err.message || err)); }
};

// ---- the desk sets the price for a token. It is written to the request, so
// token.html (watching it live) shows it straight away and the customer only
// pays this amount. ----
window.savePrice = async function (id) {
  const req = allRequests.find(r => r.id === id);
  const inp = document.getElementById('pr-' + id);
  if (!req || !inp) return;
  const n = Math.round(Number(inp.value));
  if (inp.value === '' || !isFinite(n) || n < 0) { toast('Enter a valid price'); inp.focus(); return; }
  const paid = paidOf(req);
  if (paid > n && !confirm('Token ' + (req.token || '') + ' has already paid ₹' + paid + ', which is more than ₹' + n + '. Set it anyway?')) return;
  try {
    await db.ref('printRequests/' + id).update({
      amount: n, priceSet: true, priceSetAt: firebase.database.ServerValue.TIMESTAMP,
      paidAmount: paid, paymentStatus: (n > 0 && paid >= n) ? 'paid' : 'unpaid',
    });
    toast('Token ' + (req.token || '') + ' price set to ₹' + n);
    inp.blur();
  } catch (err) { alert('Could not update: ' + (err.message || err)); }
};
window.copyTokenLink = async function (id) {

function startDashboard() {
  if (dbStarted) return;
  dbStarted = true;

  db.ref('printRequests').on('value', snapshot => {
    const data = snapshot.val() || {};
    allRequests = Object.entries(data)
      .map(([id, val]) => ({ id, ...val }))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    notifyNew(allRequests);
    render();
    bankEarnings(allRequests);
  });
  db.ref('earnings').on('value', snap => { earn = Object.assign({ total: 0, days: {} }, snap.val() || {}); render(); });

  document.getElementById('waToggle').addEventListener('click', () => window.toggleWA());

  document.querySelectorAll('.pd-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.pd-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      render();
    });
  });

  // ---- remove a file from Cloudinary.
  // Preferred path: call our deleteCloudinaryFile Cloud Function, which
  // holds the Cloudinary API secret server-side and deletes by the file's
  // permanent public ID. That works no matter how long ago it was
  // uploaded — see /functions and DEPLOY.md to set it up.
  // Fallback: the old unsigned delete-token method, kept only for
  // requests saved before the function existed. Cloudinary invalidates
  // that token ~10 minutes after upload, so it will usually fail for
  // anything older — that's expected, not a bug. ----
  async function deleteCloudinaryFile(file) {
    if (file.publicId && CONFIG.cloudinary.deleteFunctionUrl) {
      try {
        const res = await fetch(CONFIG.cloudinary.deleteFunctionUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            publicId: file.publicId,
            resourceType: file.resourceType || 'image',
          }),
        });
        const data = await res.json();
        if (data.ok) return true;
      } catch (err) {
        // fall through to the legacy method below
      }
    }

    if (!file.deleteToken) return false;
    try {
      const resourceType = file.resourceType || 'image';
      const url = `https://api.cloudinary.com/v1_1/${CONFIG.cloudinary.cloudName}/${resourceType}/destroy`;
      const body = new FormData();
      body.append('token', file.deleteToken);
      const res = await fetch(url, { method: 'POST', body });
      const data = await res.json();
      return data.result === 'ok';
    } catch (err) {
      return false;
    }
  }

  window.markPrinted = async function (id) {
    const req = allRequests.find(r => r.id === id);
    if (!req) return;

    if (!confirm((req.source === 'store' || req.source === 'notebook')
      ? `Mark store order (token ${req.token || ''}) as handed over?\n\nThis will remove it from the list.`
      : `Mark "${req.name || ('token ' + (req.token || ''))}" as printed?\n\nThis will permanently delete the request and its files.`)) {
      return;
    }

    if (!(await bankOrWarn())) return;
    const files = req.files || [];
    const failed = [];
    for (const f of files) {
      const ok = await deleteCloudinaryFile(f);
      if (!ok) failed.push(f.name);
    }

    await db.ref('printRequests/' + id).remove();

    if (failed.length) {
      alert('Request deleted. Note: these files could not be auto-removed from Cloudinary (delete link may have expired) — clear them manually if needed:\n' + failed.join('\n'));
    }
  };

  // ---- clear every request currently shown in the active tab: removes
  // their files from Cloudinary, then deletes the records in one go ----
  window.clearAll = async function () {
    const visible = visibleRequests(); // hidden WhatsApp requests are never cleared
    if (!visible.length) return;

    const label = currentFilter === 'all' ? '' : currentFilter + ' ';
    if (!confirm(`Clear ${visible.length} ${label}token${visible.length === 1 ? '' : 's'}?\n\nThis deletes the tokens and their files. Your earnings are kept.`)) {
      return;
    }
    if (!(await bankOrWarn())) return;

    const btn = document.getElementById('clearAllBtn');
    btn.disabled = true;
    const failed = [];
    try {
      let done = 0;
      for (const req of visible) {
        btn.textContent = `Clearing ${++done}/${visible.length}…`;
        for (const f of (req.files || [])) {
          const ok = await deleteCloudinaryFile(f);
          if (!ok) failed.push(f.name);
        }
      }
      const updates = {};
      visible.forEach(r => { updates['printRequests/' + r.id] = null; });
      await db.ref().update(updates);
    } catch (err) {
      alert('Could not clear all requests: ' + (err.message || err));
    } finally {
      btn.disabled = false;
      btn.textContent = 'Clear tokens';
      render();
    }

    if (failed.length) {
      alert('Tokens cleared. Note: these files could not be auto-removed from Cloudinary (delete link may have expired) — clear them manually if needed:\n' + failed.join('\n'));
    }
  };

  // put cancelled store items back into stock (skips products that were deleted)
  async function restoreStock(items) {
    for (const i of (items || [])) {
      const pid = i.id || i.productId;
      if (!pid) continue;
      try {
        const ex = await db.ref('store/products/' + pid + '/name').once('value');
        if (!ex.exists()) continue;
        await db.ref('store/products/' + pid + '/stock').transaction(c => (Number(c) || 0) + (Number(i.qty) || 0));
      } catch (e) { console.error(e); }
    }
  }

  window.cancelRequest = async function (id) {
    const req = allRequests.find(r => r.id === id);
    if (!req) return;

    if (!confirm(`Cancel "${req.name || ('token ' + (req.token || ''))}"?\n\nThis will permanently delete the request and its files.`)) {
      return;
    }

    if (!(await bankOrWarn())) return;
    const files = req.files || [];
    const failed = [];
    for (const f of files) {
      const ok = await deleteCloudinaryFile(f);
      if (!ok) failed.push(f.name);
    }

    if (req.source === 'store' || req.source === 'notebook') await restoreStock(req.items);
    await db.ref('printRequests/' + id).remove();

    if (failed.length) {
      alert('Request cancelled. Note: these files could not be auto-removed from Cloudinary (delete link may have expired) — clear them manually if needed:\n' + failed.join('\n'));
    }
  };
}

function updateToolbar() {
  const pool = allRequests.filter(r => showWA || r.source !== 'whatsapp');
  document.getElementById('cnt-pending').textContent = pool.filter(r => (r.status || 'pending') === 'pending').length;
  document.getElementById('cnt-printed').textContent = pool.filter(r => r.status === 'printed').length;
  document.getElementById('cnt-all').textContent = pool.length;
  const sw = document.getElementById('waToggle');
  sw.setAttribute('aria-checked', String(showWA));
  document.getElementById('waCount').textContent = allRequests.filter(r => r.source === 'whatsapp' && matchesStatus(r)).length;
  document.getElementById('waLabel').textContent = showWA ? 'WhatsApp shown' : 'WhatsApp hidden';

  const pend = pool.filter(r => (r.status || 'pending') === 'pending');
  const sumDue = pend.reduce((t, r) => t + Math.max(0, (Number(r.amount) || 0) - paidOf(r)), 0);
  const pendingBank = allRequests.reduce((t, r) => t + unbanked(r), 0);   // paid but not yet folded into the ledger
  const today = (earn.days && earn.days[dayKey(new Date())]) || 0;
  document.getElementById('st-earn').textContent = '₹' + ((Number(earn.total) || 0) + pendingBank).toLocaleString('en-IN');
  document.getElementById('st-today').textContent = '₹' + ((Number(today) || 0) + pendingBank).toLocaleString('en-IN');
  document.getElementById('st-due').textContent = '₹' + sumDue.toLocaleString('en-IN');
  document.getElementById('st-pending').textContent = pend.length;
  document.title = (pend.length ? '(' + pend.length + ') ' : '') + 'Print desk — NextPrint';
  document.getElementById('soundToggle').classList.toggle('off', !soundOn);
}

let renderLater = false;
function priceFocused() { const a = document.activeElement; return !!(a && a.classList && a.classList.contains('pd-price-in')); }
document.addEventListener('focusout', e => {
  if (e.target && e.target.classList && e.target.classList.contains('pd-price-in')) {
    setTimeout(() => { if (renderLater && !priceFocused()) { renderLater = false; render(); } }, 300);
  }
});
function render() {
  if (priceFocused()) { renderLater = true; updateToolbar(); return; }
  const listEl = document.getElementById('requestList');
  updateToolbar();
  const filtered = visibleRequests();
  const hiddenWA = showWA ? 0 : allRequests.filter(r => r.source === 'whatsapp' && matchesStatus(r)).length;

  const clearBtn = document.getElementById('clearAllBtn');
  if (clearBtn && !clearBtn.disabled) clearBtn.style.display = filtered.length ? '' : 'none';

  const hiddenNote = hiddenWA
    ? `<div class="pd-hidden-note">${hiddenWA} WhatsApp request${hiddenWA === 1 ? '' : 's'} hidden · <button type="button" onclick="toggleWA()">Show</button></div>`
    : '';

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="pd-empty">No ${currentFilter === 'all' ? '' : currentFilter + ' '}requests right now.</div>${hiddenNote}`;
    return;
  }

  const byNew = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
  const sorted = filtered.slice().sort((a, b) => {
    if (sortMode === 'new') return byNew(a, b);
    if (sortMode === 'old') return -byNew(a, b);
    if (sortMode === 'amt') return (Number(b.amount) || 0) - (Number(a.amount) || 0) || byNew(a, b);
    // default: paid tokens first, newest first inside each group
    return (isPaid(b) ? 1 : 0) - (isPaid(a) ? 1 : 0) || byNew(a, b);
  });

  if (sortMode === 'paid') {
    const paidList = sorted.filter(isPaid), openList = sorted.filter(r => !isPaid(r));
    listEl.innerHTML =
      (paidList.length ? `<h3 class="pd-group paid">Paid <span class="n">${paidList.length}</span></h3>` + paidList.map(renderCard).join('') : '') +
      (openList.length ? `<h3 class="pd-group unpaid">Awaiting payment <span class="n">${openList.length}</span></h3>` + openList.map(renderCard).join('') : '') +
      hiddenNote;
  } else {
    listEl.innerHTML = sorted.map(r => renderCard(r)).join('') + hiddenNote;
  }
}

function printTypeLabel(t) {
  if (t === 'color') return 'Colour';
  if (t === 'photo') return 'Photo paper';
  return 'B&amp;W';
}

function renderCard(r) {
  const status = r.status || 'pending';
  const files = r.files || [];
  const isWA = r.source === 'whatsapp';
  const paper = r.paper && Number(r.paper.qty) > 0 ? r.paper : null;
  const paperOnly = !!paper && !files.length && !r.source;
  const isNB = r.source === 'store' || r.source === 'notebook' || paperOnly;
  const items = paperOnly ? [{ name: 'A4 paper', qty: paper.qty, price: paper.price, total: paper.total }] : (r.items || []);
  const itemCount = items.reduce((t, i) => t + (Number(i.qty) || 0), 0);
  const expanded = expandedIds.has(r.id);
  const hasPhotoPaper = files.some(f => f.printType === 'photo');
  const pdfCount = files.filter(f => (f.format || '').toLowerCase() === 'pdf').length;
  const paid = r.paymentStatus === 'paid';
  const amt = Number(r.amount) || 0;
  const paidSoFar = paidOf(r);
  const balance = Math.max(0, amt - paidSoFar);
  const partial = !paid && paidSoFar > 0;
  const priceSet = !!r.priceSet;
  const expected = r.estimatedAmount != null ? Number(r.estimatedAmount) || 0 : (priceSet ? null : amt);

  const chips = [
    isWA ? `<span class="chip wa">${WA_ICON}WhatsApp</span>` : '',
    isNB ? `<span class="chip nb">${paperOnly ? '📄 A4 paper' : '🛍 Store'}</span>` : '',
    (isNB && (r.stockShort || []).length) ? '<span class="chip topay">⚠ Check stock</span>' : '',
    (!isWA || amt > 0) ? (paid ? '<span class="chip paid">Paid</span>' : partial ? `<span class="chip partial">₹${paidSoFar} paid · ₹${balance} left</span>` : '<span class="chip topay">To pay</span>') : '',
    (!isNB && priceSet) ? '<span class="chip priced">Price set</span>' : '',
    hasPhotoPaper ? '<span class="chip glossy">Glossy</span>' : '',
    status === 'printed' ? '<span class="chip printed">printed</span>' : '',
  ].join('');

  const shown = files.slice(0, 2).map(f => escapeHtml(f.name)).join(', ');
  const more = files.length > 2 ? ` <span class="more">+${files.length - 2} more</span>` : '';
  const itemsText = items.map(i => (Number(i.qty) || 0) + ' × ' + escapeHtml(i.name)).join(', ');
  const paperTag = (paper && !paperOnly) ? ` <span class="more">+ ${Number(paper.qty)} × A4 paper</span>` : '';
  const filesLine = isNB
    ? `<div class="pd-files" title="${escapeAttr(items.map(i => i.qty + ' × ' + i.name).join(', '))}">${itemsText}</div>`
    : isWA
    ? `<div class="pd-files wa">${WA_ICON}Files sent on WhatsApp</div>`
    : `<div class="pd-files" title="${escapeAttr(files.map(f => f.name).join(', '))}">${shown}${more}${paperTag}</div>`;

  const when = `<span title="${escapeAttr(formatDateTime(r.createdAt).replace('<br>', ' · '))}">${timeAgo(r.createdAt)}</span>`;
  const metaLine = isNB
    ? `<div class="pd-meta"><b>₹${r.amount || 0}</b> ${paid ? 'paid' : 'to pay'} · ${itemCount} item${itemCount === 1 ? '' : 's'} · ${when}</div>`
    : isWA
    ? `<div class="pd-meta">${(r.amount || 0) > 0 ? '<b>₹' + r.amount + '</b> ' + (paid ? 'paid' : 'to pay') + ' · ' : 'Amount not set · '}${when}</div>`
    : `<div class="pd-meta"><b>₹${r.amount || 0}</b> ${paid ? 'paid' : 'to pay'} · ${files.length} file${files.length === 1 ? '' : 's'} · ${when}</div>`;

  const filesHtml = files.map((f) => {
    const printable = isPrintable(f);
    const actionBtn = printable
      ? `<button type="button" class="pd-btn sm" onclick="printFile('${escapeAttr(f.url)}')">Open &amp; print</button>`
      : `<a class="pd-btn sm" href="${escapeAttr(f.url)}" target="_blank" rel="noopener">Download</a>`;
    const pagesLabel = f.pageMode === 'custom' ? `pages ${escapeHtml(f.pages || '')}` : 'all pages';
    return `
      <div class="pd-file">
        <span>${escapeHtml(f.name)} — ${printTypeLabel(f.printType)}, ${pagesLabel}, ${f.copies || 1}× copies</span>
        ${actionBtn}
      </div>`;
  }).join('');

  const bodyHtml = expanded ? `
      <div class="pd-body">
        <div class="pd-spec">
          ${isNB ? `<span><b>${itemCount}</b> item${itemCount === 1 ? '' : 's'}</span><span><b>₹${r.amount || 0}</b> ${paid ? 'paid' : 'to pay'}</span>${r.paymentId ? `<span>Payment ID: ${escapeHtml(r.paymentId)}</span>` : ''}${(r.stockShort || []).map(x => `<span>⚠ ${escapeHtml(x.name)}: ordered ${x.wanted}, only ${x.had} were in stock</span>`).join('')}`
          : isWA ? '<span><b>WhatsApp</b> request — the customer sends files in chat</span>'
                 : `<span><b>${files.length}</b> file${files.length === 1 ? '' : 's'}</span>${paper ? `<span><b>${Number(paper.qty)}</b> × A4 paper (₹${Number(paper.total) || 0})</span>` : ''}<span><b>₹${r.amount || 0}</b> ${priceSet ? 'final price' : 'estimated'}</span>`}
        </div>
        ${r.notes && !isWA ? `<p class="pd-note">Note: ${escapeHtml(r.notes)}</p>` : ''}
        ${isNB ? items.map(i => `<div class="pd-file"><span>${Number(i.qty) || 0} × ${escapeHtml(i.name)} — ₹${i.total != null ? i.total : (Number(i.qty) || 0) * (Number(i.price) || 0)}</span></div>`).join('') : filesHtml}
        <div class="pd-body-actions">
          ${pdfCount > 0 ? `<button type="button" class="pd-btn sm" onclick="mergeAndPrint('${r.id}')">Merge &amp; print all (${pdfCount} PDF${pdfCount === 1 ? '' : 's'})</button>` : ''}
          ${status !== 'printed' ? `<button type="button" class="pd-btn sm primary" onclick="markPrinted('${r.id}')">${isNB ? 'Mark as handed over' : 'Mark as printed'}</button>` : ''}
        </div>
      </div>` : '';

  const priceHtml = isNB
    ? `<div class="pd-price"><div class="exp"><span>Order total</span><b>₹${amt}</b></div><div class="st fixed">${paid ? '✓ Paid online' : 'Fixed store price'}</div></div>`
    : `<div class="pd-price">
         <div class="exp ${expected == null || expected <= 0 ? 'muted' : ''}"><span>Expected</span><b>${expected != null && expected > 0 ? '₹' + expected : '—'}</b></div>
         ${status !== 'printed' ? `<div class="pd-set"><span class="cur">₹</span><input class="pd-price-in" id="pr-${r.id}" type="number" inputmode="numeric" min="0" step="1" placeholder="Set price" value="${amt > 0 ? amt : ''}" onkeydown="if(event.key==='Enter'){savePrice('${r.id}')}"><button type="button" class="pd-btn sm primary" onclick="savePrice('${r.id}')">${priceSet ? 'Update' : 'Set'}</button></div>` : ''}
         <div class="st ${priceSet ? 'set' : 'est'}">${priceSet ? '✓ Customer pays ₹' + amt : amt > 0 ? 'Customer sees the estimate' : 'Customer is waiting for a price'}</div>
       </div>`;

  return `
    <article class="pd-card ${paid ? 'is-paid' : 'is-unpaid'}${isWA ? ' wa' : isNB ? ' nb' : ''}" id="card-${r.id}">
      <div class="pd-token"><small>Token</small><b>${escapeHtml(String(r.token || '—'))}</b></div>
      <div class="pd-main">
        <div class="pd-chips">${chips}</div>
        ${filesLine}
        ${metaLine}
      </div>
      ${priceHtml}
      <div class="pd-actions">
        ${isNB ? (status !== 'printed' ? `<button type="button" class="pd-btn primary" onclick="markPrinted('${r.id}')">Handed over</button>` : '') : `<button type="button" class="pd-btn ${isWA ? 'wa' : 'primary'}" onclick="mergeAndPrint('${r.id}')">Print</button>`}
        ${status !== 'printed' && !paid && amt > 0 ? `<button type="button" class="pd-btn ok" onclick="markPaid('${r.id}')">${partial ? 'Got ₹' + balance : 'Got ₹' + amt}</button>` : ''}
        ${!isNB && r.tokenHash ? `<button type="button" class="pd-btn" onclick="copyTokenLink('${r.id}')" title="Copy the customer's private token link">Link</button>` : ''}
        <button type="button" class="pd-btn" onclick="toggleDetails('${r.id}')">${expanded ? 'Hide' : 'Details'}</button>
        <button type="button" class="pd-btn danger" onclick="cancelRequest('${r.id}')">Cancel</button>
      </div>
      ${bodyHtml}
    </article>`;
}

// ---- toggle the details panel for one request, open below its tile ----
window.toggleDetails = function (id) {
  if (expandedIds.has(id)) {
    expandedIds.delete(id);
  } else {
    expandedIds.add(id);
  }
  render();
};

// ---- format a request's created-at timestamp for display ----
function formatDateTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const datePart = d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
  const timePart = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  return `${datePart}<br>${timePart}`;
}

function isPrintable(file) {
  const fmt = (file.format || '').toLowerCase();
  const type = (file.resourceType || '').toLowerCase();
  return type === 'image' || fmt === 'pdf';
}

window.printFile = function (url) {
  const frame = document.getElementById('print-frame');
  frame.onload = () => {
    try {
      frame.contentWindow.focus();
      frame.contentWindow.print();
    } catch (err) {
      window.open(url, '_blank');
    }
  };
  frame.src = url;
};

// ---- merge every PDF belonging to one request into a single PDF and
// send it straight to the print dialog ----
window.mergeAndPrint = async function (requestId) {
  const req = allRequests.find(r => r.id === requestId);
  if (!req) return;

  // WhatsApp requests have no uploaded files — the customer sends them in chat
  if (req.source === 'whatsapp') {
    window.open('https://web.whatsapp.com/', '_blank', 'noopener');
    return;
  }

  const files = req.files || [];
  const pdfFiles = files.filter(f => (f.format || '').toLowerCase() === 'pdf');
  const otherFiles = files.filter(f => (f.format || '').toLowerCase() !== 'pdf');

  if (pdfFiles.length === 0) {
    alert('No PDF files to merge for this request.');
    return;
  }

  try {
    const merged = await PDFLib.PDFDocument.create();
    for (const f of pdfFiles) {
      const res = await fetch(f.url);
      const bytes = await res.arrayBuffer();
      const src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
      const copies = f.copies || 1;
      const indices = src.getPageIndices();
      for (let c = 0; c < copies; c++) {
        const pages = await merged.copyPages(src, indices);
        pages.forEach(p => merged.addPage(p));
      }
    }
    const mergedBytes = await merged.save();
    const blob = new Blob([mergedBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);

    if (otherFiles.length) {
      alert('Note: ' + otherFiles.map(f => f.name).join(', ') + ' could not be merged (not a PDF) — print those separately using their own "Download" button.');
    }
    printFile(url);
  } catch (err) {
    alert('Could not merge files: ' + (err.message || err));
  }
};

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(str) { return escapeHtml(str); }
</script>
