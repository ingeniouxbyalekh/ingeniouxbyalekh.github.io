<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Data Lab — INGENIOUX</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<!--
  INGENIOUX · AI Data Lab  (/AI/)
  ---------------------------------------------------------------
  Standalone, password-protected analytics dashboard for the data written by
  /datalake.js (site root) into Cloud Firestore, project "ingenioux-ai"
  (collections ai_events, ai_sessions, ai_db_mutations, ai_db_reads).
  The dashboard only READS those collections.

  Admin login uses Firebase REALTIME DATABASE only (same project):
      ai_config/access   passwordHash + salt + iterations (PBKDF2-SHA256, created
                         by this page on first visit) -- or a plain "password"
                         child you may type by hand in the Firebase console
      ai_config/session  single-device login marker { sid, dev, loginAt, lastSeen }
  First visit with no ai_config/access => the page asks you to create the password.

  Rules: firestore.rules  -> Firebase Console > Firestore > Rules
         database.rules.json -> Firebase Console > Realtime Database > Rules
  NOTE: the password gate is checked in the browser. Anyone who can read your
  database with the public web API key can read the same data, so treat this as
  a convenience lock, not hard security (use Firebase Auth + rules for that).
-->

<link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>

<!-- ======================= LOCK SCREEN ======================= -->
<div id="lock">
  <div class="lock-card">
    <div class="mark">AI</div>
    <h1 id="lock-title">AI Data Lab</h1>
    <p id="lock-sub">Checking access settings…</p>
    <form id="lock-form" class="hidden" autocomplete="off">
      <div class="field"><label for="pw1" id="pw1-l">Password</label><input id="pw1" class="input" type="password" autocomplete="current-password" required /></div>
      <div class="field hidden" id="pw2-wrap"><label for="pw2">Confirm password</label><input id="pw2" class="input" type="password" autocomplete="new-password" /></div>
      <button class="btn" id="lock-btn" style="width:100%" type="submit">Unlock</button>
    </form>
    <div class="msg" id="lock-msg"></div>
    <div class="hint" id="lock-hint"></div>
  </div>
</div>

<!-- ======================= APP ======================= -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-row">
      <span class="brand">INGENIOUX<small>/ ai data lab</small></span>
      <button class="btn ghost sm" id="btn-more" type="button" aria-expanded="false" aria-controls="app" title="Show filters &amp; actions" aria-label="Show filters and actions"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></button>
      <span class="pill" id="p-status">not loaded</span>
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" id="autorefresh" /> auto-refresh 60s</label>
      <button class="btn ghost sm" id="btn-reload">↻ Reload data</button>
      <button class="btn ghost sm" id="btn-theme" title="Toggle theme">Theme</button>
      <button class="btn ghost sm" id="btn-lock">Lock</button>
    </div>
    <div class="filters">
      <select class="select" id="f-range" title="Time range">
        <option value="1">Last 24 hours</option><option value="7" selected>Last 7 days</option><option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option><option value="0">All time</option><option value="custom">Custom…</option>
      </select>
      <span id="f-custom" class="hidden" style="display:flex;gap:6px"><input type="date" class="input" id="f-from" /><input type="date" class="input" id="f-to" /></span>
      <select class="select" id="f-cap" title="Max documents per collection (each costs a Firestore read)">
        <option value="2000">≤ 2k docs</option><option value="5000" selected>≤ 5k docs</option><option value="10000">≤ 10k docs</option><option value="25000">≤ 25k docs</option><option value="50000">≤ 50k docs</option>
      </select>
      <label class="chk" title="Also load Realtime-DB write/read logs"><input type="checkbox" id="f-db" checked /> DB logs</label>
      <span style="width:1px;height:22px;background:var(--border)"></span>
      <select class="select" id="f-area" title="Site area"><option value="">All areas</option><option value="home">Home</option><option value="projects">Projects</option><option value="disclosure">Disclosure</option><option value="blogs">Blogs</option><option value="store">Store</option></select>
      <select class="select" id="f-dev" title="Device type"><option value="">All devices</option><option value="Mobile">Mobile</option><option value="Desktop">Desktop</option><option value="Tablet">Tablet</option></select>
      <select class="select" id="f-aud"><option value="">Everyone</option><option value="in">Logged-in only</option><option value="anon">Anonymous only</option></select>
      <input class="input" type="search" id="f-user" placeholder="Filter user / email…" />
      <label class="chk"><input type="checkbox" id="f-staff" checked /> staff pages</label>
      <button class="btn ghost sm" id="btn-clear">Reset filters</button>
    </div>
    <div id="progress"><i></i></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>

<div id="modal-root"></div>

<!-- ======================= SCRIPT ======================= -->
<script type="module" src="js/app.js?v=20"></script>
</body>
</html>
