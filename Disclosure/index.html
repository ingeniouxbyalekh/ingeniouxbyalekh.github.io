<body>

<nav class="nav">
  <div class="navin">
    <h1 class="logo">Disclosure<span>.</span></h1>
    <div class="links" id="links">
      <a href="#home">Home</a>
      <a href="#articles">Articles</a>
      <a href="#poll">Poll</a>
      <a href="#videos">Videos</a>
      <a href="#tweets">Tweets</a>
    </div>
    <div class="who" id="userbox"><a class="btn" id="li" href="login.html">Sign In</a></div>
  </div>
</nav>

<main class="wrap">
  <!-- ROW 1: BANNER + TOP HEADLINES -->
  <section class="sec" data-v="home">
    <div class="hero">
      <a class="lead" id="lead" href="#">
        <div class="lead-bg" id="leadBg"></div>
        <div class="lead-content" id="leadContent"></div>
      </a>
      <aside class="latest">
        <div class="latest-head">
          <h3>Top Headlines</h3>
          <span class="meta" id="today"></span>
        </div>
        <div class="latest-list" id="latest"></div>
      </aside>
    </div>
  </section>

  <!-- ROW 2: VIDEO / POLL / TWEET TILES -->
  <section class="sec" data-v="home">
    <div class="tiles">
      <div class="tile" id="videos">
        <div class="tile-head"><h3>Suggested video</h3><span class="meta">YouTube</span></div>
        <div class="tile-body" id="tVideo"></div>
      </div>
      <div class="tile" id="poll">
        <div class="tile-head"><h3>Poll</h3><span class="meta">Your voice</span></div>
        <div class="tile-body" id="tPoll"></div>
      </div>
      <div class="tile" id="tweets">
        <div class="tile-head"><h3>Live Update</h3><span class="meta">X / Twitter</span></div>
        <div class="tile-body" id="tTweet"></div>
      </div>
    </div>
  </section>

  <!-- ROW 3: FEATURED ARTICLES -->
  <section class="sec" data-v="home">
    <div class="sh">
      <div>
        <h2>Featured Articles</h2>
      </div>
      <a class="btn alt" href="#articles">Browse all articles →</a>
    </div>
    <div class="agrid" id="homeArts"></div>
  </section>

  <!-- ALL ARTICLES PAGE -->
  <section class="sec" data-v="articles">
    <div class="sh">
      <div>
        <h2>All Articles & Investigations</h2>
      </div>
    </div>
    <input id="search" type="search" placeholder="Search across all articles and transcripts...">
    <div class="chips" id="cats"></div>
    <div class="agrid" id="artAll"></div>
  </section>
</main>

<footer>
  <p>© Disclosure by <a href="https://ingenioux.in/" rel="noopener">Ingenioux</a> · Independent Journal</p>
</footer>

<script src="script.js"></script>
<script type="module" src="auth-nav.js"></script>
<script type="module" src="live.js"></script>
<script type="module" src="visitor.js"></script>
<script type="module" src="/datalake.js"></script>
</body>
</html>
