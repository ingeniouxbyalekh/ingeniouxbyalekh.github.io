<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · INGENIOUX</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/svg+xml" href="Storage/Images/ingenioux_round.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  /* ---------- admin-only layout (reuses variables from style.css) ---------- */
  body{min-height:100vh;}
  .admin-wrap{max-width:920px;margin:0 auto;padding:60px 24px 100px;}

  .admin-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding-bottom:22px;margin-bottom:34px;border-bottom:1px solid var(--line);
  }
  .admin-brand{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.02em;}
  .admin-brand span{color:var(--ember);}
  .admin-brand small{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-top:4px;}
  .admin-actions{display:flex;gap:10px;flex-wrap:wrap;}

  .btn{
    font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;
    border:1px solid var(--line);color:var(--text-dim);background:transparent;padding:10px 16px;
    border-radius:2px;cursor:pointer;transition:border-color .2s,color .2s,background .2s;
  }
  .btn:hover{border-color:var(--ember);color:var(--text);}
  .btn-primary{border-color:var(--ember);color:var(--ember);}
  .btn-primary:hover{background:var(--ember);color:#0b0c10;}
  .btn-danger{border-color:#5c2a2a;color:#e88888;}
  .btn-danger:hover{background:#e05c5c;border-color:#e05c5c;color:#0b0c10;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-small{padding:7px 12px;font-size:11px;}

  /* ---- login card ---- */
  .login-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{
    width:100%;max-width:380px;border:1px solid var(--line);background:var(--surface);
    border-radius:4px;padding:36px 30px;text-align:center;
  }
  .login-card .eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ember);margin-bottom:10px;
  }
  .login-card h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0 0 26px;}
  .login-card h1 span{color:var(--ember);}
  .login-field{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:18px;}
  .login-field label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);}
  .login-field input{
    width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;
    padding:13px 14px;color:var(--text);font-family:var(--font-body);font-size:14.5px;
  }
  .login-field input:focus{outline:none;border-color:var(--ember);}
  .login-hint{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);margin-top:16px;line-height:1.6;}
  .login-status{font-family:var(--font-mono);font-size:12.5px;min-height:18px;margin-top:14px;}
  .login-status.is-error{color:var(--ember);}
  .login-status.is-success{color:var(--gold);}
  .login-card .btn{width:100%;padding:14px;font-size:12.5px;}

  /* ---- dashboard ---- */
  #dashboard{display:none;}
  .stats-row{
    display:flex;gap:14px;flex-wrap:wrap;margin-bottom:30px;
  }
  .stat-chip{
    border:1px solid var(--line);background:var(--surface);border-radius:3px;
    padding:14px 18px;font-family:var(--font-mono);
  }
  .stat-chip b{display:block;font-size:22px;font-family:var(--font-display);color:var(--text);font-weight:600;}
  .stat-chip span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);}

  .panel{
    border:1px solid var(--line);background:var(--surface);border-radius:4px;
    padding:26px;margin-bottom:26px;
  }
  .panel h2{font-family:var(--font-display);font-weight:600;font-size:17px;margin:0 0 18px;}
  .panel-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .panel .field{display:flex;flex-direction:column;gap:8px;}
  .panel .field label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);}
  .panel .field input{
    background:var(--surface-2);border:1px solid var(--line);border-radius:3px;
    padding:12px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;
  }
  .panel .field input:focus{outline:none;border-color:var(--ember);}
  .panel-status{font-family:var(--font-mono);font-size:12px;margin-top:8px;min-height:16px;}
  .panel-status.is-error{color:var(--ember);}
  .panel-status.is-success{color:var(--gold);}
  @media (max-width:640px){.panel-row{grid-template-columns:1fr;}}

  .msg-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .msg-toolbar h2{margin:0;}
  .msg-filter{display:flex;gap:8px;}
  .msg-filter button{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    border:1px solid var(--line);background:transparent;color:var(--text-faint);padding:7px 13px;
    border-radius:2px;cursor:pointer;transition:.2s;
  }
  .msg-filter button.active{border-color:var(--ember);color:var(--ember);}

  .msg-list{display:flex;flex-direction:column;gap:14px;}
  .msg-empty{
    font-family:var(--font-mono);font-size:13px;color:var(--text-faint);
    border:1px dashed var(--line);border-radius:3px;padding:30px;text-align:center;
  }
  .msg-card{
    border:1px solid var(--line);background:var(--surface-2);border-radius:3px;
    padding:20px 22px;position:relative;transition:border-color .2s;
  }
  .msg-card.is-unread{border-left:3px solid var(--ember);}
  .msg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  .msg-who{font-family:var(--font-display);font-weight:600;font-size:16.5px;}
  .msg-who .badge{
    display:inline-block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ember);border:1px solid var(--ember);border-radius:20px;
    padding:2px 8px;margin-left:10px;vertical-align:2px;
  }
  .msg-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);text-align:right;}
  .msg-contact{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);margin-bottom:12px;}
  .msg-contact a{color:var(--text-dim);}
  .msg-contact a:hover{color:var(--ember);}
  .msg-subject{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;}
  .msg-body{font-size:14.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;margin-bottom:16px;}
  .msg-actions{display:flex;gap:10px;flex-wrap:wrap;}

  .loading-row{font-family:var(--font-mono);font-size:12.5px;color:var(--text-faint);padding:20px 0;text-align:center;}
</style>
</head>

<body>

<div class="noise"></div>

<!-- ================= LOGIN ================= -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Admin <span>Access</span></h1>

    <form id="loginForm">
      <div class="login-field">
        <label for="adminPassword">Admin password</label>
        <input type="password" id="adminPassword" name="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Unlock dashboard →</button>
    </form>

    <div class="login-status" id="loginStatus" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div class="admin-wrap" id="dashboard">
  <div class="admin-topbar">
    <div class="admin-brand">INGENIOU<span>X</span> <small>Admin · Messages</small></div>
    <div class="admin-actions">
      <button class="btn" id="togglePasswordPanel">Change password</button>
      <button class="btn btn-danger" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-chip"><b id="statTotal">0</b><span>Total messages</span></div>
    <div class="stat-chip"><b id="statUnread">0</b><span>Unread</span></div>
  </div>

  <!-- ---- change password panel (hidden by default) ---- -->
  <div class="panel" id="passwordPanel" style="display:none;">
    <h2>Change admin password</h2>
    <div class="panel-row">
      <div class="field">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" autocomplete="current-password">
      </div>
      <div class="field"></div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password">
      </div>
    </div>
    <button class="btn btn-primary btn-small" id="savePasswordBtn">Save new password</button>
    <div class="panel-status" id="passwordStatus"></div>
  </div>

  <!-- ---- messages ---- -->
  <div class="panel">
    <div class="msg-toolbar">
      <h2>Submitted messages</h2>
      <div class="msg-filter">
        <button data-filter="all" class="active">All</button>
        <button data-filter="unread">Unread</button>
        <button data-filter="read">Read</button>
      </div>
    </div>
    <div class="loading-row" id="msgLoading">Loading messages…</div>
    <div class="msg-list" id="msgList"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getDatabase, ref, get, set
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
  import {
    getFirestore, collection, query, orderBy, onSnapshot,
    doc, updateDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAkYWiiqp_nQc7wRE31CH3E0l0wlM-JQ9Y",
    authDomain: "ingenioux-55f27.firebaseapp.com",
    databaseURL: "https://ingenioux-55f27-default-rtdb.firebaseio.com",
    projectId: "ingenioux-55f27",
    storageBucket: "ingenioux-55f27.firebasestorage.app",
    messagingSenderId: "514072384167",
    appId: "1:514072384167:web:d2e3a4c8c024abed924182"
  };

  const app = initializeApp(firebaseConfig);
  const rtdb = getDatabase(app);
  const db = getFirestore(app);

  const ADMIN_PATH = 'adminConfig/passwordHash';
  const SESSION_KEY = 'ingenioux_admin_session';

  // ---------- helpers ----------
  async function sha256(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function setStatus(el, msg, type){
    el.textContent = msg;
    el.classList.remove('is-success','is-error');
    if(type) el.classList.add(type === 'success' ? 'is-success' : 'is-error');
  }

  function formatDate(ts){
    if(!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString(undefined, { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ---------- elements ----------
  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const loginStatus = document.getElementById('loginStatus');
  const logoutBtn = document.getElementById('logoutBtn');

  const togglePasswordPanel = document.getElementById('togglePasswordPanel');
  const passwordPanel = document.getElementById('passwordPanel');
  const savePasswordBtn = document.getElementById('savePasswordBtn');
  const passwordStatus = document.getElementById('passwordStatus');

  const msgList = document.getElementById('msgList');
  const msgLoading = document.getElementById('msgLoading');
  const statTotal = document.getElementById('statTotal');
  const statUnread = document.getElementById('statUnread');
  const filterBtns = document.querySelectorAll('.msg-filter button');

  let currentFilter = 'all';
  let allMessages = [];
  let unsubscribeMessages = null;

  // ---------- auth flow ----------
  function showDashboard(){
    loginScreen.style.display = 'none';
    dashboard.style.display = 'block';
    startMessagesListener();
  }
  function showLogin(){
    dashboard.style.display = 'none';
    loginScreen.style.display = 'flex';
    if(unsubscribeMessages){ unsubscribeMessages(); unsubscribeMessages = null; }
  }

  if(sessionStorage.getItem(SESSION_KEY) === 'true'){
    showDashboard();
  }

  loginForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const pwd = document.getElementById('adminPassword').value;
    if(!pwd){ setStatus(loginStatus, 'Enter a password.', 'error'); return; }

    loginBtn.disabled = true;
    setStatus(loginStatus, 'Checking…', null);

    try{
      const snap = await get(ref(rtdb, ADMIN_PATH));
      const hash = await sha256(pwd);

      if(!snap.exists()){
        // first-time setup: whatever is entered becomes the admin password
        await set(ref(rtdb, ADMIN_PATH), hash);
        setStatus(loginStatus, 'Admin password created. Logging in…', 'success');
      }else if(snap.val() !== hash){
        setStatus(loginStatus, 'Incorrect password.', 'error');
        loginBtn.disabled = false;
        return;
      }

      sessionStorage.setItem(SESSION_KEY, 'true');
      loginForm.reset();
      setStatus(loginStatus, '', null);
      showDashboard();
    }catch(err){
      console.error(err);
      setStatus(loginStatus, 'Could not reach the database. Try again.', 'error');
    }finally{
      loginBtn.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', ()=>{
    sessionStorage.removeItem(SESSION_KEY);
    showLogin();
  });

  // ---------- change password ----------
  togglePasswordPanel.addEventListener('click', ()=>{
    passwordPanel.style.display = passwordPanel.style.display === 'none' ? 'block' : 'none';
  });

  savePasswordBtn.addEventListener('click', async ()=>{
    const current = document.getElementById('currentPassword').value;
    const next = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if(!current || !next || !confirm){
      setStatus(passwordStatus, 'Fill in all fields.', 'error'); return;
    }
    if(next !== confirm){
      setStatus(passwordStatus, 'New passwords do not match.', 'error'); return;
    }
    if(next.length < 6){
      setStatus(passwordStatus, 'New password should be at least 6 characters.', 'error'); return;
    }

    savePasswordBtn.disabled = true;
    setStatus(passwordStatus, 'Saving…', null);

    try{
      const snap = await get(ref(rtdb, ADMIN_PATH));
      const currentHash = await sha256(current);
      if(snap.exists() && snap.val() !== currentHash){
        setStatus(passwordStatus, 'Current password is incorrect.', 'error');
        savePasswordBtn.disabled = false;
        return;
      }
      const newHash = await sha256(next);
      await set(ref(rtdb, ADMIN_PATH), newHash);
      setStatus(passwordStatus, 'Password updated.', 'success');
      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
    }catch(err){
      console.error(err);
      setStatus(passwordStatus, 'Something went wrong. Try again.', 'error');
    }finally{
      savePasswordBtn.disabled = false;
    }
  });

  // ---------- messages ----------
  function startMessagesListener(){
    if(unsubscribeMessages) return;
    const q = query(collection(db, 'contactMessages'), orderBy('createdAt', 'desc'));
    unsubscribeMessages = onSnapshot(q, (snapshot)=>{
      allMessages = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      msgLoading.style.display = 'none';
      renderMessages();
    }, (err)=>{
      console.error(err);
      msgLoading.textContent = 'Could not load messages.';
    });
  }

  function renderMessages(){
    const total = allMessages.length;
    const unread = allMessages.filter(m => !m.read).length;
    statTotal.textContent = total;
    statUnread.textContent = unread;

    let list = allMessages;
    if(currentFilter === 'unread') list = allMessages.filter(m => !m.read);
    if(currentFilter === 'read') list = allMessages.filter(m => m.read);

    if(list.length === 0){
      msgList.innerHTML = `<div class="msg-empty">No messages ${currentFilter === 'all' ? 'yet' : 'in this view'}.</div>`;
      return;
    }

    msgList.innerHTML = list.map(m => `
      <div class="msg-card ${!m.read ? 'is-unread' : ''}" data-id="${m.id}">
        <div class="msg-head">
          <div class="msg-who">${escapeHtml(m.name) || 'Unknown'} ${!m.read ? '<span class="badge">Unread</span>' : ''}</div>
          <div class="msg-meta">${formatDate(m.createdAt)}</div>
        </div>
        <div class="msg-contact">
          ${m.email ? `<a href="mailto:${escapeHtml(m.email)}">${escapeHtml(m.email)}</a>` : ''}
          ${m.phone ? ` · ${escapeHtml(m.phone)}` : ''}
        </div>
        <div class="msg-subject">${escapeHtml(m.subject) || 'No subject'}</div>
        <div class="msg-body">${escapeHtml(m.message)}</div>
        <div class="msg-actions">
          ${!m.read ? `<button class="btn btn-small mark-read-btn">Mark as read</button>` : `<button class="btn btn-small" disabled>Read</button>`}
          <button class="btn btn-small btn-danger clear-btn">Clear</button>
        </div>
      </div>
    `).join('');
  }

  msgList.addEventListener('click', async (e)=>{
    const card = e.target.closest('.msg-card');
    if(!card) return;
    const id = card.dataset.id;

    if(e.target.classList.contains('mark-read-btn')){
      e.target.disabled = true;
      try{
        await updateDoc(doc(db, 'contactMessages', id), { read: true });
      }catch(err){ console.error(err); e.target.disabled = false; }
    }

    if(e.target.classList.contains('clear-btn')){
      if(!confirm('Delete this message permanently?')) return;
      e.target.disabled = true;
      try{
        await deleteDoc(doc(db, 'contactMessages', id));
      }catch(err){ console.error(err); e.target.disabled = false; }
    }
  });

  filterBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      filterBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderMessages();
    });
  });
</script>
</body>
</html>
