<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 – Page Not Found</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/svg+xml" href="/Disclosure/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #FAFAF8; --ink: #0A0A0A; --accent: #E11D48; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0B0B0E; --ink: #F5F5F4; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; text-align: center; padding: 24px;
      background: var(--bg); color: var(--ink); font-family: Sora, system-ui, sans-serif;
      background-image: radial-gradient(700px 420px at 50% 40%, rgba(225,29,72,.14), transparent 65%);
    }
    .code { font-weight: 800; letter-spacing: -.06em; line-height: .9; font-size: clamp(6rem, 28vw, 16rem); }
    .code b { color: var(--accent); font-weight: 800; }
    .msg { margin-top: 14px; font-weight: 800; letter-spacing: .3em; text-transform: uppercase;
      font-size: clamp(.8rem, 2.6vw, 1.2rem); }
    .msg::before { content: ""; display: block; width: 56px; height: 4px; background: var(--accent);
      border-radius: 2px; margin: 0 auto 18px; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">4<b>0</b>4</div>
    <div class="msg">Page Not Found</div>
  </main>
</body>
</html>
